<!-- このファイルは tools/sites.mjs が作った写しです。直すときは、いちばん上の order.html を直して build してください。 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>モバイルオーダー</title>
    <meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E1015" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="../../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <!--
      お客様のスマホで開く注文のページ（アプリは要らない）。
      レジのプログラム（index.html）は読み込まない。軽く、すぐ開くように、このファイルだけで動く。
      ・QRコードの ?e=共有コード で、どの販売会に注文するかが決まる
      ・メニューと品切れは、レジの端末が書く live/menu を読む
      ・注文は orders に「モバイル・未払い」で書く。キッチンの画面にすぐ出る
      ・注文したあとは、その注文の状態と「あと何組」を見続け、呼び出されたら音と画面で知らせる
      ・お店が決めた「いまの待ち時間」と、いま待っている組の数を出す。お店が許していれば、受け取り時間も選べる
        （選んだ注文は、受け取りの何分前かにKDへ出る）
      ・流れ：QRコード → お店を選ぶ（?e= が無い時） → 商品 → 持ち帰り／店内 → 席番号（席から注文の時だけ） → 注文
      ・特注（氷少なめ など）も付けられる（お店が許している時）
      ・画面の形は2つ（お店が設定で選ぶ）：
          標準 … 写真の大きなメニュー・分類のタブ・おすすめの列・商品の説明の窓・下に浮かぶカート・進み具合
          シンプル … 名前と値段の一覧（前からの形。軽い）
      ・受け取りが済んだ注文は、上から消して「履歴」に入れる（右上の「履歴」から、番号と中身を見られる）
    -->
    <script src="data/site.js"></script>
    <script src="data/firebase-config.js"></script>
    <!-- 写真の無い商品に出す絵（レジが商品名から選んだ絵の印を、メニューに入れて送ってくる） -->
    <script src="../../vendor/menu-art.js"></script>
    <style>
        :root {
            --bg: #F2F3F7; --surface: #FFFFFF; --sunken: #F4F5F9; --text: #1C1D22; --sub: #5F6472;
            --hair: rgba(20, 24, 40, .12); --accent: #0A6CE0; --accent-ink: #0A5FC4; --accent-soft: #E6EFFC;
            --danger: #C0283C; --danger-bg: #FDEBEE; --ok: #2B8A4B; --ok-bg: #E0F2E5;
            --take: #C8660F; --take-bg: #FCEBDA; --eat: #2B8A4B; --eat-bg: #E0F2E5;
            --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 14px rgba(20, 24, 40, .06);
            --r: 16px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0E1015; --surface: #1B1E26; --sunken: #14171E; --text: #EDEFF4; --sub: #A9B0BF;
                --hair: rgba(255, 255, 255, .12); --accent: #1D6FD0; --accent-ink: #74B6FF; --accent-soft: #1E3B5E;
                --danger: #FF6F83; --danger-bg: #3A1820; --ok: #6FD08F; --ok-bg: #16301F;
                --take: #C8660F; --take-bg: #3A2614; --eat: #2B8A4B; --eat-bg: #16301F;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        /* 素早く2回たたいても画面が拡大しないように（連打しても1回ずつ効く） */
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        button, .item, .rec-card, .tabs { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        html, body { margin: 0; background: var(--bg); color: var(--text); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
            /* いちばん上にいる時は、端末の時刻の帯の下の「ぼかし」に文字がかからないよう、少し下げて始める
               （スクロールした時にぼける分はそのまま） */
            padding: calc(30px + env(safe-area-inset-top, 0px)) 16px calc(110px + env(safe-area-inset-bottom, 0px));
            max-width: 640px; margin: 0 auto;
        }
        h1 { font-size: 20px; margin: 4px 0 2px; }
        .sub { color: var(--sub); font-size: 13px; }
        .notice { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin: 12px 0; font-size: 14px; white-space: pre-wrap; }
        .notice.warn { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .cat { font-size: 13px; font-weight: 800; color: var(--sub); margin: 18px 4px 8px; display: flex; align-items: center; gap: 8px; }
        .cat i { width: 10px; height: 10px; border-radius: 3px; background: var(--ink, var(--hair)); }
        .item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 12px 12px 16px; margin-bottom: 8px; }
        .item .nm { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
        .item .pr { display: block; font-size: 14px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }
        .item.out { opacity: .5; }
        .item .so { font-size: 12px; font-weight: 800; color: var(--danger); background: var(--danger-bg); padding: 2px 8px; border-radius: 999px; }
        .step { display: flex; align-items: center; gap: 6px; }
        .step button { appearance: none; -webkit-appearance: none; border: none; width: 44px; height: 44px; border-radius: 12px; font-size: 22px; font-weight: 800; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); font-family: inherit; }
        .step button.plus { background: var(--accent); color: #fff; box-shadow: none; }
        .step button:disabled { opacity: .35; }
        .step .q { min-width: 1.6em; text-align: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); box-shadow: 0 -4px 16px rgba(20, 24, 40, .08); display: flex; align-items: center; gap: 12px; }
        .bar .tot { flex: 1; font-size: 13px; color: var(--sub); }
        .bar .tot b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
        .btn { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; min-height: 52px; padding: 0 22px; border-radius: 14px; font-size: 17px; font-weight: 800; background: var(--accent); color: #fff; cursor: pointer; }
        .btn:disabled { opacity: .4; cursor: default; }
        .btn.sec { background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
        .btn.full { width: 100%; }
        .dine { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 14px; }
        .dine button { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; min-height: 64px; border-radius: 16px; font-size: 18px; font-weight: 800; background: var(--surface); color: var(--text); box-shadow: var(--shadow), inset 0 0 0 2px var(--hair); cursor: pointer; }
        .dine button.on.take { background: var(--take); color: #fff; box-shadow: none; }
        .dine button.on.eat { background: var(--eat); color: #fff; box-shadow: none; }
        .lines { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 14px; margin: 10px 0; }
        /* 明細の行と合計の行だけを左右に並べる（特注の欄の中の箱には効かせない） */
        .lines > div, .lines .ln .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-variant-numeric: tabular-nums; }
        .lines .ln .row { padding: 0; }
        .lines > div.t { font-weight: 800; font-size: 18px; }
        .lines > div.disc { color: var(--accent-ink); font-weight: 700; }
        .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 18px; margin: 12px 0; text-align: center; }
        .card .k { font-size: 13px; color: var(--sub); font-weight: 700; }
        .card .no { font-size: 64px; font-weight: 900; line-height: 1.1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
        .card .st { font-size: 20px; font-weight: 800; margin-top: 6px; }
        .card .ahead { font-size: 15px; color: var(--sub); margin-top: 4px; }
        .card.ready { background: var(--ok-bg); box-shadow: inset 0 0 0 3px var(--ok), var(--shadow); animation: pop .45s cubic-bezier(.32,.72,0,1) both; }
        .card.ready .st { color: var(--ok); font-size: 24px; }
        .card.void .st { color: var(--danger); }
        .card .dn { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 800; color: #fff; padding: 3px 12px; border-radius: 999px; background: var(--take); }
        .card .dn.eat { background: var(--eat); }
        @keyframes pop { from { transform: scale(.94); } to { transform: none; } }
        .flash { animation: flash .5s ease-in-out 6 alternate; }
        @keyframes flash { from { background: var(--bg); } to { background: var(--ok-bg); } }
        .hide { display: none !important; }
        .center { text-align: center; }
        .foot { font-size: 12px; color: var(--sub); margin-top: 16px; text-align: center; }
        .wait { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--accent-soft); color: var(--accent-ink); border-radius: var(--r); padding: 12px 16px; margin: 12px 0; font-weight: 700; }
        .wait b { font-size: 22px; font-variant-numeric: tabular-nums; }
        .pick { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin: 10px 0; }
        .pick label { display: block; font-size: 13px; font-weight: 800; color: var(--sub); margin-bottom: 6px; }
        .pick select { width: 100%; min-height: 48px; font-size: 17px; font-weight: 700; font-family: inherit; border-radius: 12px; border: none; padding: 0 12px; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
        .pick .sub { margin-top: 6px; }
        /* お店の見出し（アイコンと名前） */
        .brand { display: flex; align-items: center; gap: 12px; }
        .testbar { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin: 10px 0 4px; padding: 8px 12px; border-radius: 12px; color: #fff; font-weight: 800;
            background: repeating-linear-gradient(135deg, #FF9500 0 10px, #FF8A00 10px 20px); }
        .testbar small { font-size: 12px; font-weight: 700; }
        .testbar.hide { display: none; }
        .brand img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; box-shadow: var(--shadow); }
        .brand h1 { margin: 0; }
        /* お店を選ぶ */
        .shops { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
        .shop { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; color: var(--text); cursor: pointer; min-height: 72px; }
        .shop .ico { width: 52px; height: 52px; border-radius: 12px; background: var(--sunken); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: var(--sub); }
        .shop .ico img { width: 100%; height: 100%; object-fit: cover; }
        .shop .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; }
        .shop .nm small { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-top: 2px; }
        .shop .go { font-size: 15px; font-weight: 800; color: var(--accent-ink); }
        /* 席番号 */
        .seatbox { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin: 10px 0; display: flex; align-items: center; gap: 10px; }
        .seatbox b { font-size: 20px; }
        .seatbox .sp { flex: 1; }
        .seatbox button { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; font-size: 14px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
        .sheet { position: fixed; inset: 0; background: rgba(10, 12, 18, .45); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
        .sheet .card2 { width: 100%; max-width: 420px; background: var(--surface); border-radius: 22px; padding: 18px; }
        .sheet h2 { margin: 0 0 4px; font-size: 20px; }
        .sheet input { width: 100%; min-height: 60px; font-size: 30px; font-weight: 800; text-align: center; font-family: inherit; border-radius: 14px; border: none; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); margin: 12px 0; letter-spacing: .08em; }
        /* 特注 */
        .lines > div.ln { display: block; padding: 8px 0; }
        .lines .ln .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
        .lines .ln .opt { display: block; font-size: 13px; font-weight: 800; color: var(--danger); margin-top: 2px; }
        .lines .ln .ob { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; font-size: 12.5px; font-weight: 800; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); border-radius: 999px; padding: 5px 10px; margin-left: 8px; cursor: pointer; }
        .optp { background: var(--sunken); border-radius: 12px; padding: 10px; margin-top: 8px; }
        .optp .g { margin-bottom: 8px; }
        .optp .g b { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips button { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; font-size: 14px; font-weight: 700; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); cursor: pointer; }
        .chips button.on { background: var(--accent); color: #fff; box-shadow: none; }
        .optp input { width: 100%; min-height: 40px; font-size: 16px; font-family: inherit; border-radius: 10px; border: none; padding: 0 10px; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }

        /* ---- 見出しの右の「履歴」 ---- */
        .brand .bx { flex: 1; min-width: 0; }
        .hist-btn { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
            border-radius: 999px; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 800; box-shadow: var(--shadow); cursor: pointer; }
        .hist-btn svg { width: 17px; height: 17px; }
        .hist-btn .hb-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; display: inline-grid; place-items: center; }
        .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); opacity: 0; z-index: 80; max-width: calc(100% - 32px); width: max-content;
            background: rgba(28, 29, 34, .94); color: #fff; font-size: 14px; font-weight: 700; padding: 12px 18px; border-radius: 16px; text-align: center; pointer-events: none;
            transition: opacity .25s ease, transform .3s cubic-bezier(.32,.72,0,1); }
        .toast.on { opacity: 1; transform: translate(-50%, 0); }

        /* ---- 下からせり上がる窓（商品の説明・履歴） ---- */
        .sheet:not(.hide) .card2 { animation: sheetUp .34s cubic-bezier(.32,.72,0,1) both; }
        .sheet:not(.hide) { animation: fadeIn .2s ease both; }
        @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
        @keyframes fadeIn { from { background: rgba(10, 12, 18, 0); } }
        .sheet .x { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; width: 36px; height: 36px; border-radius: 18px; background: var(--sunken); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; flex-shrink: 0; }
        .isheet { padding: 0 !important; overflow: hidden; max-height: calc(100dvh - 40px); display: flex; flex-direction: column; max-width: 520px !important; }
        .isheet .is-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .isheet .ph { aspect-ratio: 16 / 10; }
        .isheet .x { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,.9); color: #1C1D22; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
        .isheet .is-b { padding: 16px 18px 6px; }
        .isheet h2 { margin: 6px 0 2px; font-size: 22px; line-height: 1.3; }
        .isheet .is-pr { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .isheet .is-ds { color: var(--sub); font-size: 14.5px; margin-top: 8px; }
        .isheet .is-bd { display: flex; flex-wrap: wrap; gap: 4px; }
        .isheet .optp { margin-top: 12px; }
        .isheet .is-foot { display: flex; align-items: center; gap: 12px; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -1px 0 var(--hair); }
        .isheet .is-foot .btn { flex: 1; }
        .hsheet { max-height: calc(100dvh - 60px); display: flex; flex-direction: column; max-width: 520px !important; }
        .hsheet .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .hsheet .sh-head h2 { flex: 1; margin: 0; }
        .hsheet .h-list { overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px 4px; }
        .hrow { background: var(--sunken); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
        .hrow .hr-top { display: flex; align-items: baseline; gap: 8px; }
        .hrow .hno { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
        .hrow .hst { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--surface); color: var(--sub); box-shadow: inset 0 0 0 1px var(--hair); }
        .hrow .hst.act { background: var(--accent); color: #fff; box-shadow: none; }
        .hrow .hst.rdy { background: var(--ok); color: #fff; box-shadow: none; }
        .hrow .hst.vd { background: var(--danger-bg); color: var(--danger); box-shadow: none; }
        .hrow .ht { margin-left: auto; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
        .hrow .hitems { font-size: 13.5px; margin-top: 4px; overflow-wrap: anywhere; }
        .hrow .hr-bot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--sub); }
        .hrow .hr-bot b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
        .hrow .again { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; margin-left: auto; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 800; cursor: pointer; }
        .h-empty { text-align: center; color: var(--sub); font-size: 14px; padding: 24px 0; }

        /* ---- 標準の形：写真の大きなメニュー ---- */
        .hero { margin: 14px 0 4px; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
        .hero img { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; }
        body.std .wait { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
        body.std .wait b { color: var(--accent-ink); }
        .tabs { position: sticky; top: 0; z-index: 20; margin: 6px -16px 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--bg);
            display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px;
            background: var(--surface); color: var(--text); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 1px var(--hair); cursor: pointer; transition: background .2s ease, color .2s ease; }
        .tabs button.on { background: var(--text); color: var(--bg); box-shadow: none; }
        .sec { scroll-margin-top: calc(62px + env(safe-area-inset-top, 0px)); }
        body.std .cat { font-size: 19px; font-weight: 900; color: var(--text); margin: 18px 2px 10px; }
        body.std .cat i { width: 12px; height: 12px; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        body.std .item { display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0; margin: 0; overflow: hidden; border-radius: 18px; cursor: pointer; position: relative; }
        body.std .item.in { box-shadow: inset 0 0 0 2.5px var(--accent), var(--shadow); }
        .ph { position: relative; aspect-ratio: 1 / 1; background: var(--sunken); display: grid; place-items: center; overflow: hidden; }
        @supports (background: color-mix(in srgb, red 10%, white)) { .ph { background: color-mix(in srgb, var(--ink, #888) 14%, var(--surface)); } }
        .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .ph .ph-art { width: 74%; height: 74%; display: grid; place-items: center; }
        .ph .ph-art svg { width: 100%; height: 100%; display: block; }
        .rec-card .ph .ph-art, .isheet .ph .ph-art { width: 62%; height: 86%; }
        body.std .item.out .ph .ph-art { filter: grayscale(1); opacity: .6; }

        .bd { font-size: 11px; font-weight: 900; line-height: 1.2; padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
        .bd.rec { background: #FF9500; color: #fff; }
        .bd.nw { background: var(--accent); color: #fff; }
        .bd.hot { background: #E5484D; color: #fff; }
        .bd.few { color: var(--danger); }
        .bd.so { background: #1C1D22; color: #fff; }
        body.std .item .nm { padding: 10px 12px 0; font-size: 15px; line-height: 1.35; }
        body.std .item .pr { font-size: 15.5px; color: var(--text); font-weight: 800; margin-top: 2px; }
        body.std .item .ds { padding: 3px 12px 0; font-size: 12px; color: var(--sub); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        body.std .item .step { margin-top: auto; padding: 8px 10px 10px; justify-content: flex-end; }
        body.std .item .step button { width: 40px; height: 40px; border-radius: 20px; font-size: 21px; }
        body.std .item .so { margin: auto 10px 12px auto; }
        body.std .item.out .ph img { filter: grayscale(1); }
        .rec-row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .rec-row::-webkit-scrollbar { display: none; }
        .rec-card { flex: 0 0 74%; max-width: 320px; scroll-snap-align: start; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; position: relative; }
        .rec-card .ph { aspect-ratio: 16 / 10; }
        .rec-card .rb { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px 12px 14px; }
        .rec-card .rn { flex: 1; min-width: 0; font-weight: 900; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
        .rec-card .rn small { display: block; font-size: 15px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
        .rec-add { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; flex: none; width: 42px; height: 42px; border-radius: 21px; background: var(--accent); color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; }
        .rec-add:disabled { opacity: .35; }
        /* 下に浮かぶカート */
        body.std .bar { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 8px 8px 8px 12px; border-radius: 22px; box-shadow: 0 10px 30px rgba(20, 24, 40, .22);
            transition: transform .35s cubic-bezier(.32,.72,0,1), opacity .25s ease; max-width: 616px; margin: 0 auto; }
        body.std .bar.empty { transform: translateY(150%); opacity: 0; pointer-events: none; }
        .bar .bag { position: relative; width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); display: none; place-items: center; flex-shrink: 0; }
        .bar .bag svg { width: 22px; height: 22px; }
        body.std .bar .bag { display: grid; }
        .bar .bag i { position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; font-style: normal; font-weight: 800; display: grid; place-items: center; }
        /* 確かめる画面の進み具合（1 選ぶ → 2 確かめる → 3 受け取る） */
        .steps { display: none; align-items: center; gap: 6px; margin: 4px 0 12px; font-size: 12.5px; font-weight: 800; color: var(--sub); }
        body.std .steps { display: flex; }
        .steps span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .steps span b { width: 20px; height: 20px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--hair); font-size: 11.5px; }
        .steps span.on { color: var(--text); }
        .steps span.on b { background: var(--accent); color: #fff; box-shadow: none; }
        .steps i { flex: 1; height: 2px; border-radius: 1px; background: var(--hair); min-width: 10px; }
        /* 注文の進み具合（受付 → お作りしています → できあがり） */
        .prog { display: none; margin: 14px 4px 4px; }
        body.std .prog { display: block; }
        .prog .pb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .prog .pb i { height: 6px; border-radius: 3px; background: var(--hair); }
        .prog.p1 .pb i:nth-child(-n+1), .prog.p2 .pb i:nth-child(-n+2), .prog.p3 .pb i:nth-child(-n+3) { background: var(--accent); }
        .card.ready .prog .pb i { background: var(--ok); }
        .prog .pl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; font-size: 11.5px; font-weight: 800; color: var(--sub); }
        .prog .pl span:nth-child(2) { text-align: center; }
        .prog .pl span:nth-child(3) { text-align: right; }
    </style>
</head>
<body>
    <header class="brand">
        <img id="brand-icon" class="hide" alt="">
        <div class="bx"><div class="sub" id="shop"></div><h1 id="title">モバイルオーダー</h1></div>
        <!-- この端末で注文した履歴（受け取った後も、番号と中身をここから見られる） -->
        <button type="button" class="hist-btn hide" id="hist-btn" onclick="openHist()" aria-label="注文の履歴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>履歴<span class="hb-n hide" id="hist-n"></span></button>
    </header>
    <!-- 標準の形：いちばん上の絵（お店が設定した時だけ） -->
    <div id="hero" class="hero hide"></div>

    <!-- お店を選ぶ（QRコードにお店が入っていない時） -->
    <section id="shops" class="hide"></section>

    <!-- お店がテストモードの時：本物の注文ではないことを、はっきり出す -->
    <div id="testbar" class="testbar hide">テスト中<small>本物の注文ではありません</small></div>
    <!-- 読み込み中・使えない時の知らせ -->
    <div id="msg" class="notice">読み込んでいます…</div>
    <div id="note" class="notice hide"></div>
    <div id="wait" class="wait hide"></div>

    <!-- 注文した後：番号と状態 -->
    <section id="my" class="hide"></section>

    <!-- 標準の形：分類のタブ（押すとその分類へ。スクロールすると、いまの分類が光る） -->
    <nav id="tabs" class="tabs hide" aria-label="メニューの分類"></nav>
    <!-- メニュー -->
    <section id="menu" class="hide"></section>

    <!-- 確かめる画面 -->
    <section id="confirm" class="hide">
        <div class="steps" aria-hidden="true"><span class="on"><b>1</b>選ぶ</span><i></i><span class="on"><b>2</b>確かめる</span><i></i><span><b>3</b>受け取る</span></div>
        <h1>ご注文の確認</h1>
        <div class="sub" id="c-dine-sub">お召し上がりを選んでください</div>
        <div class="dine" id="c-dine" role="group" aria-label="お召し上がり">
            <button type="button" class="take" id="d-take" onclick="pickDine('take')">持ち帰り</button>
            <button type="button" class="eat" id="d-eat" onclick="pickDine('eat')">店内</button>
        </div>
        <div class="seatbox hide" id="c-seat"></div>
        <div class="lines" id="c-lines"></div>
        <div class="pick hide" id="c-pick-box">
            <label for="c-pick">受け取り時間</label>
            <select id="c-pick" onchange="pickTime(this.value)"></select>
            <div class="sub" id="c-pick-sub"></div>
        </div>
        <div class="pick hide" id="c-coupon-box">
            <label for="c-coupon">クーポンコード（お持ちの方）</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="c-coupon" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="例：FES2026" style="flex:1; min-width:0; min-height:48px; font-size:17px; font-family:inherit; border-radius:12px; border:none; padding:0 12px; background:var(--sunken); color:var(--text); box-shadow:inset 0 0 0 1px var(--hair); text-transform:uppercase;">
                <button type="button" class="btn" style="min-height:48px; padding:0 18px;" onclick="useCoupon()">使う</button>
            </div>
            <div class="sub" id="c-coupon-sub"></div>
        </div>
        <div class="notice" id="c-note">お支払いは、受け取りの時にレジでお願いします。注文すると番号が出ます。</div>
        <button class="btn full" id="c-send" onclick="sendOrder()" disabled>注文する</button>
        <button class="btn sec full" style="margin-top:8px;" onclick="showMenu()">メニューに戻る</button>
    </section>

    <!-- 席番号を入れる（席から注文の時、店内を選んだら出る） -->
    <div class="sheet hide" id="seat-sheet" role="dialog" aria-modal="true" aria-labelledby="seat-title">
        <div class="card2">
            <h2 id="seat-title">席番号を入れてください</h2>
            <div class="sub">テーブルに貼ってある番号です。できあがったら、この番号の席あてにお呼びします。</div>
            <input type="text" id="seat-input" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="例：12">
            <button class="btn full" onclick="saveSeat()">この席で注文する</button>
            <button class="btn sec full" style="margin-top:8px;" onclick="cancelSeat()">持ち帰りにもどす</button>
        </div>
    </div>

    <!-- 商品の説明と、数を選ぶ窓（標準の形で、商品を押した時） -->
    <div class="sheet hide" id="item-sheet" role="dialog" aria-modal="true" aria-label="商品"><div class="card2 isheet" id="item-body"></div></div>
    <!-- 注文の履歴 -->
    <div class="sheet hide" id="hist-sheet" role="dialog" aria-modal="true" aria-labelledby="hist-title">
        <div class="card2 hsheet">
            <div class="sh-head"><h2 id="hist-title">注文の履歴</h2><button type="button" class="x" onclick="closeHist()" aria-label="閉じる">×</button></div>
            <div class="h-list" id="hist-list"></div>
        </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 下の合計（標準の形では、下に浮かぶカート） -->
    <div class="bar hide" id="bar">
        <span class="bag" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><i id="b-bag">0</i></span>
        <div class="tot">合計（<span id="b-n">0</span>点）<b id="b-total">¥0</b></div>
        <button class="btn" id="b-next" onclick="showConfirm()" disabled>注文へ進む</button>
    </div>

<script>
(function () {
    'use strict';
    const SITE = window.SITE || {};
    const COL = /^[A-Za-z0-9_-]{1,64}$/.test(String(SITE.eventsCollection || '')) ? SITE.eventsCollection : 'events';
    const PRE = SITE.id && /^[A-Za-z0-9_-]{1,32}$/.test(SITE.id) ? SITE.id + ':' : '';
    const MAX_EACH = 10, MAX_ITEMS = 20, MAX_ACTIVE = 3;
    const $ = id => document.getElementById(id);
    // 押せる所の外（すき間・文字）を素早く2回たたいた時の拡大を止める（押せる所の連打は、そのまま1回ずつ効く）
    (function () {
        let last = 0;
        const tappable = el => {
            for (let n = el; n && n.nodeType === 1 && n !== document.body; n = n.parentElement) {
                if (n.onclick || /^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL|SUMMARY|OPTION)$/.test(n.tagName) || n.isContentEditable || n.hasAttribute('data-open')) return true;
            }
            return false;
        };
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - last < 320 && e.cancelable && e.changedTouches && e.changedTouches.length === 1 && !tappable(e.target)) e.preventDefault();
            last = now;
        }, { passive: false });
    })();
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const yen = n => '¥' + Number(n || 0).toLocaleString('ja-JP');
    let code = (new URLSearchParams(location.search).get('e') || '').replace(/[^0-9A-Za-z_-]/g, '').slice(0, 32);
    // レストラン：テーブルに置いたQRには、テーブルの番号（t）が入っている
    const tableNo = (() => { const v = String(new URLSearchParams(location.search).get('t') || '').trim(); return /^[0-9]{1,3}$/.test(v) && Number(v) > 0 ? String(parseInt(v, 10)) : ''; })();
    function restMode() { return !!(evData && evData.storeMode === 'restaurant'); }
    const INK = { sweet: '#4A6FA5', savory: '#14837E', drink: '#5D5BC4', x1: '#A86A12', x2: '#B83A5E', x3: '#3E8A3A', x4: '#B85420', x5: '#8A3E96', x6: '#6F7A1E', x7: '#1F7FA6', x8: '#7A5238' };

    let db = null, uid = '', ev = null, evData = null, menu = null, orders = [];
    const qty = {};          // 商品名 → 個数
    let dine = '';           // 'take' / 'eat'
    let pickAt = 0;          // 選んだ受け取り時間（0 はできしだい）
    let seat = '';           // 席番号（席から注文の時）
    let coupon = null;       // 使うクーポン { id, name, kind, amount, note }
    const optSel = {};       // 商品名 → 特注の選んだもの
    let optOpen = '';        // 特注の欄を開いている商品名
    let sending = false;
    let audio = null;
    const seenReady = new Set();
    const mineKey = () => PRE + 'mo_orders:' + code;
    function loadMine() { try { return JSON.parse(localStorage.getItem(mineKey()) || '[]') || []; } catch (e) { return []; } }
    function saveMine(list) { try { localStorage.setItem(mineKey(), JSON.stringify(list.slice(-10))); } catch (e) {} }
    let mine = loadMine();
    // ---- 注文の履歴（この端末で注文したもの。受け取った後も、番号と中身をここから見られる）----
    const histKey = () => PRE + 'mo_hist:' + code;
    function loadHist() { try { const v = JSON.parse(localStorage.getItem(histKey()) || '[]'); return Array.isArray(v) ? v.filter(h => h && h.id) : []; } catch (e) { return []; } }
    function saveHist() { try { localStorage.setItem(histKey(), JSON.stringify(hist.slice(-30))); } catch (e) {} }
    let hist = loadHist();
    function histOf(o) {
        return { id: o.id, no: String(o.no || ''), at: Number(o.at) || Date.now(), dine: o.dine === 'eat' ? 'eat' : 'take', total: Number(o.total) || 0, st: String(o.st || 'cook'),
            paid: !!o.paid, seat: o.seat ? String(o.seat) : '', table: o.table ? String(o.table) : '', bill: !!o.billId, pk: pickupOf(o),
            items: (o.items || []).map(i => ({ name: String(i.name || ''), qty: Number(i.qty) || 1, opt: i.opt ? String(i.opt) : '' })) };
    }
    // 届いた注文の今の状態を、履歴にも書き写す（変わった時だけ保存）
    function syncHist() {
        let changed = false;
        hist.forEach((h, k) => {
            const o = orders.find(x => x.id === h.id);
            if (!o) return;
            const n = histOf(o);
            if (JSON.stringify(n) !== JSON.stringify(h)) { hist[k] = n; changed = true; }
        });
        if (changed) saveHist();
    }
    function addHist(o) { hist = hist.filter(h => h.id !== o.id).concat([histOf(o)]); saveHist(); }
    // 標準の形で使う、商品の写真（live/menuimg）と、いちばん上の絵（live/mhero）
    let imgs = {}, imgKeyNow = '', imgRetryAt = 0, heroAtNow = 0, heroData = '';
    let toastTimer = null;
    function toast(text) {
        const t = $('toast');
        if (!t) return;
        t.textContent = text;
        t.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
    }

    function say(text, warn) {
        const m = $('msg');
        if (!text) { m.classList.add('hide'); return; }
        m.classList.remove('hide');
        m.classList.toggle('warn', !!warn);
        m.textContent = text;
    }

    function loadSdk() {
        const base = 'https://www.gstatic.com/firebasejs/10.12.5/';
        const files = ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js'];
        return files.reduce((p, f) => p.then(() => new Promise((ok, ng) => {
            const s = document.createElement('script'); s.src = base + f; s.onload = ok; s.onerror = () => ng(new Error(f)); document.head.appendChild(s);
        })), Promise.resolve());
    }

    async function start() {
        if (!window.FIREBASE_CONFIG) { say('このお店は、モバイルオーダーの準備ができていません。店頭でご注文ください。', true); return; }
        try {
            if (!window.firebase || !window.firebase.firestore) await loadSdk();
            const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(window.FIREBASE_CONFIG);
            db = firebase.firestore(app);
            try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
            const cred = await firebase.auth(app).signInAnonymously();
            uid = (cred && cred.user && cred.user.uid) || (firebase.auth(app).currentUser || {}).uid || '';
        } catch (e) {
            say('つながりませんでした。電波の良い所で、ページを読み込み直してください。', true);
            return;
        }
        if (!code) { listShops(db); return; }
        attach(db);
    }

    // ---- お店を選ぶ（いま受付中のお店だけを並べる）----
    async function listShops(database, userId) {
        db = database; if (userId) uid = userId;
        say('お店を探しています…');
        let rows = [];
        try {
            const snap = await db.collection(COL).where('status', '==', 'open').get();
            const now = Date.now();
            snap.forEach(d => {
                const v = d.data() || {};
                if (!v.mobile || v.mobile.on !== true || !Array.isArray(v.products)) return;
                if (v.storeMode === 'restaurant') return;       // レストランはテーブルのQRから
                if ((Number(v.openedAt) || 0) < now - 24 * 3600000) return;     // 前の日から開いたままのものは出さない
                rows.push({ code: d.id, test: !!v.test, name: String(v.mobile.shop || v.name || 'お店'), icon: typeof v.mobile.icon === 'string' && v.mobile.icon.startsWith('data:image/') ? v.mobile.icon : '', wait: Number(v.mobile.wait) || 0 });
            });
        } catch (e) { say('お店の一覧を読めませんでした。電波の良い所で、ページを読み込み直してください。', true); return; }
        rows.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
        const box = $('shops');
        if (!rows.length) { say('ただいま、スマホから注文できるお店はありません。店頭でご注文ください。', true); box.classList.add('hide'); return; }
        say('');
        $('title').textContent = 'お店を選んでください';
        box.classList.remove('hide');
        box.innerHTML = `<div class="shops">${rows.map(r => `<button type="button" class="shop" data-c="${esc(r.code)}">
                <span class="ico">${r.icon ? `<img src="${r.icon}" alt="">` : esc(r.name.slice(0, 1))}</span>
                <span class="nm">${r.test ? '【テスト】' : ''}${esc(r.name)}${r.wait ? `<small>待ち時間 約${r.wait}分</small>` : ''}</span>
                <span class="go">注文する</span></button>`).join('')}</div>`;
        box.querySelectorAll('.shop').forEach(b => b.onclick = () => chooseShop(b.dataset.c));
    }
    window.__attachOrderList = listShops;
    function chooseShop(c) {
        code = String(c || '').replace(/[^0-9A-Za-z_-]/g, '').slice(0, 32);
        if (!code) return;
        try { history.pushState(null, '', location.pathname + '?e=' + encodeURIComponent(code)); } catch (e) {}
        $('shops').classList.add('hide');
        mine = loadMine();
        window.scrollTo(0, 0);
        attach(db);
    }
    // 戻る操作で、お店を選ぶ画面に戻る
    window.addEventListener('popstate', () => { if (!new URLSearchParams(location.search).get('e')) location.reload(); });

    // テストや、ほかの入口からも使えるように、つなぐ部分を分けておく
    function attach(database, userId) {
        db = database; if (userId) uid = userId;
        ev = db.collection(COL).doc(code);
        ev.onSnapshot(doc => { evData = doc.exists ? (doc.data() || {}) : null; render(); }, () => say('つながりが切れました。電波を確かめてください。', true));
        ev.collection('live').doc('menu').onSnapshot(doc => { menu = doc.exists ? (doc.data() || null) : null; render(); }, () => {});
        ev.collection('orders').onSnapshot(snap => {
            const rows = [];
            snap.forEach(d => { const v = d.data() || {}; if (v && v.id) rows.push(v); });
            orders = rows;
            renderMine();
            renderWait();
        }, () => {});
    }
    window.__attachOrderPage = attach;

    function open() { return !!(evData && evData.status === 'open'); }
    function accepting() { return open() && !!(evData.mobile && evData.mobile.on) && !!(menu && menu.on !== false); }
    // お店の設定（index.html の normMobileCfg と同じ決まりで読む）
    function cfg() {
        const m = (evData && evData.mobile) || {};
        const int = (v, lo, hi, def) => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= lo && n <= hi ? n : def; };
        return { wait: int(m.wait, 0, 180, 0), pick: m.pick === true, lead: int(m.lead, 1, 120, 10), ahead: int(m.ahead, 30, 720, 120), seat: m.seat === true, opt: m.opt !== false,
            ui: m.ui === 'simple' ? 'simple' : 'std', heroAt: Number(m.heroAt) > 0 ? Number(m.heroAt) : 0 };
    }
    const hm = ms => { const d = new Date(ms); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
    function pickupOf(o) {
        const n = Number(o.pickupAt) || 0, at = Number(o.at) || 0;
        return (n > at && n - at < 13 * 3600000) ? n : 0;
    }
    // その注文を作り始める時刻（キッチンの画面と同じ決まり）
    function startOf(o) {
        const at = Number(o.at) || 0, p = pickupOf(o), rel = Number(o.rel) || 0;
        let s = p ? Math.max(at, p - cfg().lead * 60000) : at;
        if (rel && rel < s) s = Math.max(at, rel);
        return s;
    }
    function heldNow(o, now) { return o.st === 'cook' && !!pickupOf(o) && !(Number(o.rel) > 0) && now < startOf(o); }
    // 選べる受け取り時間（10分ごと）。いちばん早いのは、作る時間と待ち時間を見込んだ時刻
    const SLOT = 10 * 60000;
    function pickSlots(now) {
        const c = cfg();
        const first = Math.ceil((now + Math.max(c.lead, c.wait, 10) * 60000) / SLOT) * SLOT;
        const out = [];
        for (let t = first; t <= now + c.ahead * 60000 && out.length < 72; t += SLOT) out.push(t);
        return out;
    }

    // ---- セット割（index.html の normSetRule・setDiscountFor と同じ決まり）----
    // 販売会の文書の setDiscount（オン・オフ）と setRule（組み合わせ・額・引き方）を読む。
    // 決めた種類を同じ注文で全部買うと、1注文に1回だけ引く。割引率は、組み合わせ1セットぶん
    // （それぞれの種類でいちばん安い1品ずつ）の合計にかけ、1円未満は切り捨て。
    function setRuleNow() {
        if (!evData || evData.setDiscount !== true) return null;
        const r = evData.setRule;
        if (!r || typeof r !== 'object' || !Array.isArray(r.needs)) return null;
        const needs = [...new Set(r.needs.map(String))];
        const amount = Math.floor(Number(r.amount));
        const pct = r.kind === 'pct';
        if (needs.length < 2 || !(amount >= 1) || amount > (pct ? 90 : 999)) return null;
        return { needs, amount, pct, item: r.by === 'item' };
    }
    // lines … { type, price, qty } の並び
    function setDiscOf(lines) {
        const r = setRuleNow();
        if (!r || !lines.length) return 0;
        // 分類で決めたセットは分類（type）、商品で決めたセットは商品の名前で見る
        const of = t => lines.filter(l => (r.item ? l.name : l.type) === t && (Number(l.price) || 0) > 0 && (Number(l.qty) || 0) > 0);
        if (!r.needs.every(t => of(t).length)) return 0;
        if (!r.pct) return r.amount;
        const base = r.needs.reduce((sum, t) => sum + Math.min(...of(t).map(l => Number(l.price))), 0);
        return Math.floor(base * r.amount / 100);
    }
    // 割引の内訳（セット割とクーポン。クーポンはセット割を引いた後の額にかける。「併用しない」ならセット割は引かない）
    function discParts(lines, cp) {
        const gross = lines.reduce((t, l) => t + l.qty * l.price, 0);
        let set = setDiscOf(lines), c = 0;
        if (cp) {
            if (cp.solo) set = 0;
            const base = Math.max(0, gross - set);
            c = cp.kind === 'pct' ? Math.floor(base * cp.amount / 100) : Math.min(cp.amount, base);
        }
        return { gross, set, coupon: c, net: Math.max(0, gross - set - c) };
    }
    function shopName() { return (evData && ((evData.mobile && evData.mobile.shop) || evData.name)) || ''; }
    // いま作っている（待っている）組の数
    function waitingGroups() { const now = Date.now(); return orders.filter(o => o.st === 'cook' && !heldNow(o, now)).length; }
    function render() {
        const shop = $('shop');
        if (evData) {
            const nm = shopName();
            $('title').textContent = nm || 'モバイルオーダー';
            shop.textContent = restMode() && tableNo ? `${tableNo}番テーブル` : (nm ? 'モバイルオーダー' : '');
            document.title = (nm ? nm + '｜' : '') + 'モバイルオーダー';
            const icon = evData.mobile && evData.mobile.icon;
            const im = $('brand-icon');

        }
        $('testbar').classList.toggle('hide', !(evData && evData.test && open()));
        document.body.classList.toggle('std', stdUi());

        renderHistBtn();
        const note = $('note');

        renderWait();
        if (!evData) { say('このお店の注文は受け付けていません（QRコードをもう一度お確かめください）。', true); hideOrdering(); renderMine(); return; }
        if (!open()) { say('本日の受付は終了しました。ありがとうございました。', true); hideOrdering(); renderMine(); return; }
        if (!accepting()) {

            say(m || 'ただいま、スマホからの注文を止めています。店頭でご注文ください。', true);

        if (!menu || !Array.isArray(menu.items)) { say('メニューを読み込んでいます…'); hideOrdering(); renderMine(); return; }

    // お店の待ち時間（お店が決めた目安）と、いま待っている組の数
    function renderWait() {

    // 商品の写真：メニューの印（imgKey）が変わった時だけ、まとめて読み直す
    function loadImgs() {
        const k = (menu && typeof menu.imgKey === 'string') ? menu.imgKey : '';
        if (!stdUi() || !k || k === imgKeyNow || !ev || Date.now() < imgRetryAt) return;

            imgs = next;

    }

    function activeMine() {
        return mine.map(id => orders.find(o => o.id === id)).filter(o => o && o.st !== 'done' && o.st !== 'void');
    }

    // 数の − ＋ は、メニューの箱で1か所だけ受ける（作り直しても、押した1回がそのまま効く）
    let menuBound = false;
    function bindMenu() {

    // スクロールに合わせて、いま見ている分類のタブを光らせる
    let spyQueued = false, tabLock = 0;
    function spyTabs() {

        const top = tabs.getBoundingClientRect().bottom + 8;
        let cur = '';
        document.querySelectorAll('#menu .sec').forEach(sc => { if (sc.getBoundingClientRect().top <= top) cur = sc.id; });
        if (!cur) { const f = document.querySelector('#menu .sec'); cur = f ? f.id : ''; }

    function setTab(id) {
        const tabs = $('tabs');
        tabs.querySelectorAll('button').forEach(b => {
            const on = b.dataset.sec === id;
            if (b.classList.contains('on') === on) return;
            b.classList.toggle('on', on);
            if (on) { const l = b.offsetLeft - 16, r = l + b.offsetWidth + 32; if (l < tabs.scrollLeft || r > tabs.scrollLeft + tabs.clientWidth) tabs.scrollTo({ left: Math.max(0, l), behavior: 'smooth' }); }
        });
    }
    function menuGroups() {
        const cats = Array.isArray(menu.cats) ? menu.cats : [];
        const groups = cats.map(c => ({ c, items: menu.items.filter(i => i.type === c.id) })).filter(g => g.items.length);
        const other = menu.items.filter(i => !cats.some(c => c.id === i.type));

    }
    // 札（おすすめ・新商品・人気・残りわずか・売り切れ）
    function badgesHtml(i) {

    // 写真（無い時は、分類の色の上に名前の1文字目を大きく）
    function photoHtml(i) {

    // 標準の形：前と同じ並びなら、中身の変わったカードだけを書き換える（写真がちらつかず、スクロールもずれない）
    let stdStruct = '', stdCards = {};
    function renderStdMenu(box, groups) {

                + groups.map((g, k) => `<div class="sec" id="sec-${k}"><div class="cat" style="--ink:${INK[g.c.id] || 'var(--hair)'}"><i></i>${esc(g.c.label)}</div><div class="grid">${g.items.map(i => cards['c:' + i.name]).join('')}</div></div>`).join('');

    function renderMenu() {

                    <button type="button" aria-label="${esc(i.name)}を1つ減らす" ${q ? '' : 'disabled'} data-n="${esc(i.name)}" data-d="-1">−</button>

    function cartLines() {
        return Object.keys(qty).filter(n => qty[n] > 0).map(n => {
            const it = menu.items.find(i => i.name === n);
            return it ? { name: n, qty: qty[n], price: it.price, type: it.type, opt: cfg().opt ? buildOpt(optSel[n]) : '' } : null;
        }).filter(Boolean);
    }
    // ---- 特注（index.html の OPT_GROUPS と同じ言葉。お客様には「追加」は出さない）----
    const OPT_GROUPS = [
        { id: 'order', label: '出すタイミング', multi: true, items: ['後出し'] },
        { id: 'ice', label: '氷', pre: '氷', items: ['抜き', '少なめ', '多め'] },
        { id: 'fill', label: '具材', pre: '具材', items: ['抜き', '少なめ', '多め'] },
        { id: 'sauce', label: 'ソース', pre: 'ソース', items: ['抜き', '少なめ', '多め'] }
    ];
    function buildOpt(sel) {
        if (!sel) return '';
        const parts = [];
        (sel.order || []).forEach(x => parts.push(x));
        OPT_GROUPS.slice(1).forEach(g => { if (sel[g.id]) parts.push(g.pre + sel[g.id]); });
        const other = String(sel.other || '').replace(/[・<>]/g, ' ').trim().slice(0, 20);
        if (other) parts.push(other);
        return parts.join('・').slice(0, 60);
    }
    function optOf(name) { return optSel[name] || (optSel[name] = { order: [], ice: '', fill: '', sauce: '', other: '' }); }
    // 商品名は data-n に入れて渡す（名前に記号が入っていても壊れないように）
    function bindOptButtons() {
        const box = $('c-lines');
        box.querySelectorAll('[data-optp]').forEach(b => b.onclick = () => { optOpen = optOpen === b.dataset.optp ? '' : b.dataset.optp; renderConfirm(); });
        box.querySelectorAll('[data-og]').forEach(b => b.onclick = () => {

    function renderBar() {
        const lines = cartLines();
        const n = lines.reduce((t, l) => t + l.qty, 0);

    function change(name, d) {
        const all = Object.values(qty).reduce((t, v) => t + v, 0);
        const next = Math.max(0, Math.min(MAX_EACH, (qty[name] || 0) + d));
        if (d > 0 && all >= MAX_ITEMS) return;

        renderMenu();
    }
    // ---- 商品の窓（標準の形）：写真・説明・札・特注・数を選んで、カートに入れる ----
    let itemOpen = '', itemQty = 1;
    function openItem(name) {
        if (!menu || !stdUi()) return;
        const it = menu.items.find(i => i.name === name);
        if (!it) return;

    function closeItem() { itemOpen = ''; const sh = $('item-sheet'); if (sh) sh.classList.add('hide'); }
    window.closeItem = closeItem;
    // 窓を開いている間に売り切れ・値段が変わったら、窓も描き直す
    function refreshItem() { if (itemOpen && !$('item-sheet').classList.contains('hide')) drawItem(); }
    function drawItem() {
        const it = menu && menu.items.find(i => i.name === itemOpen);
        if (!it) { closeItem(); return; }
        const inCart = qty[it.name] || 0, n = esc(it.name), sel = optSel[it.name] || {};
        const c0 = cfg();
        const opts = c0.opt && !it.soldOut ? `<div class="optp"><div class="g"><b>特注（任意）</b></div>${OPT_GROUPS.map(g => `<div class="g"><b>${g.label}</b><div class="chips">${g.items.map(x => {
            const on = g.multi ? (sel.order || []).includes(x) : sel[g.id] === x;

    $('item-sheet').onclick = e => { if (e.target === $('item-sheet')) closeItem(); };
    // ---- 注文の履歴 ----
    function histStatus(h) {

    function renderHistBtn() {
        const b = $('hist-btn');

                <div class="hitems">${items}</div>
                <div class="hr-bot"><span>${h.bill ? esc(h.table) + '番テーブル' : (h.dine === 'eat' ? '店内' : '持ち帰り')}</span><b>${yen(h.total)}</b>${accepting() && menu && (restMode() === h.bill) ? `<button type="button" class="again" data-h="${esc(h.id)}">もう一度 同じものを</button>` : ''}</div></div>`;

    window.closeHist = function () { $('hist-sheet').classList.add('hide'); };
    $('hist-sheet').onclick = e => { if (e.target === $('hist-sheet')) closeHist(); };
    // 前と同じものをカートに入れる（売り切れ・もう無い商品は入れない）
    function again(id) {
        const h = hist.find(x => x.id === id);
        if (!h || !menu) return;
        let n = 0, skip = 0;
        h.items.forEach(i => {
            const it = menu.items.find(x => x.name === i.name);
            const all = Object.values(qty).reduce((t, v) => t + v, 0);
            if (!it || it.soldOut || all >= MAX_ITEMS) { skip++; return; }
            const add = Math.min(i.qty, MAX_EACH - (qty[i.name] || 0), MAX_ITEMS - all);

    window.showConfirm = function () {

    window.pickDine = function (d) {

    window.saveSeat = function () {
        const v = String($('seat-input').value || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9A-Za-z-]/g, '').slice(0, 8);

    window.cancelSeat = function () {

    window.pickTime = function (v) { pickAt = Number(v) || 0; renderConfirm(); };
    // ---- クーポン（index.html の couponHash と同じ作り方の印で比べる。コードそのものは置き場に無い）----
    function couponHash(code) {
        const t = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
        if (!t) return '';
        const fnv = seed => { let h = seed >>> 0; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); };
        return fnv(2166136261) + fnv(0x9747b28c ^ t.length);
    }
    function codeCoupons() { return ((evData && Array.isArray(evData.coupons)) ? evData.coupons : []).filter(c => c && c.on !== false && c.codeHash); }
    window.useCoupon = function () {
        const h = couponHash($('c-coupon').value);
        const c = h ? codeCoupons().find(x => x.codeHash === h) : null;
        if (!c) { coupon = null; $('c-coupon-sub').textContent = 'そのコードのクーポンはありません。'; renderConfirm(); return; }
        coupon = { id: String(c.id), name: String(c.name || 'クーポン'), kind: c.kind === 'pct' ? 'pct' : 'yen', amount: Number(c.amount) || 0, note: String(c.note || ''), solo: c.solo === true };

    function renderConfirm() {
        const lines = cartLines();

        $('c-note').textContent = rm ? 'お料理はお席までお持ちします。お支払いは、お帰りの時にレジでお願いします（テーブルの伝票でまとめてお会計）。'
            : 'お支払いは、受け取りの時にレジでお願いします。注文すると番号が出ます。';
        $('d-take').classList.toggle('on', dine === 'take');
        $('d-eat').classList.toggle('on', dine === 'eat');
        const tot = lines.reduce((t, l) => t + l.qty * l.price, 0);
        const c0 = cfg();
        const dp = discParts(lines, coupon);
        $('c-lines').innerHTML = lines.map(l => {
            const sel = optSel[l.name] || {};
            const n = esc(l.name);
            const panel = c0.opt && optOpen === l.name ? `<div class="optp">${OPT_GROUPS.map(g => `<div class="g"><b>${g.label}</b><div class="chips">${g.items.map(it => {
                    const on = g.multi ? (sel.order || []).includes(it) : sel[g.id] === it;

                }).join('')}</div></div>`).join('')}<div class="g"><b>そのほか（20文字まで）</b><input type="text" id="opt-other-in" data-n="${n}" maxlength="20" value="${esc(sel.other || '')}" placeholder="例：からし抜き"></div></div>` : '';
            return `<div class="ln"><div class="row"><span>${n} ×${l.qty}${c0.opt ? `<button type="button" class="ob" data-optp="${n}">${optOpen === l.name ? '閉じる' : '特注'}</button>` : ''}</span><span>${yen(l.qty * l.price)}</span></div>${l.opt ? `<span class="opt">${esc(l.opt)}</span>` : ''}${panel}</div>`;
        }).join('')
            + (dp.set > 0 ? `<div class="disc"><span>セット割</span><span>−${yen(dp.set)}</span></div>` : '')
            + `<div class="t"><span>合計</span><span>${yen(tot - dp.set)}</span></div>`;
        bindOptButtons();
        // 席番号（席から注文で、店内の時）
        const sb = $('c-seat');
        const needSeat = dine === 'eat' && c0.seat && !rm;
        sb.classList.toggle('hide', !needSeat || !seat);
        if (needSeat && seat) sb.innerHTML = `<span>席番号</span><b>${esc(seat)}</b><span class="sp"></span><button type="button" onclick="openSeat()">変える</button>`;
        // 受け取り時間（お店が許している時だけ）。時間がたって選べなくなった時刻は、できしだいに戻す
        const c = cfg(), box = $('c-pick-box');

            const slots = pickSlots(Date.now());
            if (pickAt && !slots.includes(pickAt)) pickAt = 0;
            const sel = $('c-pick');
            // 選んでいる最中に閉じてしまわないよう、選択肢が変わった時だけ作り直す

                    + slots.map(t => `<option value="${t}">${hm(t)}ごろ</option>`).join('');

            $('c-pick-sub').textContent = pickAt ? `${hm(pickAt)}ごろにお渡しできるよう、少し前から作り始めます。` : 'できあがったら、この画面でお知らせします。';
        } else pickAt = 0;
        // クーポン（お店がコード付きのクーポンを出している時だけ）
        const cb = $('c-coupon-box');

        if (coupon) {
            const off = coupon.kind === 'pct' ? `${coupon.amount}%引き` : `${coupon.amount}円引き`;
            $('c-coupon-sub').textContent = `「${coupon.name}」（${off}${coupon.solo ? '・セット割と併用しない' : ''}）を使います。お支払いの時にレジで引きます（クーポンを引いた目安：${yen(dp.net)}）。${coupon.note ? coupon.note : ''}`;
        }
        const send = $('c-send');
        const seatMissing = dine === 'eat' && c0.seat && !seat && !rm;
        send.disabled = !dine || !lines.length || sending || seatMissing;
        send.textContent = sending ? '送っています…' : (!dine ? 'お召し上がりを選んでください' : (seatMissing ? '席番号を入れてください' : '注文する'));
    }

    // 音は、ボタンを押した時にしか鳴らせない（スマホの決まり）。注文を押した時に準備しておく
    function unlockAudio() {
        try {
            audio = audio || new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === 'suspended') audio.resume();
            const o = audio.createOscillator(), g = audio.createGain();
            g.gain.value = 0.0001; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.05);
        } catch (e) {}
    }
    function chime() {
        try {
            if (!audio) return;
            [0, 0.18, 0.36].forEach((t, i) => {
                const o = audio.createOscillator(), g = audio.createGain();
                o.frequency.value = [1047, 1319, 1568][i]; o.type = 'sine';
                g.gain.setValueAtTime(0.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.3);
                o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.32);
            });
        } catch (e) {}
    }

    window.sendOrder = async function () {
        if (sending) return;
        const lines = cartLines();
        if (!dine || !lines.length || !accepting()) return;
        if (dine === 'eat' && cfg().seat && !seat) { openSeat(); return; }
        if (activeMine().length >= MAX_ACTIVE) { alert(`一度に注文できるのは${MAX_ACTIVE}件までです。受け取ってから、次の注文をしてください。`); return; }
        unlockAudio();
        sending = true; renderConfirm();
        if (restMode()) {
            try { await sendTableOrder(lines); }
            catch (e) { alert('送れませんでした。電波の良い所で、もう一度お試しください。'); }
            finally { sending = false; render(); }
            return;
        }
        try {
            // 番号は 持ち帰りなら M・店内なら T ＋ 4けた（千の位の 0 がモバイルの印。M0001、T0002 …）。
            // ほかのお客様とぶつからないよう、置き場で1つずつ数える。
            // （レジは E・O ＋ 千の位がレジの番号。E1001、O2003 … なので、見ただけでどこの注文か分かる）
            const seqRef = ev.collection('live').doc('mseq');
            const n = await db.runTransaction(async tx => {
                const s = await tx.get(seqRef);
                const cur = s.exists ? (Number((s.data() || {}).n) || 0) : 0;
                tx.set(seqRef, { n: cur + 1 });
                return cur + 1;
            });
            const at = Date.now();
            const id = 'm-' + (uid || 'x').slice(0, 10) + '-' + at;

            const gross = items.reduce((t, l) => t + l.qty * l.price, 0);
            const discount = setDiscOf(items);
            const total = Math.max(0, gross - discount);
            // 選んだ時刻が、もう過ぎそうなら「できしだい」にする
            const pickupAt = (cfg().pick && pickAt > at + 5 * 60000) ? pickAt : 0;
            const doc = {
                id, no: (dine === 'eat' ? 'T' : 'M') + String(n % 1000).padStart(4, '0'), at, dine, items, st: 'cook', channel: 'mobile', paid: false, total,

            alert('注文を送れませんでした。電波を確かめて、もう一度お試しください。');

    };

    // 受け取りが済んだ注文は、すぐにこの画面の上から消して「履歴」に入れる（はじめの画面に戻る）。
    // 前の注文の番号が残っていると、次に注文した時や、別のお店で買った時に、どの番号か分からなくなるため。
    // 番号と中身は、右上の「履歴」からいつでも見られる。取り消された注文だけは、気づけるように長めに残す。
    const VOID_SHOW_MS = 10 * 60000;
    const doneSeenAt = {};
    const seenActive = new Set();     // この画面を開いている間に「まだ済んでいない」のを見た注文
    function dropFinished() {
        const now = Date.now();
        let thanks = false;
        const keep = mine.filter(id => {
            const o = orders.find(x => x.id === id);
            if (!o) return true;          // まだ届いていない（送った直後など）注文は消さない
            // レストラン：料理を運んだ後も、お会計が済むまで（伝票が閉じるまで）残す
            if (o.billId && o.st !== 'void') { if (!o.paid) { seenActive.add(id); return true; } }
            else if (o.st !== 'done' && o.st !== 'void') { seenActive.add(id); return true; }
            if (!hist.some(h => h.id === id)) addHist(o);
            if (o.st === 'void') {
                if (!doneSeenAt[id]) doneSeenAt[id] = now;
                return now - doneSeenAt[id] < VOID_SHOW_MS;
            }
            if (seenActive.has(id)) thanks = true;
            return false;
        });
        if (keep.length !== mine.length) {
            mine = keep; saveMine(mine);
            if (thanks) toast('お受け取りありがとうございました。番号は右上の「履歴」から見られます');
        }
    }
    setInterval(() => { const before = mine.length; dropFinished(); if (mine.length !== before) render(); }, 3000);
    // レストラン：テーブルの伝票を開いて（もう開いていればそこへ）注文を足す。
    // 伝票・テーブルの印・伝票番号の数をまとめて読み書きする（同じ瞬間に別の人が注文しても、伝票が2枚にならない）
    async function sendTableOrder(lines) {
        const tref = ev.collection('tables').doc(tableNo);
        const seqRef = ev.collection('live').doc('bseq');
        const roundId = (evData && evData.roundId) || '';
        const bill = await db.runTransaction(async tx => {
            const tsnap = await tx.get(tref);
            const cur = tsnap.exists ? String((tsnap.data() || {}).bill || '') : '';
            if (cur) {
                const bsnap = await tx.get(ev.collection('bills').doc(cur));
                const bd = bsnap.exists ? bsnap.data() : null;
                if (bd && bd.st === 'open' && (bd.roundId || '') === roundId) return bd;
            }
            const ssnap = await tx.get(seqRef);
            const n = (ssnap.exists ? (Number((ssnap.data() || {}).n) || 0) : 0) + 1;
            const doc = { id: 'b-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7), no: n, table: tableNo, st: 'open', at: Date.now(), by: 'mobile', roundId, paid: {}, pays: [] };
            tx.set(ev.collection('bills').doc(doc.id), doc);
            tx.set(tref, { bill: doc.id, roundId });
            tx.set(seqRef, { n });
            return doc;
        });
        const at = Date.now();
        const id = 'm-' + (uid || 'x').slice(0, 10) + '-' + at;
        const items = lines.map(l => { const it = { name: l.name, qty: l.qty, price: l.price, type: l.type || 'sweet' }; if (l.opt) it.opt = l.opt; return it; });
        const doc = {
            id, no: String(bill.no).padStart(4, '0'), table: tableNo, billId: bill.id, at, dine: 'eat', items, st: 'cook', channel: 'mobile', paid: false,
            total: items.reduce((t, l) => t + l.qty * l.price, 0), uid, roundId, upd: at, chk: [], t: {}, dev: ''
        };
        await ev.collection('orders').doc(id).set(doc);
        mine.push(id); saveMine(mine); addHist(doc);
        Object.keys(qty).forEach(k => delete qty[k]);
        Object.keys(optSel).forEach(k => delete optSel[k]);
        dine = ''; optOpen = '';
        $('confirm').classList.add('hide');
        window.scrollTo(0, 0);
    }
    function renderMine() {
        const box = $('my');
        syncHist();
        dropFinished();
        renderHistBtn();
        const list = mine.map(id => orders.find(o => o.id === id)).filter(Boolean);
        if (!list.length || !$('confirm').classList.contains('hide')) { box.classList.add('hide'); box.innerHTML = ''; return; }
        box.classList.remove('hide');
        let anyReady = false;
        const now = Date.now();
        box.innerHTML = list.slice().reverse().map(o => {
            // 「あと何組」は、いま作っている注文のうち、先に作り始めた注文の数（予約で待っている注文は数えない）
            const myStart = startOf(o);
            const ahead = orders.filter(x => x.st === 'cook' && !heldNow(x, now) && startOf(x) < myStart).length;
            const pk = pickupOf(o);
            let cls = '', st = '', sub = '';
            if (o.billId) {
                // レストラン：料理は席まで運ぶ
                if (o.paid) st = 'ありがとうございました';
                else if (o.st === 'void') { cls = 'void'; st = 'この注文は取り消されました'; sub = 'くわしくはお店の人にお尋ねください'; }
                else if (o.st === 'done') { st = 'お持ちしました'; sub = 'お支払いは、お帰りの時にレジで（伝票でまとめてお会計）'; }
                else if (o.st === 'ready') { cls = 'ready'; st = 'できあがりました'; sub = 'まもなくお席までお持ちします'; }
                else { st = 'お作りしています'; sub = 'できたらお席までお持ちします'; }
            }
            else if (o.st === 'ready') { cls = 'ready'; st = 'できあがりました！'; sub = '受け取り口へお越しください'; anyReady = true; }
            else if (o.st === 'done') { st = 'お受け取りありがとうございました'; }
            else if (o.st === 'void') { cls = 'void'; st = 'この注文は取り消されました'; sub = 'くわしくは店頭でお尋ねください'; }
            else if (heldNow(o, now)) { st = `受け取り ${hm(pk)}ごろ`; sub = `ご注文を受け付けました。${hm(myStart)}ごろから作り始めます`; }
            else { st = 'お作りしています'; sub = (ahead ? `あと ${ahead} 組` : 'まもなくできあがります') + (pk ? `（受け取り ${hm(pk)}ごろ）` : ''); }
            const items = (o.items || []).map(i => `${esc(i.name)}${i.opt ? '（' + esc(i.opt) + '）' : ''}×${i.qty}`).join('、');
            // 進み具合（標準の形だけ）：受付 → お作りしています → できあがり
            const pn = o.st === 'void' ? 0 : o.st === 'ready' || o.st === 'done' ? 3 : heldNow(o, now) ? 1 : 2;
            const prog = pn ? `<div class="prog p${pn}" aria-hidden="true"><div class="pb"><i></i><i></i><i></i></div><div class="pl"><span>受付</span><span>お作りしています</span><span>${o.billId ? 'お持ちします' : 'できあがり'}</span></div></div>` : '';
            return `<div class="card ${cls}">
                <div class="k">${esc(shopName() || '')}${shopName() ? ' の' : ''}${o.billId ? `${esc(o.table)}番テーブル・伝票番号` : 'ご注文の番号'}</div>
                <div class="no">${esc(String(o.no || '') + (o.seat ? '-' + o.seat : ''))}</div>
                <div class="st">${st}</div>
                ${sub ? `<div class="ahead">${sub}</div>` : ''}
                ${prog}
                ${o.billId ? '' : `<span class="dn ${o.dine === 'eat' ? 'eat' : ''}">${o.dine === 'eat' ? '店内' : '持ち帰り'}</span>`}
                <div class="sub" style="margin-top:10px;">${items}</div>
                ${o.st !== 'void' && !o.paid && !o.billId ? `<div class="sub" style="margin-top:6px;">受け取りの時に、この番号を見せてレジで ${yen(o.total)} をお支払いください${Number(o.discount) > 0 ? `（セット割 −${yen(o.discount)} を引いた額）` : ''}${o.coupon && o.coupon.name ? `。クーポン「${esc(o.coupon.name)}」は、レジで引きます` : ''}</div>` : ''}
            </div>`;
        }).join('') + (list.some(o => o.st === 'cook') ? '<div class="foot">この画面を開いたままにしてください。できあがると、音と画面でお知らせします（画面を消すと、お知らせが届きません）。</div>' : '');
        // 呼び出されたら、音・振動・画面の色で知らせる（初めて呼び出された時だけ）
        list.forEach(o => {
            if (o.st === 'ready' && !seenReady.has(o.id)) {
                seenReady.add(o.id);
                chime();
                try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
                document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
            }
        });
        document.title = (anyReady ? '【できあがり】' : '') + ((evData && evData.name) || 'モバイルオーダー');
        if (menu && accepting() && $('confirm').classList.contains('hide')) {
            const full = activeMine().length >= MAX_ACTIVE;
            $('menu').classList.toggle('hide', full);
            $('bar').classList.toggle('hide', full);
        }
    }

    // 受け取り時間を待っている注文は、作り始める時刻になったら「お作りしています」に変える。
    // 受け取り時間の選択肢も、時間がたつと選べなくなるので作り直す
    setInterval(() => {
        if (orders.length) renderMine();
        if (!$('confirm').classList.contains('hide') && menu) renderConfirm();
    }, 30000);

    if (!window.__ORDER_PAGE_TEST) start();
})();
</script>
</body>
</html>
