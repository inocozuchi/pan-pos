<!-- このファイルは tools/sites.mjs が作った写しです。直すときは、いちばん上の yoyaku.html を直して build してください。 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ご予約</title>
    <meta name="theme-color" content="#FFF4F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1430" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <!--
      お客様のスマホで開く予約のページ（予約帳）。レジのプログラム（index.html）とは別に動く。
      ・?b=予約帳の印 で、どの予約帳かが決まる（管理のページ yoyaku-kanri.html で作る）
      ・?b=…&r=予約の印 で、その予約の控え（いまの状態）を出す
      ・予約は books/{予約帳}/resv に書く。予約はだれにも消せない（firestore.rules）
      ・送る前に予約の印をこの端末に覚えておき、送れたか分からない時も同じ印で送り直す（二重にならない）
      ・絵（シュトーレン・星・紙の模様）は、すべてこのファイルの中で描いた物。字は端末の文字で出す（画像に焼き込まない）
    -->
    <script src="data/firebase-config.js"></script>
    <style>
        :root {
            /* きらめく夢心地パステル */
            --pink: #FFC0D9; --sky: #A0E9FF; --peach: #FFBFA9; --purple: #8E7AB5;
            --paper: #FFF4F1; --card: #FFFFFF; --sunk: #FBEFF3;
            --ink: #2A2140; --ink-2: #5E5278; --ink-3: #6F6390; --purple-ink: #6A5698; --line: rgba(42, 33, 64, .14);
            --btn: #5E4A93; --btn-ink: #FFFFFF; --btn-offset: #FFC0D9;
            --ok: #1F7A55; --ok-bg: #DDF5EA; --warn: #9A4A12; --warn-bg: #FFEBDD; --bad: #B4233F; --bad-bg: #FFE3EA;
            --crust: #C98551; --bread: #EFB57F; --sugar: #FFFDF8;
            --blob-a: rgba(255, 192, 217, .75); --blob-b: rgba(160, 233, 255, .62); --blob-c: rgba(255, 191, 169, .66);
            --dot: rgba(142, 122, 181, .22);
            --noise-o: .55;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
            --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
            --r: 22px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #1A1430; --card: #251D40; --sunk: #2E2550;
                --ink: #F7F0FF; --ink-2: #CBBFE6; --ink-3: #9C90BC; --purple-ink: #B9A6E6; --line: rgba(247, 240, 255, .16);
                --btn: #FFC0D9; --btn-ink: #2A2140; --btn-offset: #8E7AB5;
                --ok: #7FE0B4; --ok-bg: rgba(60, 190, 130, .16); --warn: #FFC79C; --warn-bg: rgba(255, 160, 90, .14); --bad: #FF9DB3; --bad-bg: rgba(255, 90, 130, .15);
                --blob-a: rgba(255, 140, 190, .28); --blob-b: rgba(90, 190, 240, .22); --blob-c: rgba(255, 150, 120, .2);
                --dot: rgba(200, 180, 255, .16);
                --noise-o: .3;
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        h1, h2, h3, p { text-wrap: pretty; word-break: auto-phrase; }
        body {
            margin: 0; min-height: 100svh; font-family: var(--font); color: var(--ink); line-height: 1.6;
            background: var(--paper); overflow-x: hidden; font-feature-settings: "palt" 1;
        }
        /* 紙の手ざわり（ノイズ）。動かさない */
        .paper::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: var(--noise-o);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .45 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }
        /* 背景：やわらかい色の丸が、ゆっくり漂う（transform だけで動かす） */
        .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg i { position: absolute; width: 72vmax; height: 72vmax; border-radius: 50%; }
        .bg .a { left: -30vmax; top: -30vmax; background: radial-gradient(closest-side, var(--blob-a), transparent); animation: driftA 26s var(--ease-in-out) infinite alternate; }
        .bg .b { right: -36vmax; top: 8vh; background: radial-gradient(closest-side, var(--blob-b), transparent); animation: driftB 31s var(--ease-in-out) infinite alternate; }
        .bg .c { left: -16vmax; bottom: -44vmax; background: radial-gradient(closest-side, var(--blob-c), transparent); animation: driftC 29s var(--ease-in-out) infinite alternate; }
        .bg .grain { position: absolute; inset: 0; }
        @keyframes driftA { to { transform: translate3d(14vmax, 10vmax, 0) scale(1.08); } }
        @keyframes driftB { to { transform: translate3d(-12vmax, 14vmax, 0) scale(.94); } }
        @keyframes driftC { to { transform: translate3d(10vmax, -12vmax, 0) scale(1.06); } }

        main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 120px); }

        /* ---- 見出し ---- */
        .hero { position: relative; text-align: center; padding: 8px 4px 6px; }
        .hero.wait { visibility: hidden; }
        .shop { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--ink-2); padding: 4px 12px; border-radius: 99px; background: color-mix(in srgb, var(--card) 70%, transparent); box-shadow: 0 0 0 1px var(--line); }
        .shop:empty { display: none; }
        .kicker { margin: 14px 0 0; font-size: 15px; font-weight: 700; letter-spacing: .12em; color: var(--purple-ink); }
        .riso { position: relative; display: inline-block; margin: 2px 0 0; font-size: clamp(26px, 7.4vw, 44px); word-break: auto-phrase; text-wrap: balance; line-height: 1.22; font-weight: 800; letter-spacing: .02em; color: var(--ink); }
        .riso .t { position: relative; z-index: 2; }
        /* ずらして重ねる（版画のような、色のずれ） */
        .riso::before, .riso::after { content: attr(data-text); content: attr(data-text) / ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .riso::before { color: var(--pink); transform: translate(.07em, .06em); }
        .riso::after { color: var(--sky); transform: translate(-.05em, -.035em); opacity: .9; }
        @media (prefers-color-scheme: dark) { .riso::before { color: #B0477A; } .riso::after { color: #2E7FA6; } }
        .art { position: relative; width: min(320px, 84%); margin: 6px auto 0; aspect-ratio: 16 / 10; }
        .art .dots { position: absolute; inset: 6% 12% 4%; border-radius: 50%; background: radial-gradient(var(--dot) 1.6px, transparent 1.9px) 0 0 / 11px 11px; transform: rotate(-6deg); }
        .art svg { position: relative; width: 100%; height: 100%; overflow: visible; }
        .lead { margin: 6px auto 0; max-width: 34em; font-size: 15px; color: var(--ink-2); white-space: pre-wrap; }
        .lead:empty { display: none; }
        .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 700; color: var(--ink); background: var(--card); box-shadow: 0 0 0 1px var(--line), 3px 3px 0 var(--chip-o, var(--sky)); }
        .chip b { color: var(--ink-2); font-weight: 700; }
        .chip.open { --chip-o: var(--pink); }
        .chip.open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3BC48A; box-shadow: 0 0 0 3px rgba(59, 196, 138, .22); }
        .chip.shut::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }

        /* ---- 段の印（えらぶ・お名前・かくにん） ---- */
        .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 4px 14px; padding: 5px; border-radius: 99px; background: color-mix(in srgb, var(--card) 76%, transparent); box-shadow: 0 0 0 1px var(--line); }
        .steps[hidden] { display: none; }
        .steps .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 99px; background: var(--ink); transition: transform 380ms var(--ease-in-out); }
        .steps span { position: relative; z-index: 1; text-align: center; font-size: 13px; font-weight: 700; padding: 6px 0; color: var(--ink-2); transition: color 240ms ease; }
        .steps span.on { color: var(--paper); }
        .steps span i { font-style: normal; font-variant-numeric: tabular-nums; margin-right: 4px; opacity: .7; }

        /* ---- カード（紙＋ずれた色の版） ---- */
        .card { position: relative; isolation: isolate; border-radius: var(--r); padding: 18px; color: var(--ink); }
        .card::before { content: ""; position: absolute; inset: 0; z-index: -2; border-radius: inherit; background: var(--off, var(--pink)); transform: translate(6px, 7px); transition: transform 220ms var(--ease-out), background-color 220ms ease; }
        .card > .face { position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--card); box-shadow: 0 0 0 1.5px var(--ink); overflow: hidden; }
        @media (prefers-color-scheme: dark) { .card > .face { box-shadow: 0 0 0 1.5px rgba(247, 240, 255, .5); } }
        .stack { display: grid; gap: 18px; }
        #view { position: relative; }

        /* 品のカード */
        .item { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; transition: transform 220ms var(--ease-out); }
        .item.has { --off: var(--sky); }
        .item.has::before { transform: translate(4px, 5px); }
        .item.has { transform: translate(2px, 2px); }
        .item .pic { width: 64px; height: 64px; border-radius: 18px; background: var(--sunk); display: grid; place-items: center; flex-shrink: 0; position: relative; overflow: hidden; }
        .item .pic::before { content: ""; position: absolute; inset: 0; background: radial-gradient(var(--dot) 1.3px, transparent 1.6px) 0 0 / 8px 8px; }
        .item .pic svg { position: relative; width: 52px; height: 40px; }
        .item h3 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 800; }
        .item .desc { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
        .item .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; grid-column: 1 / -1; }
        .price { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
        .left { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 2px 8px; border-radius: 99px; background: var(--sunk); vertical-align: 2px; }
        .left.low { color: var(--warn); background: var(--warn-bg); }
        .left.none { color: var(--bad); background: var(--bad-bg); }
        .stepper { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 99px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
        .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--card); color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); font: inherit; cursor: pointer; touch-action: manipulation; transition: transform 140ms var(--ease-out), opacity 160ms ease; }
        .stepper button.plus { background: var(--ink); color: var(--paper); }
        .stepper button:active { transform: scale(.9); }
        .stepper button:disabled { opacity: .3; cursor: default; transform: none; }
        .stepper svg { width: 18px; height: 18px; }
        .num { position: relative; display: inline-block; width: 2.2ch; height: 1.4em; overflow: hidden; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.4; }
        .num > b { position: absolute; inset: 0; font-weight: inherit; }

        /* 入力 */
        .field { display: block; }
        .field + .field { margin-top: 16px; }
        .field .lab { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .field .lab small { font-size: 12px; font-weight: 700; color: var(--ink-3); }
        .field .lab .req { font-size: 11px; color: var(--bad); background: var(--bad-bg); padding: 1px 7px; border-radius: 99px; }
        .field input { width: 100%; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink); padding: 14px 16px; border-radius: 16px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1.5px var(--line); outline: none; transition: box-shadow 180ms ease, background-color 180ms ease; }
        .field input::placeholder { color: var(--ink-3); font-weight: 500; }
        .field input:focus { background: var(--card); box-shadow: inset 0 0 0 2px var(--purple), 0 0 0 4px color-mix(in srgb, var(--purple) 22%, transparent); }
        .field.bad input { box-shadow: inset 0 0 0 2px var(--bad); }
        .field .err { min-height: 0; font-size: 13px; font-weight: 700; color: var(--bad); margin-top: 6px; }
        .field .err:empty { display: none; }
        .hint { font-size: 12.5px; color: var(--ink-2); margin: 14px 2px 0; }

        /* 確かめ */
        .sum { display: grid; gap: 10px; }
        .sum .line { display: flex; justify-content: space-between; gap: 12px; font-size: 15.5px; }
        .sum .line span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
        .sum hr { border: 0; border-top: 2px dashed var(--line); margin: 4px 0; width: 100%; }
        .sum .tot { font-size: 19px; font-weight: 800; }
        .who { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
        .who dt { color: var(--ink-2); font-weight: 700; }
        .who dd { margin: 0; font-weight: 800; word-break: break-all; }
        .ttl { margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--purple-ink); }
        .note { border-radius: 16px; padding: 12px 14px; font-size: 14px; font-weight: 700; }
        .note.warn { background: var(--warn-bg); color: var(--warn); }
        .note.bad { background: var(--bad-bg); color: var(--bad); }
        .note.ok { background: var(--ok-bg); color: var(--ok); }
        .note.info { background: color-mix(in srgb, var(--sky) 30%, var(--card)); color: var(--ink); }
        .note p { margin: 0; }
        .note p + p { margin-top: 6px; }

        /* ボタン（押すと、紙に押しこむように版のずれがなくなる） */
        .btn { position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; padding: 14px 22px; border: 0; border-radius: 99px; font: inherit; font-size: 17px; font-weight: 800; letter-spacing: .04em; color: var(--btn-ink); background: none; cursor: pointer; touch-action: manipulation; transition: transform 160ms var(--ease-out); }
        .btn::before { content: ""; position: absolute; inset: 0; z-index: -2; border-radius: inherit; background: var(--btn-offset); transform: translate(4px, 5px); transition: transform 160ms var(--ease-out); }
        .btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--btn); }
        .btn:active:not(:disabled) { transform: translate(3px, 4px); }
        .btn:active:not(:disabled)::before { transform: translate(1px, 1px); }
        .btn:disabled { cursor: default; opacity: .45; }
        .btn.sub { color: var(--ink); }
        .btn.sub::after { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--ink); }
        .btn.sub::before { background: var(--sky); }
        .btn.ghost { min-height: 48px; color: var(--ink-2); font-size: 15px; }
        .btn.ghost::before, .btn.ghost::after { display: none; }
        .btn.ghost:active { transform: scale(.97); }
        .btn .lbl { display: inline-flex; align-items: center; gap: 8px; transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out), filter 180ms ease; }
        .btn .spin { position: absolute; width: 24px; height: 24px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; opacity: 0; transform: scale(.6); transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out); }
        .btn.busy .lbl { opacity: 0; transform: translateY(-8px); filter: blur(2px); }
        .btn.busy .spin { opacity: 1; transform: scale(1); animation: spin 700ms linear infinite; }
        .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btns { display: grid; gap: 14px; margin-top: 22px; }
        .btns.two { grid-template-columns: 1fr 1fr; }
        .btns.two .btn { padding: 14px 10px; font-size: 15.5px; white-space: nowrap; letter-spacing: 0; }

        /* 下の合計の帯 */
        .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateY(115%); transition: transform 320ms var(--ease-drawer); pointer-events: none; }
        .bar.show { transform: none; pointer-events: auto; }
        .bar .in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 20px; border-radius: 99px; background: var(--ink); color: var(--paper); box-shadow: 0 10px 30px rgba(42, 33, 64, .28), 5px 6px 0 var(--pink); }
        .bar .tot { flex: 1; min-width: 0; line-height: 1.25; }
        .bar .tot small { display: block; font-size: 12px; opacity: .75; font-weight: 700; }
        .bar .tot b { display: inline-block; font-size: 20px; font-variant-numeric: tabular-nums; }
        .bar .go { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 99px; padding: 13px 20px; font: inherit; font-size: 16px; font-weight: 800; color: #2A2140; background: var(--pink); cursor: pointer; touch-action: manipulation; transition: transform 140ms var(--ease-out); }
        .bar .go:active { transform: scale(.95); }
        .bar .go svg { width: 18px; height: 18px; }

        /* 予約できた：切符 */
        .done-head { text-align: center; margin: 4px 0 18px; }
        .done-head h2 { margin: 0; font-size: 26px; font-weight: 800; }
        .done-head p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
        .ticket { --off: var(--sky); padding: 0; overflow: visible; }
        .ticket > .face { -webkit-mask: radial-gradient(circle 13px at 0 var(--cut, 132px), transparent 12.5px, #000 13px) left / 51% 100% no-repeat, radial-gradient(circle 13px at 100% var(--cut, 132px), transparent 12.5px, #000 13px) right / 51% 100% no-repeat; mask: radial-gradient(circle 13px at 0 var(--cut, 132px), transparent 12.5px, #000 13px) left / 51% 100% no-repeat, radial-gradient(circle 13px at 100% var(--cut, 132px), transparent 12.5px, #000 13px) right / 51% 100% no-repeat; }
        .ticket .top { position: relative; height: 132px; padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: var(--r) var(--r) 0 0; overflow: hidden; }
        .ticket .top::before { content: ""; position: absolute; inset: 0; background: radial-gradient(color-mix(in srgb, var(--pink) 70%, transparent) 2px, transparent 2.4px) 0 0 / 13px 13px; opacity: .8; }
        .ticket .top > * { position: relative; }
        .ticket .no small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .2em; color: var(--ink-2); }
        .ticket .no b { display: block; font-size: 56px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
        .ticket .st { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
        .st.new { background: var(--ink); color: var(--paper); }
        .st.done { background: var(--ok-bg); color: var(--ok); }
        .st.cancel { background: var(--bad-bg); color: var(--bad); }
        .st.wait { background: var(--warn-bg); color: var(--warn); }
        .ticket .cut { margin: 0 22px; border-top: 2.5px dashed var(--line); }
        .ticket .body { padding: 16px 20px 20px; display: grid; gap: 14px; }
        .ticket .qr { display: flex; gap: 14px; align-items: center; }
        .ticket .qr .q { width: 92px; height: 92px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); }
        .ticket .qr .q svg { width: 100%; height: 100%; display: block; }
        .ticket .qr p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
        .pickup { white-space: pre-wrap; font-size: 14.5px; font-weight: 700; }
        .pickup:empty { display: none; }

        /* この端末の予約 */
        .mine h4 { margin: 28px 4px 10px; font-size: 13px; letter-spacing: .14em; color: var(--ink-2); }
        .mine a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--card) 82%, transparent); box-shadow: 0 0 0 1px var(--line); transition: transform 140ms var(--ease-out); }
        .mine a + a { margin-top: 8px; }
        .mine a:active { transform: scale(.98); }
        .mine .n { flex-shrink: 0; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: var(--pink); color: #2A2140; font-weight: 800; font-variant-numeric: tabular-nums; }
        .mine .t { flex: 1; min-width: 0; font-size: 14px; }
        .mine .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mine .t span { color: var(--ink-2); }
        .mine svg { width: 18px; height: 18px; color: var(--ink-3); flex-shrink: 0; }

        /* 受付していない時 */
        .shut-card { text-align: center; padding: 28px 20px; }
        .shut-card h2 { margin: 6px 0 4px; font-size: 22px; }
        .shut-card p { margin: 0; color: var(--ink-2); font-size: 15px; }
        .shut-card svg { width: 84px; height: 84px; }

        /* 読み込み中のかたち */
        .ghost-line { height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
        .loading { display: grid; gap: 18px; }
        .loading .card { height: 124px; }

        .foot { margin: 34px 4px 0; text-align: center; font-size: 12px; color: var(--ink-3); }
        .foot p { margin: 2px 0; }

        /* 知らせ */
        .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20; max-width: min(92vw, 460px); padding: 12px 18px; border-radius: 18px; font-size: 14.5px; font-weight: 700; color: var(--paper); background: var(--ink); box-shadow: 0 10px 30px rgba(42, 33, 64, .3); transform: translate(-50%, -140%); opacity: 0; transition: transform 300ms var(--ease-out), opacity 200ms ease; pointer-events: none; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        /* 出てくる時の動き（はじめて開いた時だけ。少しずつずらして出る） */
        .rise { animation: rise 720ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }
        .riso.rise::before { animation: inkA 900ms var(--ease-out) both; animation-delay: 160ms; }
        .riso.rise::after { animation: inkB 900ms var(--ease-out) both; animation-delay: 220ms; }
        @keyframes inkA { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(.07em, .06em); opacity: 1; } }
        @keyframes inkB { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(-.05em, -.035em); opacity: .9; } }
        /* シュトーレンの絵 */
        .art .loaf { transform-origin: 50% 85%; transform-box: fill-box; }
        .art.rise .loaf { animation: loafIn 900ms var(--ease-out) both; animation-delay: 140ms; }
        @keyframes loafIn { from { transform: translateY(14px) scale(.9) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
        .art .sugar { transform-box: fill-box; transform-origin: 50% 0; }
        .art.rise .sugar { animation: sugarIn 700ms var(--ease-out) both; animation-delay: 520ms; }
        @keyframes sugarIn { from { transform: scaleY(.2) translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
        .art .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s var(--ease-in-out) infinite; animation-delay: calc(var(--d, 0) * 1s); }
        @keyframes twinkle { 0%, 100% { transform: scale(.7) rotate(0deg); opacity: .55; } 50% { transform: scale(1.08) rotate(20deg); opacity: 1; } }
        .art .bob { animation: bob 5s var(--ease-in-out) infinite alternate; }
        @keyframes bob { to { transform: translateY(-5px); } }
        .shake { animation: shake 380ms var(--ease-out); }
        @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
        .pop { animation: pop 420ms var(--ease-out); }
        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }

        /* 紙ふぶき（予約できた時だけ） */
        .fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
        .fx i { position: absolute; left: 0; top: 0; display: block; }

        /* ホバー（マウスの時だけ） */
        @media (hover: hover) and (pointer: fine) {
            .btn:hover:not(:disabled)::before { transform: translate(5px, 6px); }
            .mine a:hover { box-shadow: 0 0 0 1.5px var(--purple); }
            .stepper button:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--purple); }
        }
        /* 動きを減らす：移動・形の動きを止め、色と不透明度だけ残す */
        @media (prefers-reduced-motion: reduce) {
            .bg i, .art .tw, .art .bob { animation: none !important; }
            .rise, .art.rise .loaf, .art.rise .sugar, .riso.rise::before, .riso.rise::after { animation: fadeOnly 300ms ease both !important; }
            .shake, .pop { animation: none !important; }
            .card::before, .btn, .btn::before, .item, .bar, .steps .pill, .toast { transition-property: opacity, background-color, color !important; }
            .bar.show { transform: none; }
            .bar:not(.show) { opacity: 0; transform: none; }
        }
        @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        [hidden] { display: none !important; }
    </style>
</head>

<script>
(function () {
    'use strict';
    const Y = window.Yoyaku;
    const $ = id => document.getElementById(id);
    const esc = Y.esc, yen = Y.yen;
    const qs = new URLSearchParams(location.search);
    const bid = (qs.get('b') || '').trim();
    const ridQ = (qs.get('r') || '').trim();
    const MINE = 'mine_' + bid, PEND = 'pend_' + bid;
    const ORDER = ['pick', 'info', 'check'];

    let c = null, book = null, tally = { n: 0, c: {} }, items = [];
    let step = '', cart = {}, form = { name: '', sid: '' }, dupN = 0, sending = false, fails = 0, last = null, sendErr = '';
    let resvOff = null, pendMem = null, checking = false;
    // 送る前の予約の印（この端末に保存できない時も、この画面の間は覚えておく。二重にならないように）
    const getPend = () => Y.lsGet(PEND, null) || pendMem;
    function setPend(p) { pendMem = p; Y.lsSet(PEND, p); }
    function clearPend() { pendMem = null; try { localStorage.removeItem(Y.LS + PEND); } catch (e) {} }

    // ---- 小さな道具 ----
    let toastT = 0;
    function toast(text) {
        const t = $('toast');
        t.textContent = text;
        t.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove('show'), 2600);
    }
    const calm = () => Y.calm();
    function mine() { const a = Y.lsGet(MINE, []); return Array.isArray(a) ? a.filter(x => x && Y.isRid(x.rid)) : []; }
    function remember(rec) {
        const a = mine().filter(x => x.rid !== rec.rid);
        a.push(rec);
        Y.lsSet(MINE, a.slice(-20));
    }
    const sidLabel = () => (book && book.sidLabel) || '学籍番号';
    const maxQty = () => Math.max(1, Math.min(50, Number(book && book.maxQty) || 10));
    const cartQty = () => Object.values(cart).reduce((s, n) => s + n, 0);
    const cartYen = () => items.reduce((s, it) => s + it.price * (cart[it.id] || 0), 0);
    const linesOf = () => items.filter(it => cart[it.id] > 0).map(it => ({ id: it.id, name: it.name, price: it.price, n: cart[it.id] }));
    function stateText() {
        const s = Y.bookState(book);
        if (s === 'open') return book.to ? `受付中・${Y.dt(book.to)}まで` : '受付中';
        if (s === 'before') return `受付は ${Y.dt(book.from)} から`;
        if (s === 'off') return 'いまは受付を止めています';
        return '受付は終わりました';
    }
    function receiptUrl(rid) {
        const u = new URL(location.href);
        u.search = '?b=' + encodeURIComponent(bid) + '&r=' + encodeURIComponent(rid);
        u.hash = '';
        return u.toString();
    }

    // ---- 数字が転がるように変わる（上へ・下へ） ----
    function roll(el, text, up) {
        if (!el) return;
        const cur = el.querySelector('b:last-child');
        if (cur && cur.textContent === String(text)) return;
        if (calm() || !cur || !el.animate) { el.innerHTML = `<b>${esc(text)}</b>`; return; }
        el.querySelectorAll('b').forEach((b, i, all) => { if (i < all.length - 1) b.remove(); });
        const nb = document.createElement('b');
        nb.textContent = text;
        el.appendChild(nb);
        const d = up ? 1 : -1;
        cur.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: `translateY(${-70 * d}%)`, opacity: 0 }], { duration: 200, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' }).onfinish = () => cur.remove();
        nb.animate([{ transform: `translateY(${70 * d}%)`, opacity: 0, filter: 'blur(2px)' }, { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }], { duration: 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    }

    // ---- 見出し ----
    let heroShown = false;
    function paintHero() {
        if (!heroShown) {
            heroShown = true;
            const h = $('hero');
            h.classList.remove('wait');
            h.querySelectorAll('[style*="--i"]').forEach(el => el.classList.add('rise'));
        }
        $('shop').textContent = (book && book.shop) || '';
        const title = (book && book.title) || 'ご予約';
        // 「12月 シュトーレンのご予約」→ 小見出し「12月」と大見出しに分ける
        const m = title.match(/^(\d{1,2}月)\s*(.+)$/);
        $('kicker').textContent = m ? m[1] : '';
        $('kicker').hidden = !m;
        const big = m ? m[2] : title;
        const h = $('title');
        h.dataset.text = big;
        h.querySelector('.t').textContent = big;
        document.title = title;
        $('lead').textContent = (book && book.lead) || '';
        const s = Y.bookState(book);
        $('chips').innerHTML = book ? `<span class="chip ${s === 'open' ? 'open' : 'shut'}">${esc(stateText())}</span>${book.pickup ? `<span class="chip"><b>受け取り</b>${esc(String(book.pickup).split('\n')[0].slice(0, 40))}</span>` : ''}` : '';
        $('foot-priv').textContent = `お名前と${sidLabel()}は、予約の受け渡しのためだけに使います。`;
    }

    // ---- 段の切り替え（出る方向に合わせて、なめらかに入れ替える） ----
    function paintSteps() {
        const nav = $('steps');
        const k = ORDER.indexOf(step);
        nav.hidden = k < 0 || Y.bookState(book) !== 'open';
        if (k < 0) return;
        $('pill').style.transform = `translateX(${k * 100}%)`;
        nav.querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.s === step));
    }
    function go(next, opts) {
        opts = opts || {};
        const prev = step;
        step = next;
        const view = $('view');
        const html = paneHtml(next);
        const back = ORDER.indexOf(next) >= 0 && ORDER.indexOf(prev) > ORDER.indexOf(next);
        const old = view.firstElementChild;
        const pane = document.createElement('div');
        pane.className = 'pane';
        pane.innerHTML = html;
        paintSteps();
        paintBar();
        const instant = calm() || !old || !pane.animate || opts.instant || old.id === 'loading';
        if (instant) {
            view.innerHTML = '';
            view.appendChild(pane);
            if (old && old.id === 'loading' && !calm()) pane.querySelectorAll('.card, .mine, .btns').forEach((el, i) => { el.classList.add('rise'); el.style.setProperty('--i', String(i + 4)); });
            else if (calm() && old && pane.animate) pane.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' });
            afterPaint(next);
            return;
        }
        const dx = back ? -1 : 1;
        // 古い面は速く消し、新しい面はゆっくり出す
        const r = old.getBoundingClientRect();
        old.style.cssText = `position:absolute;left:${old.offsetLeft}px;top:${old.offsetTop}px;width:${r.width}px;pointer-events:none`;
        view.style.minHeight = Math.max(r.height, 120) + 'px';
        old.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: `translateX(${-28 * dx}px) scale(.985)`, filter: 'blur(3px)' }], { duration: 180, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' }).onfinish = () => old.remove();
        view.appendChild(pane);
        const kids = Array.from(pane.children);
        kids.forEach((el, i) => el.animate([{ opacity: 0, transform: `translateX(${36 * dx}px)`, filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 460, delay: 60 + i * 45, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'backwards' }));
        setTimeout(() => { view.style.minHeight = ''; }, 520);
        const top = $('steps').hidden ? 0 : $('steps').getBoundingClientRect().top + scrollY - 12;
        if (scrollY > top + 40) scrollTo({ top, behavior: calm() ? 'auto' : 'smooth' });
        afterPaint(next);
    }
    function afterPaint(s) {
        if (s === 'info') {
            const n = $('f-name');
            if (n && !n.value) setTimeout(() => { try { n.focus({ preventScroll: true }); } catch (e) {} }, 380);
        }
        if (s === 'done') { celebrate(); if (last && last.seq) watchReceipt(true); }
        if (s === 'view') watchReceipt(false);
    }

    // ---- 面の中身 ----
    function paneHtml(s) {
        if (s === 'pick') return pickHtml();
        if (s === 'info') return infoHtml();
        if (s === 'check') return checkHtml();
        if (s === 'done') return doneHtml(last, true);
        if (s === 'view') return `<div class="loading"><div class="card"><div class="face paper"></div></div></div>`;
        if (s === 'fatal') return fatalHtml();
        return '';
    }
    function card(inner, cls, off) {
        return `<div class="card ${cls || ''}"${off ? ` style="--off:${off}"` : ''}><div class="face paper"></div>${inner}</div>`;
    }
    function pickHtml() {
        const s = Y.bookState(book);
        if (s !== 'open') {
            const t = s === 'before' ? ['もうすぐ受付が始まります', `受付は ${Y.dt(book.from)} からです。`] : (s === 'off' ? ['いまは受付を止めています', 'しばらくしてから、もう一度開いてください。'] : ['受付は終わりました', 'たくさんのご予約、ありがとうございました。']);
            return `<div class="stack">${card(`<div class="shut-card"><svg><use href="#i-moon"/></svg><h2>${t[0]}</h2><p>${esc(t[1])}</p></div>`, '', 'var(--sky)')}</div>${mineHtml()}`;
        }
        const list = items.filter(it => !it.off);
        if (!list.length) return card(`<div class="shut-card"><h2>準備中です</h2><p>予約できる品が、まだありません。</p></div>`) + mineHtml();
        return `<div class="stack" id="items">${list.map(itemHtml).join('')}</div>
            <p class="hint">1回のご予約で、合わせて ${maxQty()} 個まで。</p>${mineHtml()}`;
    }
    function leftBadge(it) {
        const left = Y.remainOf(it, tally);
        if (left === Infinity) return '';
        if (left <= 0) return '<span class="left none">予約がいっぱいです</span>';
        return `<span class="left${left <= 5 ? ' low' : ''}">のこり ${left}</span>`;
    }
    function itemHtml(it) {
        const n = cart[it.id] || 0;
        return `<div class="card item${n ? ' has' : ''}" data-id="${esc(it.id)}"><div class="face paper"></div>
            <div class="pic"><svg><use href="#loaf-s"/></svg></div>
            <div><h3>${esc(it.name)}</h3>${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}</div>
            <div class="row"><div><span class="price">${yen(it.price)}</span><span data-left>${leftBadge(it)}</span></div>
                <div class="stepper" role="group" aria-label="${esc(it.name)}の個数">
                    <button type="button" class="minus" data-act="dec" aria-label="1つ減らす"${n ? '' : ' disabled'}><svg><use href="#i-minus"/></svg></button>

    }
    function canInc(it) {

    }
    function mineHtml() {
        const a = mine().slice().reverse();
        if (!a.length) return '';
        return `<div class="mine"><h4>この端末のご予約</h4>${a.map(r => `<a href="${esc(receiptUrl(r.rid))}"><span class="n">${r.seq ? esc(r.seq) : '…'}</span>
            <span class="t"><b>${esc((r.items || []).map(l => l.name + ' ×' + l.n).join('、'))}</b><span>${esc(r.name || '')}・${yen(r.total)}</span></span><svg><use href="#i-next"/></svg></a>`).join('')}</div>`;
    }
    function infoHtml() {
        const req = !book || book.sidReq !== false;
        return `${card(`<p class="ttl">お名前と${esc(sidLabel())}</p>
            <label class="field" id="fl-name"><span class="lab">お名前<span class="req">必須</span></span>
                <input id="f-name" type="text" autocomplete="name" enterkeyhint="next" maxlength="30" placeholder="例：山田 花子" value="${esc(form.name)}"><div class="err"></div></label>

                <input id="f-sid" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" maxlength="20" placeholder="例：A1234567" value="${esc(form.sid)}"><div class="err"></div></label>
            <p class="hint">受け取りの時に、お名前と${esc(sidLabel())}で確かめます。</p>`, '', 'var(--peach)')}
            <div class="btns two"><button type="button" class="btn sub" data-act="back"><span class="lbl"><svg><use href="#i-back"/></svg>もどる</span></button>

    }
    function sumHtml(lines, total) {
        return `<div class="sum">${lines.map(l => `<div class="line"><span>${esc(l.name)} × ${l.n}</span><span>${yen(l.price * l.n)}</span></div>`).join('')}
            <hr><div class="line tot"><span>合計</span><span>${yen(total)}</span></div></div>`;
    }
    function checkHtml() {
        const lines = linesOf();
        const p = getPend();
        const notes = [];
        if (dupN > 0) notes.push(`<div class="note warn"><p>この${esc(sidLabel())}で、すでに ${dupN} 件のご予約があります。</p><p>追加のご予約でよければ、そのまま進んでください。</p></div>`);
        if (sendErr) notes.push(`<div class="note bad" id="send-err">${sendErr}</div>`);
        else if (p && p.rid) notes.push(`<div class="note info"><p>前に送ろうとした予約が、まだ確かめられていません。「予約する」を押すと、同じ予約として送ります（2つにはなりません）。</p></div>`);
        return `<div class="stack">${card(`<p class="ttl">ご予約の内容</p>${sumHtml(lines, cartYen())}`, '', 'var(--pink)')}
            ${card(`<p class="ttl">お名前</p><dl class="who"><dt>お名前</dt><dd>${esc(form.name)}</dd>${form.sid ? `<dt>${esc(sidLabel())}</dt><dd>${esc(form.sid)}</dd>` : ''}</dl>`, '', 'var(--sky)')}
            ${book.pickup ? card(`<p class="ttl">受け取り</p><div class="pickup">${esc(book.pickup)}</div>${book.note ? `<p class="hint">${esc(book.note)}</p>` : ''}`, '', 'var(--peach)') : ''}

            <div class="btns"><button type="button" class="btn" id="send" data-act="send"><span class="lbl"><svg><use href="#i-check"/></svg>この内容で予約する</span><span class="spin"></span></button>
                ${fails >= 2 && Y.sheetOk(book.sheet) ? `<button type="button" class="btn sub" data-act="backup"><span class="lbl">予備の受付に送る</span></button>` : ''}
                <button type="button" class="btn ghost" data-act="back">内容を直す</button></div>`;
    }
    function stText(r) {
        if (!r) return ['wait', '確かめています'];
        if (r.backup && !r.seq) return ['wait', '仮の受付'];
        if (r.st === 'done') return ['done', '受け取り済み'];

    }
    function doneHtml(r, fresh) {
        if (!r) return '';

        const url = receiptUrl(r.rid);

            <div class="card ticket" id="ticket"><div class="face paper"></div>

                    ${book && book.pickup ? `<div class="pickup">${esc(book.pickup)}</div>` : ''}
                    <div class="qr"><div class="q">${Y.qrSvg(url, 'この予約の控えのQRコード')}</div><p>このQRコードから、いつでもこの控えを開けます。予約の状態（受け取り済みなど）も、ここに出ます。</p></div>
                </div>
            </div>

    function fatalHtml() {
        return card(`<div class="shut-card"><svg><use href="#i-moon"/></svg><h2>${esc(fatalMsg[0])}</h2><p>${esc(fatalMsg[1])}</p></div>`, '', 'var(--sky)')
            + (fatalMsg[2] ? `<div class="btns"><button type="button" class="btn sub" data-act="reload"><span class="lbl">読み込み直す</span></button></div>` : '') + mineHtml();
    }
    let fatalMsg = ['', '', false];
    function fatal(kind) {
        fatalMsg = kind === 'page' ? ['予約のページが見つかりません', 'お店のQRコード・リンクから、もう一度開いてください。', false]
            : kind === 'config' ? ['準備中です', 'このお店は、予約の準備ができていません。', false]
            : ['つながりませんでした', '電波の良い所で、読み込み直してください。', true];
        paintHero();
        go('fatal', { instant: step === '' });
    }

    // ---- 下の合計の帯 ----
    function paintBar() {
        const bar = $('bar');
        const show = step === 'pick' && Y.bookState(book) === 'open' && cartQty() > 0;
        bar.classList.toggle('show', show);
        bar.setAttribute('aria-hidden', show ? 'false' : 'true');
        $('bar-n').textContent = `${cartQty()}個`;
        $('bar-yen').textContent = yen(cartYen());
    }
    function refreshItems() {
        const box = $('items');
        if (!box) return;
        items.forEach(it => {
            const el = box.querySelector(`[data-id="${CSS.escape(it.id)}"]`);
            if (!el) return;
            const n = cart[it.id] || 0;
            el.classList.toggle('has', n > 0);
            el.querySelector('[data-left]').innerHTML = leftBadge(it);
            el.querySelector('.minus').disabled = !n;
            el.querySelector('.plus').disabled = !canInc(it);
        });
    }

    // ---- 押した時 ----
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const act = b.dataset.act;
        if (act === 'inc' || act === 'dec') {
            const id = b.closest('[data-id]').dataset.id;
            const it = items.find(x => x.id === id);
            if (!it) return;
            const before = cart[id] || 0;
            if (act === 'inc') {
                if (!canInc(it)) { toast(cartQty() >= maxQty() ? `1回のご予約は ${maxQty()} 個までです` : 'これ以上は予約できません'); return; }
                cart[id] = before + 1;
            } else cart[id] = Math.max(0, before - 1);
            if (!cart[id]) delete cart[id];
            roll(b.closest('.stepper').querySelector('.num'), cart[id] || 0, act === 'inc');
            refreshItems();
            const wasShown = $('bar').classList.contains('show');
            paintBar();
            if (wasShown && !calm()) { const y = $('bar-yen'); y.classList.remove('pop'); void y.offsetWidth; y.classList.add('pop'); }
            return;
        }
        if (act === 'back') { readForm(); go(step === 'check' ? 'info' : 'pick'); return; }
        if (act === 'toCheck') { toCheck(); return; }
        if (act === 'send') { send(); return; }
        if (act === 'backup') { backup(); return; }
        if (act === 'again') { if (resvOff) { resvOff(); resvOff = null; } cart = {}; dupN = 0; sendErr = ''; fails = 0; go('pick'); return; }
        if (act === 'copy') { copyLink(); return; }
        if (act === 'saveImg') { saveImage(); return; }
        if (act === 'reload') { location.reload(); return; }
    });
    $('bar-go').addEventListener('click', () => {
        if (!cartQty()) return;
        go('info');
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || !e.target.matches('input')) return;
        e.preventDefault();
        if (e.target.id === 'f-name') { const s = $('f-sid'); if (s) s.focus(); }
        else if (e.target.id === 'f-sid') { e.target.blur(); toCheck(); }
    });

    function readForm() {
        const n = $('f-name'), s = $('f-sid');
        if (n) form.name = Y.normName(n.value);
        if (s) form.sid = Y.normSid(s.value);
    }
    function fieldErr(id, msg) {
        const f = $(id);
        if (!f) return;
        f.classList.toggle('bad', !!msg);
        f.querySelector('.err').textContent = msg || '';
        if (msg && !calm()) { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
    }
    async function toCheck() {
        if (checking) return;
        readForm();
        let ok = true;
        fieldErr('fl-name', form.name ? '' : 'お名前を入れてください');
        if (!form.name) ok = false;
        const req = book.sidReq !== false;
        const sidBad = form.sid && !/^[A-Z0-9-]{2,20}$/.test(form.sid);
        fieldErr('fl-sid', req && !form.sid ? `${sidLabel()}を入れてください` : (sidBad ? '英字・数字で入れてください' : ''));
        if ((req && !form.sid) || sidBad) ok = false;
        if (!ok) { const bad = document.querySelector('.field.bad input'); if (bad) bad.focus(); return; }
        // 同じ番号での予約があるか（知らせるだけ。止めない）
        dupN = 0;
        if (form.sid) {
            dupN = mine().filter(r => r.sid === form.sid).length;
            const tb = $('to-check');
            if (tb) { tb.classList.add('busy'); tb.disabled = true; }
            checking = true;
            try {
                const h = await Y.sidHash(bid, form.sid);
                if (h) {
                    const s = await Y.withTimeout(c.db.collection('books').doc(bid).collection('sid').doc(h).get(), 6000);
                    if (s.exists) dupN = Math.max(dupN, Number(s.data().n) || 0);
                }
            } catch (e) {}
            checking = false;
            if (tb) { tb.classList.remove('busy'); tb.disabled = false; }
        }
        sendErr = '';
        if (step === 'info') go('check');
    }

    // ---- 送る（同じ印で送り直すので、二重にならない） ----
    function setBusy(on) {
        const b = $('send');
        if (!b) return;
        b.classList.toggle('busy', on);
        b.disabled = on;
        b.setAttribute('aria-busy', on ? 'true' : 'false');
    }
    async function send() {
        if (sending) return;
        if (Y.bookState(book) !== 'open') { toast('受付の時間ではありません'); go('pick'); return; }
        sending = true;
        sendErr = '';
        const errBox = $('send-err');
        if (errBox) errBox.remove();
        if (cartQty() > maxQty()) { sending = false; toast(`1回のご予約は ${maxQty()} 個までです`); go('pick'); return; }
        let p = getPend();
        if (!p || !Y.isRid(p.rid)) p = { rid: Y.newRid(), at: Date.now() };
        p.order = { name: form.name, sid: form.sid, lines: linesOf().map(l => ({ id: l.id, n: l.n })), via: 'web' };
        setPend(p);
        setBusy(true);
        let res = null, err = null;
        for (let i = 0; i < 3 && !res; i++) {
            try { res = await Y.withTimeout(Y.reserve(c, bid, p.rid, p.order, book), 25000, 'reserve'); err = null; }
            catch (e) {
                err = e;
                if (!Y.isNet(e)) break;
                await new Promise(ok => setTimeout(ok, 1200 * Math.pow(2, i)));
            }
        }
        sending = false;
        if (res) {
            fails = 0;
            const src = res.existed && res.doc ? res.doc : { seq: res.seq, name: Y.normName(p.order.name), sid: Y.normSid(p.order.sid), items: res.lines, qty: res.qty, total: res.total, st: 'new' };

            return;

            sendErr = '<p>受付の時間が終わったか、受付が止まっています。</p>';
        } else {
            fails++;
            sendErr = '<p>送れませんでした。電波の良い所で、もう一度「予約する」を押してください。</p><p>同じ予約として送るので、2つにはなりません。</p>';
        }
        go('check', { instant: true });
        const box = $('send-err');
        if (box && !calm()) box.classList.add('shake');
    }
    function finish(rid, d, existed) {
        const rec = { rid, seq: d.seq, name: d.name, sid: d.sid || '', items: (d.items || []).map(l => ({ id: l.id, name: l.name, price: l.price, n: l.n })), qty: d.qty, total: d.total, st: d.st || 'new', at: Y.msOf(d.at) || d.cat || Date.now() };
        remember(rec);
        clearPend();
        last = rec;
        cart = {};
        dupN = 0;
        sendErr = '';
        // お店の控え（スプレッドシート）にも送る（届かなくても、管理のページがまとめて送り直す）
        if (book && Y.sheetOk(book.sheet)) Y.sheetPost(book.sheet, { kind: 'resv', row: Y.rowOf(bid, rid, rec) });

    }
    // 予備の受付：置き場（Firestore）に送れない時だけ、お店のスプレッドシートに送る。番号はまだ無い
    async function backup() {
        const p = getPend();
        if (!p || !p.order) return;
        const rec = { rid: p.rid, seq: 0, name: Y.normName(p.order.name), sid: Y.normSid(p.order.sid), items: linesOf(), qty: cartQty(), total: cartYen(), st: 'new', at: Date.now(), backup: Date.now() };
        await Y.sheetPost(book.sheet, { kind: 'backup', row: Object.assign(Y.rowOf(bid, p.rid, rec), { st: 'backup' }) });
        p.backup = Date.now();
        setPend(p);
        remember(rec);
        last = rec;
        go('done');
    }
    // 電波がもどった時：送れていない予約があれば、自動でもう一度送る
    addEventListener('online', () => { if (step === 'check' && sendErr && !sending) send(); });

    // ---- 控え：リンク・画像 ----
    async function copyLink() {
        const r = last;
        if (!r) return;
        const url = receiptUrl(r.rid);
        try {
            if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ title: document.title, url }); return; }
            await navigator.clipboard.writeText(url);
            toast('リンクをコピーしました');
        } catch (e) {
            if (e && e.name === 'AbortError') return;
            prompt('このリンクを保存してください', url);
        }
    }
    function wrapText(ctx, text, x, y, maxW, lh) {
        let line = '', yy = y;
        for (const ch of String(text)) {
            if (ch === '\n' || ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, x, yy); yy += lh; line = ch === '\n' ? '' : ch; }
            else line += ch;
        }
        if (line) { ctx.fillText(line, x, yy); yy += lh; }
        return yy;
    }

        const rr = (x, y, w, h, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); };
        g.fillStyle = '#8E7AB5'; rr(92, 112, W - 168, H - 196, 56); g.fill();

        g.strokeStyle = '#2A2140'; g.lineWidth = 4; rr(76, 96, W - 168, H - 196, 56); g.stroke();

        g.fillText((book && book.shop) || '', L, 160);

        g.fillStyle = st[0] === 'cancel' ? '#B4233F' : (st[0] === 'done' ? '#1F7A55' : '#FFFFFF'); g.fillText(st[1], W - L - sw + 28, y + 124);
        y += 300;
        g.setLineDash([14, 12]); g.strokeStyle = 'rgba(42,33,64,.25)'; g.lineWidth = 4; g.beginPath(); g.moveTo(L, y); g.lineTo(W - L, y); g.stroke(); g.setLineDash([]);
        y += 40;
        g.font = `700 40px ${F}`;

        }
        g.font = `800 48px ${F}`; g.textAlign = 'left'; g.fillText('合計', L, y + 6); g.textAlign = 'right'; g.fillText(yen(r.total), W - L, y + 6);
        g.textAlign = 'left'; y += 96;
        g.fillStyle = sub; g.font = `700 34px ${F}`; g.fillText('お名前', L, y); g.fillStyle = ink; g.font = `800 40px ${F}`; g.fillText(r.name || '', L + 200, y - 4); y += 60;
        if (r.sid) { g.fillStyle = sub; g.font = `700 34px ${F}`; g.fillText(sidLabel(), L, y); g.fillStyle = ink; g.font = `800 40px ${F}`; g.fillText(r.sid, L + 200, y - 4); y += 60; }
        if (book && book.pickup) { g.fillStyle = ink; g.font = `700 32px ${F}`; y = wrapText(g, book.pickup, L, y + 14, W - 2 * L - 250, 46); }
        Y.qrDraw(g, receiptUrl(r.rid), W - L - 230, H - 100 - 270, 230);
        g.fillStyle = sub; g.font = `700 28px ${F}`; g.fillText('受け取りの時に、この画面を見せてください', L, H - 160);
        const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
        if (!blob) { toast('画像を作れませんでした'); return; }
        const name = `予約${r.seq || ''}_${((book && book.title) || '').replace(/[\\/:*?"<>|\s]+/g, '')}.png`;
        try {
            const file = new File([blob], name, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) { await navigator.share({ files: [file], title: document.title }); return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        Y.download(name, blob);
        toast('画像を保存しました');
    }

    // ---- 予約できた時のお祝い（めったにない時だけの動き） ----
    function celebrate() {
        const tk = $('ticket');
        if (!tk) return;
        if (calm() || !tk.animate) return;
        tk.animate([{ clipPath: 'inset(-12px -12px 100% -12px round 22px)', transform: 'translateY(-14px)' }, { clipPath: 'inset(-12px -12px -14px -12px round 22px)', transform: 'none' }], { duration: 760, delay: 140, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'backwards' });
        // 番号を数え上げる
        const no = $('tk-no'), to = Number(last && last.seq) || 0;
        if (no && to > 0) {
            const t0 = performance.now() + 260, dur = Math.min(900, 300 + to * 12);
            const tick = t => {
                const k = Math.max(0, Math.min(1, (t - t0) / dur));
                const e = 1 - Math.pow(1 - k, 4);
                no.textContent = String(Math.max(1, Math.round(e * to)));
                if (k < 1) requestAnimationFrame(tick);
            };
            no.textContent = '1';
            requestAnimationFrame(tick);
        }
        // 紙ふぶき（星・丸・波線）
        const fx = $('fx');
        const r = tk.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = Math.max(80, r.top + 70);
        const cols = ['#FFC0D9', '#A0E9FF', '#FFBFA9', '#8E7AB5', '#FFE58A'];
        const shapes = [
            col => `<svg width="18" height="18" viewBox="-11 -11 22 22"><use href="#star4" fill="${col}" stroke="#2A2140" stroke-width="1.4"/></svg>`,
            col => `<span style="display:block;width:11px;height:11px;border-radius:50%;background:${col};box-shadow:0 0 0 1.5px #2A2140"></span>`,
            col => `<svg width="22" height="10" viewBox="0 0 22 10"><path d="M1 6 C5 0 8 0 11 5 C14 10 17 10 21 4" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>`
        ];
        const N = innerWidth < 500 ? 26 : 36;
        for (let i = 0; i < N; i++) {
            const el = document.createElement('i');
            el.innerHTML = shapes[i % 3](cols[i % cols.length]);
            fx.appendChild(el);
            const ang = (-90 + (Math.random() - .5) * 150) * Math.PI / 180;
            const sp = 160 + Math.random() * 260;
            const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp;
            const rot = (Math.random() - .5) * 540;
            const fall = 260 + Math.random() * 260;
            el.animate([
                { transform: `translate(${cx}px, ${cy}px) scale(.4) rotate(0deg)`, opacity: 0 },
                { transform: `translate(${cx + dx * .6}px, ${cy + dy * .6}px) scale(1) rotate(${rot * .4}deg)`, opacity: 1, offset: .22 },
                { transform: `translate(${cx + dx}px, ${cy + dy + fall * .4}px) scale(1) rotate(${rot * .8}deg)`, opacity: 1, offset: .6 },
                { transform: `translate(${cx + dx * 1.1}px, ${cy + dy + fall}px) scale(.8) rotate(${rot}deg)`, opacity: 0 }
            ], { duration: 1500 + Math.random() * 600, delay: 160 + Math.random() * 120, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'both' }).onfinish = () => el.remove();
        }
    }

    // ---- 控えのページ（?r=予約の印）：いまの状態を見続ける ----
    function watchReceipt(quiet) {
        if (resvOff) { resvOff(); resvOff = null; }
        if (!quiet && !Y.isRid(ridQ) && !(last && last.rid)) return;
        const rid = quiet ? last.rid : (Y.isRid(ridQ) ? ridQ : last.rid);
        let first = true;
        const local = mine().find(x => x.rid === rid);
        const fallback = setTimeout(() => {
            if (!first || quiet) return;
            if (local) { last = local; showReceipt(local, true); }
        }, 8000);
        resvOff = c.db.collection('books').doc(bid).collection('resv').doc(rid).onSnapshot(s => {
            clearTimeout(fallback);
            if (!s.exists) {
                if (quiet) return;
                if (local && local.backup && !local.seq) { last = local; showReceipt(local); retryBackup(local); return; }
                if (first) { fatalMsg = ['予約が見つかりません', 'リンクが正しいか、確かめてください。', false]; go('fatal', { instant: true }); }
                first = false;
                return;
            }
            const d = s.data();
            const rec = { rid, seq: d.seq, name: d.name, sid: d.sid || '', items: d.items || [], qty: d.qty, total: d.total, st: d.st || 'new', at: Y.msOf(d.at) || d.cat };
            remember(rec);
            const was = last && last.rid === rid ? last.st : '';
            last = rec;
            if (first && !quiet) { first = false; showReceipt(rec); return; }
            first = false;
            if (was !== rec.st) {
                const st = stText(rec);
                const el = $('tk-st');
                if (el) { el.className = 'st ' + st[0]; el.textContent = st[1]; if (!calm()) { el.classList.add('pop'); } }
                toast(rec.st === 'done' ? '受け取り済みになりました。ありがとうございました' : (rec.st === 'cancel' ? 'この予約は取り消されました' : '予約の状態が変わりました'));
            }
        }, () => { clearTimeout(fallback); if (quiet) return; if (local) { last = local; showReceipt(local, true); } else { fatal('net'); } });
    }
    function showReceipt(rec, offline) {
        const view = $('view');
        const pane = document.createElement('div');
        pane.className = 'pane';
        pane.innerHTML = doneHtml(rec, false) + (offline ? `<div class="note warn" style="margin-top:16px"><p>つながらないので、この端末に覚えている控えを出しています。</p></div>` : '');
        view.innerHTML = '';
        view.appendChild(pane);
        if (!calm() && pane.animate) Array.from(pane.children).forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(16px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 560, delay: i * 60, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'backwards' }));
    }
    // 仮の受付のまま：置き場に送り直す（受付の期間なら番号がつく）
    async function retryBackup(local) {
        const p = getPend();
        if (!p || p.rid !== local.rid || !p.order || Y.bookState(book) !== 'open') return;
        try {
            const res = await Y.withTimeout(Y.reserve(c, bid, p.rid, p.order, book), 25000);
            const src = res.existed && res.doc ? res.doc : { seq: res.seq, name: Y.normName(p.order.name), sid: Y.normSid(p.order.sid), items: res.lines, qty: res.qty, total: res.total, st: 'new' };
            last = null;
            finish(p.rid, src, res.existed);
        } catch (e) {}
    }

    // ---- 送れたか分からない予約を確かめる ----
    async function resolvePending() {
        const p = getPend();
        if (!p || !Y.isRid(p.rid) || !p.order) return false;
        try {
            const s = await Y.withTimeout(c.db.collection('books').doc(bid).collection('resv').doc(p.rid).get(), 12000);
            if (s.exists) { finish(p.rid, s.data(), true); return true; }
        } catch (e) {}
        // まだ届いていない：内容を戻して、確かめの面へ
        cart = {};
        (p.order.lines || []).forEach(l => { if (items.some(it => it.id === l.id)) cart[l.id] = l.n; });
        form = { name: p.order.name || '', sid: p.order.sid || '' };
        if (!cartQty() || Y.bookState(book) !== 'open') return false;
        go('check');
        return true;
    }

    // ---- はじめ ----
    function onBook(first) {
        items = Y.bookItems(book);
        // 品が消えた・受付を止めた品は、カートから外す
        Object.keys(cart).forEach(id => { const it = items.find(x => x.id === id); if (!it || it.off) delete cart[id]; });
        lastState = Y.bookState(book);
        paintHero();
        if (first) {
            if (Y.isRid(ridQ)) { go('view', { instant: true }); return; }
            const m = mine();
            if (m.length) form = { name: m[m.length - 1].name || '', sid: m[m.length - 1].sid || '' };
            go('pick');
            resolvePending();   // 送れたか分からない予約があれば、確かめて「できた」か「確かめの面」へ
            return;
        }
        // 予約帳が変わった（受付を止めた・品を直した等）
        if (step === 'pick') { go('pick', { instant: true }); return; }
        if ((step === 'info' || step === 'check') && Y.bookState(book) !== 'open') { toast('受付が止まりました'); go('pick'); return; }
        paintSteps();
    }
    async function boot() {
        Y.askPersist();
        if (!Y.isBid(bid)) { fatal('page'); return; }
        try { c = await Y.connect(); }
        catch (e) { fatal(e && e.code === 'no-config' ? 'config' : 'net'); return; }
        const ref = c.db.collection('books').doc(bid);
        let first = true;
        const slow = setTimeout(() => { if (first) fatal('net'); }, 20000);
        ref.onSnapshot(s => {
            if (!s.exists) { clearTimeout(slow); if (first) { first = false; fatal('page'); } return; }
            book = s.data() || {};
            const f = first;
            first = false;
            clearTimeout(slow);
            if (f && step === 'fatal') step = '';
            onBook(f);
        }, e => { clearTimeout(slow); if (first) { first = false; fatal(Y.isPerm(e) ? 'page' : 'net'); } });
        ref.collection('tally').doc('c').onSnapshot(s => {
            tally = s.exists ? Object.assign({ n: 0, c: {} }, s.data()) : { n: 0, c: {} };
            if (step === 'pick') {
                // 予約がいっぱいになった品は、カートから減らす
                let cut = false;
                items.forEach(it => { const left = Y.remainOf(it, tally); if ((cart[it.id] || 0) > left) { cart[it.id] = left; if (!left) delete cart[it.id]; cut = true; } });
                if (cut) { toast('予約がいっぱいになった品があります'); go('pick', { instant: true }); }
                else refreshItems();
                paintBar();
            }
        }, () => {});
        // 時間で受付が始まる・終わる
        setInterval(() => { if (book && Y.bookState(book) !== lastState) onBook(false); }, 15000);
        // 出てくる動きが終わったら、印を外す（あとの「選んだ」の動きを止めないように）
        document.addEventListener('animationend', e => { if (e.animationName === 'rise' && e.target.closest('.pane')) e.target.classList.remove('rise'); });
    }
    let lastState = '';
    boot();
})();
</script>
