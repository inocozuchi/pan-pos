<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ご予約</title>
    <meta name="theme-color" content="#FFF4F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1430" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!--
      お客様のスマホで開く予約のページ（アプリは要らない）。
      レジのプログラム（index.html）は読み込まない。このファイルだけで動く。
      ・QRコード・リンクの ?p=予定の印 で、どの販売会の予約かが決まる
      ・お店（レジの「販売会の予定」）が書いた plans/{予定の印} を読む（名前・日時・場所・予約できる品・受付の期間）
      ・予約は plans/{予定の印}/resv に書く。何件目か・品ごとの数は plans/{予定の印}/tally/c で数える
        （品ごとの上限をこえないように、数えと予約を1回でいっしょに書く）
      ・予約した後は、この端末に予約の印を覚えておき、次に開いた時に「ご予約の内容」を出す
      ・お支払いは受け取りの時にお店で（このページでは払わない）
    -->
    <script src="data/site.js"></script>
    <script src="data/firebase-config.js"></script>
    <style>
        /* お客様のページの配色（パステル。レジとは別の見た目） */
        :root {
            --bg: #FFF4F1; --surface: #FFFFFF; --sunken: #FBEFF3; --text: #2A2140; --sub: #5E5278;
            --hair: rgba(42, 33, 64, .14); --accent: #5E4A93; --accent-ink: #5E4A93; --accent-soft: #EFE8FA;
            --danger: #B4233F; --danger-bg: #FFE3EA; --ok: #1F7A55; --ok-bg: #DDF5EA;
            --shadow: 0 0 0 1.5px rgba(42, 33, 64, .9), 4px 5px 0 var(--off, #FFC0D9);
            --pink: #FFC0D9; --sky: #A0E9FF; --peach: #FFBFA9; --on-accent: #fff;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --r: 20px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1A1430; --surface: #251D40; --sunken: #2E2550; --text: #F7F0FF; --sub: #CBBFE6;
                --hair: rgba(247, 240, 255, .16); --accent: #FFC0D9; --accent-ink: #FFC0D9; --accent-soft: #3A2D5E;
                --danger: #FF9DB3; --danger-bg: rgba(255, 90, 130, .15); --ok: #7FE0B4; --ok-bg: rgba(60, 190, 130, .16);
                --shadow: 0 0 0 1.5px rgba(247, 240, 255, .45), 4px 5px 0 var(--off, #8E7AB5);
                --on-accent: #2A2140;
                color-scheme: dark;
            }
        }
        html { background: var(--bg); }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(70vmax 55vmax at 0% 0%, color-mix(in srgb, var(--pink) 55%, transparent), transparent 70%), radial-gradient(60vmax 50vmax at 100% 40%, color-mix(in srgb, var(--sky) 40%, transparent), transparent 70%), radial-gradient(60vmax 50vmax at 30% 100%, color-mix(in srgb, var(--peach) 40%, transparent), transparent 70%); opacity: .75; }
        h1, p { text-wrap: pretty; word-break: auto-phrase; }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; color: var(--text); }
        body {
            font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
            font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(110px + env(safe-area-inset-bottom, 0px));
            max-width: 640px; margin: 0 auto;
        }
        h1 { font-size: 26px; font-weight: 800; margin: 2px 0 4px; overflow-wrap: anywhere; text-shadow: .06em .06em 0 var(--pink); }
        .shop { font-size: 13px; font-weight: 800; color: var(--accent-ink); }
        .sub { color: var(--sub); font-size: 13px; }
        .info { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin: 12px 0; }
        .info .row { display: flex; gap: 10px; font-size: 15px; padding: 3px 0; }
        .info .row b { flex: 0 0 4.5em; color: var(--sub); font-size: 13px; padding-top: 1px; }
        .info .row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .comment { font-size: 15px; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .notice { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin: 12px 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .notice.warn { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .notice.accent { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
        .cat { font-size: 13px; font-weight: 800; color: var(--sub); margin: 18px 4px 8px; }
        .item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 14px 16px; margin-bottom: 14px; }
        .item .nm { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
        .item .pr { display: block; font-size: 14px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }
        .item .left { display: block; font-size: 12px; font-weight: 800; color: var(--accent-ink); }
        .item .left.none { color: var(--danger); }
        .item.out { opacity: .55; }
        .step { display: flex; align-items: center; gap: 6px; }
        .step button { appearance: none; -webkit-appearance: none; border: none; width: 44px; height: 44px; border-radius: 12px; font-size: 22px; font-weight: 800; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); font-family: inherit; }
        .step button.plus { background: var(--accent); color: var(--on-accent); box-shadow: none; }
        .step button { border-radius: 50%; transition: transform 140ms var(--ease-out); }
        .step button:active:not(:disabled) { transform: scale(.9); }
        .step button:disabled { opacity: .35; }
        .step .q { min-width: 1.6em; text-align: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .bar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 616px; margin: 0 auto; padding: 10px 10px 10px 18px; border-radius: 99px; background: var(--surface); box-shadow: 0 10px 30px rgba(42, 33, 64, .22), 0 0 0 1.5px var(--hair); display: flex; align-items: center; gap: 12px; }
        .bar .tot { flex: 1; font-size: 13px; color: var(--sub); }
        .bar .tot b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
        .btn { appearance: none; -webkit-appearance: none; border: none; font-family: inherit; min-height: 52px; padding: 0 22px; border-radius: 99px; font-size: 17px; font-weight: 800; background: var(--accent); color: var(--on-accent); cursor: pointer; box-shadow: 3px 4px 0 var(--pink); transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out); }
        .btn:active:not(:disabled) { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--pink); }
        .btn:disabled { opacity: .4; cursor: default; }
        .btn.sec { background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
        .btn.full { width: 100%; margin-top: 10px; }
        .form { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin: 12px 0; }
        .form label { display: block; font-size: 13px; font-weight: 800; color: var(--sub); margin: 12px 0 6px; }
        .form label:first-child { margin-top: 0; }
        .form label small { font-weight: 600; }
        .form input, .form select, .form textarea { width: 100%; min-height: 48px; font-size: 17px; font-family: inherit; border-radius: 12px; border: none; padding: 10px 12px; background: var(--sunken); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
        .form textarea { min-height: 80px; resize: vertical; }
        .form input:focus, .form select:focus, .form textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
        .lines { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 16px; margin: 10px 0; }
        .lines > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-variant-numeric: tabular-nums; }
        .lines > div.t { font-weight: 800; font-size: 18px; }
        .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; margin: 12px 0; text-align: center; }
        .card.ok { --off: #A0E9FF; background: var(--surface); background-image: radial-gradient(color-mix(in srgb, var(--pink) 60%, transparent) 1.6px, transparent 2px); background-size: 12px 12px; }
        .item, .info, .form, .lines, .card { animation: rise 520ms var(--ease-out) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        /* 出てくる動きは、はじめて出た時だけ（押すたびに一覧を作り直すので、2回目からは動かさない） */
        body.settled .item, body.settled .info, body.settled .form, body.settled .lines { animation: none; }
        @media (prefers-reduced-motion: reduce) { .item, .info, .form, .lines, .card { animation: fade 200ms ease both; } .step button:active, .btn:active { transform: none; } }
        @keyframes fade { from { opacity: 0; } }
        .card .k { font-size: 13px; color: var(--sub); font-weight: 700; }
        .card .no { font-size: 56px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .card .st { font-size: 18px; font-weight: 800; margin-top: 4px; }
        .card .lines { text-align: left; box-shadow: none; background: transparent; padding: 0; }
        .hide { display: none !important; }
        .foot { font-size: 12px; color: var(--sub); margin-top: 18px; text-align: center; }
    </style>
</head>
<body>
    <div id="head"></div>
    <div id="msg" class="notice hide"></div>
    <div id="mine"></div>
    <div id="main"></div>
    <div class="bar hide" id="bar">
        <div class="tot"><span id="bar-n">0点</span><b id="bar-sum">¥0</b></div>
        <button class="btn" id="bar-go" onclick="toForm()" disabled>次へ</button>
    </div>
    <p class="foot">お支払いは、受け取りの時にお店でお願いします。</p>
<script>
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const yen = n => '¥' + (Number(n) || 0).toLocaleString('ja-JP');
    const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
    const pid = (new URLSearchParams(location.search).get('p') || '').trim();
    const MINE_KEY = 'taizanboku_resv_mine_' + pid;
    let db = null, uid = '', plan = null, tally = { n: 0, c: {} };
    const cart = {};          // 商品の印 → 個数
    let step = 'items';       // items → form → done
    let sending = false;

    function say(text, kind) {
        const m = $('msg');
        if (!text) { m.classList.add('hide'); return; }
        m.className = 'notice' + (kind ? ' ' + kind : '');
        m.textContent = text;
    }
    function loadSdk() {
        const base = 'https://www.gstatic.com/firebasejs/10.12.5/';
        const files = ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js'];
        return files.reduce((p, f) => p.then(() => new Promise((ok, ng) => {
            const s = document.createElement('script'); s.src = base + f; s.onload = ok; s.onerror = () => ng(new Error(f)); document.head.appendChild(s);
        })), Promise.resolve());
    }
    function dateText(p) {
        if (!p.date) return '';
        const [y, m, d] = String(p.date).split('-').map(Number);
        const w = WEEK[new Date(y, m - 1, d).getDay()];
        return `${m}月${d}日（${w}）${p.start ? ' ' + p.start + '〜' + (p.end || '') : ''}`;
    }
    function dt(ms) {
        if (!ms) return '';
        const d = new Date(ms);
        return `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    function mine() { try { const a = JSON.parse(localStorage.getItem(MINE_KEY) || '[]'); return Array.isArray(a) ? a.filter(x => /^r\d+$/.test(x)) : []; } catch (e) { return []; } }
    function remember(rid) { try { const a = mine(); if (!a.includes(rid)) a.push(rid); localStorage.setItem(MINE_KEY, JSON.stringify(a.slice(-10))); } catch (e) {} }

    async function start() {
        if (!/^[A-Za-z0-9]{16,40}$/.test(pid)) { say('予約のページが見つかりません。お店のQRコードから開いてください。', 'warn'); return; }
        if (!window.FIREBASE_CONFIG) { say('このお店は、予約の準備ができていません。', 'warn'); return; }
        say('読み込んでいます…');
        try {
            if (!window.firebase || !window.firebase.firestore) await loadSdk();
            const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(window.FIREBASE_CONFIG);
            db = firebase.firestore(app);
            // 試験のときだけ：手元のエミュレーターにつなぐ
            if (window.__FB_EMU) { db.useEmulator(window.__FB_EMU.host, window.__FB_EMU.fs); firebase.auth(app).useEmulator('http://' + window.__FB_EMU.host + ':' + window.__FB_EMU.auth, { disableWarnings: true }); }
            try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
            const cred = await firebase.auth(app).signInAnonymously();
            uid = (cred && cred.user && cred.user.uid) || (firebase.auth(app).currentUser || {}).uid || '';
        } catch (e) {
            say('つながりませんでした。電波の良い所で、ページを読み込み直してください。', 'warn');
            return;
        }
        await loadPlan();
    }
    function planRef() { return db.collection('plans').doc(pid); }
    async function loadPlan() {
        let snap = null;
        try { snap = await planRef().get(); } catch (e) { say('読み込めませんでした。電波の良い所で、ページを読み込み直してください。', 'warn'); return; }
        if (!snap.exists) { say('この予約のページは見つかりませんでした。お店にお問い合わせください。', 'warn'); return; }
        plan = snap.data() || {};
        // 品の印は、押した時の呼び出しに使うので、英数字の物だけにする
        plan.items = (Array.isArray(plan.items) ? plan.items : []).filter(it => it && /^[A-Za-z0-9_-]{1,20}$/.test(String(it.id)));
        try { const t = await planRef().collection('tally').doc('c').get(); if (t.exists) tally = Object.assign({ n: 0, c: {} }, t.data()); } catch (e) {}
        say('');
        renderHead();
        renderMine();
        render();
    }
    function renderHead() {
        document.title = (plan.name ? plan.name + ' ' : '') + 'ご予約';
        const rows = [
            ['日時', dateText(plan)], ['場所', plan.place], ['実施', plan.org], ['コラボ', plan.collab]
        ].filter(r => r[1]);
        $('head').innerHTML = `${plan.shop ? `<div class="shop">${esc(plan.shop)}</div>` : ''}<h1>${esc(plan.name || 'ご予約')}</h1>
            <div class="info">${rows.map(r => `<div class="row"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}
            ${plan.comment ? `<div class="comment">${esc(plan.comment)}</div>` : ''}</div>`;
    }
    function state() {
        if (plan.done) return 'done';
        if (!plan.on) return 'off';
        const now = Date.now();
        if (plan.from && now < plan.from) return 'before';
        if (plan.to && now >= plan.to) return 'after';
        return 'open';
    }
    function leftOf(it) {
        if (!(Number(it.cap) >= 0)) return Infinity;
        return Math.max(0, Number(it.cap) - (Number((tally.c || {})[it.id]) || 0));
    }
    function count() { return Object.values(cart).reduce((a, b) => a + b, 0); }
    function sum() { return (plan.items || []).reduce((a, it) => a + (cart[it.id] || 0) * (Number(it.price) || 0), 0); }
    function maxQty() { return Math.min(30, Math.max(1, Number(plan.maxQty) || 10)); }

    function render() {
        if (!render.t) render.t = setTimeout(() => document.body.classList.add('settled'), 900);
        const st = state();
        const main = $('main');
        $('bar').classList.add('hide');
        if (st === 'done') { main.innerHTML = '<div class="notice">この販売会の予約の受付は終わりました。ありがとうございました。</div>'; return; }
        if (st === 'off') { main.innerHTML = '<div class="notice">ただいま、予約を受け付けていません。</div>'; return; }
        if (st === 'before') { main.innerHTML = `<div class="notice accent">予約の受付は ${esc(dt(plan.from))} からです。</div>${itemsPreview()}`; return; }
        if (st === 'after') { main.innerHTML = `<div class="notice">予約の受付は締め切りました（${esc(dt(plan.to))}まで）。当日、売り場でお待ちしています。</div>`; return; }
        if (step === 'form') { renderForm(); return; }
        const items = plan.items || [];
        if (!items.length) { main.innerHTML = '<div class="notice">いま、予約できる品はありません。当日、売り場でお待ちしています。</div>'; return; }
        const cats = [];
        items.forEach(it => { const c = it.cat || ''; if (!cats.includes(c)) cats.push(c); });
        main.innerHTML = `<div class="notice accent">予約の締め切り：${esc(dt(plan.to))}<br>1回の予約で${maxQty()}個まで</div>
            ${plan.note ? `<div class="notice">${esc(plan.note)}</div>` : ''}
            ${cats.map(c => `${c ? `<div class="cat">${esc(c)}</div>` : ''}${items.filter(it => (it.cat || '') === c).map(itemRow).join('')}`).join('')}`;
        $('bar').classList.remove('hide');
        updateBar();
    }
    function itemsPreview() {
        const items = plan.items || [];
        if (!items.length) return '';
        return `<div class="cat">予約できる品</div>${items.map(it => `<div class="item"><div class="nm">${esc(it.name)}<span class="pr">${yen(it.price)}</span></div></div>`).join('')}`;
    }
    function itemRow(it) {
        const left = leftOf(it);
        const q = cart[it.id] || 0;
        const out = left !== Infinity && left <= 0 && q === 0;
        return `<div class="item${out ? ' out' : ''}" data-id="${esc(it.id)}">
            <div class="nm">${esc(it.name)}<span class="pr">${yen(it.price)}</span>
                ${left !== Infinity ? `<span class="left${left - q <= 0 ? ' none' : ''}">${left <= 0 ? '予約はいっぱいです' : `予約できる残り ${left - q}個`}</span>` : ''}</div>
            <div class="step">
                <button type="button" aria-label="${esc(it.name)}を1つ減らす" onclick="addItem('${esc(it.id)}', -1)" ${q ? '' : 'disabled'}>−</button>
                <span class="q">${q}</span>
                <button type="button" class="plus" aria-label="${esc(it.name)}を1つ増やす" onclick="addItem('${esc(it.id)}', 1)" ${left - q <= 0 || count() >= maxQty() ? 'disabled' : ''}>＋</button>
            </div>
        </div>`;
    }
    window.addItem = function (id, d) {
        const it = (plan.items || []).find(x => String(x.id) === String(id));
        if (!it) return;
        const q = cart[id] || 0;
        if (d > 0 && (q + 1 > leftOf(it) || count() >= maxQty())) return;
        const n = Math.max(0, q + d);
        if (n) cart[id] = n; else delete cart[id];
        render();
    };
    function updateBar() {
        $('bar-n').textContent = `${count()}点・合計（目安）`;
        $('bar-sum').textContent = yen(sum());
        $('bar-go').disabled = count() === 0;
    }
    window.toForm = function () {
        if (!count()) return;
        step = 'form';
        render();
        window.scrollTo(0, 0);
    };
    function linesHtml(items, total) {
        return `<div class="lines">${items.map(i => `<div><span>${esc(i.name)} × ${i.n}</span><span>${yen(i.price * i.n)}</span></div>`).join('')}
            <div class="t"><span>合計（目安）</span><span>${yen(total)}</span></div></div>`;
    }
    function chosen() {
        return (plan.items || []).filter(it => cart[it.id]).map(it => ({ id: String(it.id), name: String(it.name), price: Number(it.price) || 0, n: cart[it.id] }));
    }
    function renderForm() {
        const items = chosen();
        const tel = plan.tel || 'off';
        const picks = Array.isArray(plan.pickups) ? plan.pickups : [];
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('taizanboku_resv_me') || '{}') || {}; } catch (e) {}
        $('main').innerHTML = `<div class="cat">ご予約の内容</div>${linesHtml(items, sum())}
            <div class="form">
                <label for="f-name">お名前 <small>（名字だけ・呼び名でかまいません）</small></label>
                <input id="f-name" maxlength="30" autocomplete="name" value="${esc(saved.name || '')}">
                ${tel !== 'off' ? `<label for="f-tel">電話番号 <small>${tel === 'req' ? '（必須）' : '（任意）'}</small></label>
                <input id="f-tel" type="tel" maxlength="20" autocomplete="tel" inputmode="tel" value="${esc(saved.tel || '')}">` : ''}
                ${picks.length ? `<label for="f-pick">受け取りの時間</label>
                <select id="f-pick"><option value="">選んでください</option>${picks.map(t => `<option value="${esc(t)}">${esc(t)}ごろ</option>`).join('')}</select>` : ''}
                ${plan.memo ? `<label for="f-memo">お店へのひとこと <small>（任意）</small></label>
                <textarea id="f-memo" maxlength="200" placeholder="例：袋は要りません"></textarea>` : ''}
            </div>
            <div class="notice">お支払いは、受け取りの時にお店でお願いします。金額は目安です（割引などは、お会計の時に計算します）。</div>
            <button class="btn full" id="f-send" onclick="sendResv()">この内容で予約する</button>
            <button class="btn sec full" onclick="backToItems()">品物を選び直す</button>`;
    }
    window.backToItems = function () { step = 'items'; render(); };
    window.sendResv = async function () {
        if (sending) return;
        const name = ($('f-name').value || '').normalize('NFKC').replace(/\s+/g, ' ').trim().slice(0, 30);
        const telEl = $('f-tel'), pickEl = $('f-pick'), memoEl = $('f-memo');
        const tel = telEl ? (telEl.value || '').normalize('NFKC').replace(/[^0-9+\-() ]/g, '').trim().slice(0, 20) : '';
        const pickup = pickEl ? pickEl.value : '';
        const memo = memoEl ? (memoEl.value || '').trim().slice(0, 200) : '';
        if (!name) { alert('お名前を入れてください。'); $('f-name').focus(); return; }
        if (plan.tel === 'req' && tel.replace(/[^0-9]/g, '').length < 9) { alert('電話番号を入れてください。'); telEl.focus(); return; }
        if (pickEl && !pickup) { alert('受け取りの時間を選んでください。'); pickEl.focus(); return; }
        const items = chosen();
        if (!items.length) { backToItems(); return; }
        const total = items.reduce((a, i) => a + i.price * i.n, 0);
        sending = true;
        const btn = $('f-send');
        btn.disabled = true; btn.textContent = '送っています…';
        try {
            const ref = planRef();
            const seq = await db.runTransaction(async tx => {
                const tref = ref.collection('tally').doc('c');
                const t = await tx.get(tref);
                const d = t.exists ? (t.data() || {}) : { n: 0, c: {} };
                const c = Object.assign({}, d.c || {});
                for (const i of items) {
                    const it = (plan.items || []).find(x => String(x.id) === i.id);
                    const used = Number(c[i.id]) || 0;
                    if (it && Number(it.cap) >= 0 && used + i.n > Number(it.cap)) {
                        const e = new Error('cap'); e.item = i.name; e.left = Math.max(0, Number(it.cap) - used); throw e;
                    }
                    c[i.id] = used + i.n;
                }
                const n = (Number(d.n) || 0) + 1;
                tx.set(tref, { n, c });
                tx.set(ref.collection('resv').doc('r' + n), {
                    uid, seq: n, name, tel, memo, pickup, items, total, st: 'new',
                    at: firebase.firestore.FieldValue.serverTimestamp()
                });
                return n;
            });
            remember('r' + seq);
            try { localStorage.setItem('taizanboku_resv_me', JSON.stringify({ name, tel })); } catch (e) {}
            Object.keys(cart).forEach(k => delete cart[k]);
            step = 'items';
            $('main').innerHTML = `<div class="card ok"><div class="k">ご予約を受け付けました</div><div class="no">No.${seq}</div>
                <div class="st">${esc(name)} 様${pickup ? `・${esc(pickup)}ごろ受け取り` : ''}</div>${linesHtml(items, total)}</div>
                <div class="notice">受け取りの時に、お名前か予約番号（No.${seq}）をお伝えください。この画面をお見せいただいてもかまいません。<br>取り消す時は、お店にご連絡ください。</div>
                <button class="btn sec full" onclick="location.reload()">ほかの品も予約する</button>`;
            $('bar').classList.add('hide');
            window.scrollTo(0, 0);
        } catch (e) {
            if (e && e.message === 'cap') {
                alert(`「${e.item}」は、予約できる残りが${e.left}個になりました。数を選び直してください。`);
                try { const t = await planRef().collection('tally').doc('c').get(); if (t.exists) tally = Object.assign({ n: 0, c: {} }, t.data()); } catch (x) {}
                step = 'items';
                render();
            } else {
                // 受付の期間が終わった・通信が切れた など
                let fresh = null;
                try { const s = await planRef().get(); fresh = s.exists ? s.data() : null; } catch (x) {}
                if (fresh) { plan = fresh; }
                if (state() !== 'open') { render(); alert('予約の受付が終わっていたため、予約できませんでした。'); }
                else { alert('予約を送れませんでした。電波の良い所で、もう一度押してください。'); btn.disabled = false; btn.textContent = 'この内容で予約する'; }
            }
        } finally {
            sending = false;
        }
    };
    // この端末でした予約（次に開いた時に、内容と状態を出す）
    async function renderMine() {
        const ids = mine();
        if (!ids.length) return;
        const box = $('mine');
        const out = [];
        for (const rid of ids) {
            try {
                const s = await planRef().collection('resv').doc(rid).get();
                if (!s.exists) continue;
                const d = s.data() || {};
                const items = Array.isArray(d.items) ? d.items : [];
                const st = d.st === 'done' ? 'お受け取り済み' : d.st === 'cancel' ? '取り消しになりました' : 'ご予約済み';
                out.push(`<div class="card"><div class="k">${esc(st)}</div><div class="no">No.${esc(d.seq)}</div>
                    <div class="st">${esc(d.name)} 様${d.pickup ? `・${esc(d.pickup)}ごろ受け取り` : ''}</div>
                    ${linesHtml(items.map(i => ({ name: i.name, price: Number(i.price) || 0, n: Number(i.n) || 0 })), Number(d.total) || 0)}</div>`);
            } catch (e) { /* 販売会の後に消えた予約・読めない予約は出さない */ }
        }
        box.innerHTML = out.length ? `<div class="cat">この端末でのご予約</div>${out.join('')}` : '';
    }
    start();
})();
</script>
</body>
</html>
