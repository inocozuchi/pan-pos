<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>予約帳の管理</title>
    <meta name="theme-color" content="#FFF4F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1430" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!--
      予約帳の管理のページ。レジ（index.html）とは別に動く（レジを初期化しても、販売会を閉じても、予約は消えない）。
      ・予約帳を作る・受付の設定・お客様のページのリンクとQRコード・ポスター
      ・予約の一覧・受け取り・取り消し（予約は消せない。状態を変えるだけ。変えた記録が残る）
      ・品ごとの数・数え直し
      ・控え：この端末の中（localStorage と IndexedDB）に、届いた予約を写して持つ（消さずに足すだけ）。
        CSV・JSON・印刷。Google スプレッドシートへの写し（docs/予約帳.md）。
      ・予約帳の鍵：管理の端末をなくしても・初期化しても、鍵でどの端末からでも管理者に戻れる
    -->
    <script src="data/firebase-config.js"></script>
    <style>
        :root {
            --pink: #FFC0D9; --sky: #A0E9FF; --peach: #FFBFA9; --purple: #8E7AB5;
            --paper: #FFF4F1; --card: #FFFFFF; --sunk: #FBEFF3; --sunk-2: #F4E6EC;
            --ink: #2A2140; --ink-2: #5E5278; --ink-3: #8D82A6; --line: rgba(42, 33, 64, .13);
            --btn: #5E4A93; --btn-ink: #FFFFFF;
            --ok: #1F7A55; --ok-bg: #DDF5EA; --warn: #9A4A12; --warn-bg: #FFEBDD; --bad: #B4233F; --bad-bg: #FFE3EA; --info-bg: #E3F6FD;
            --dot: rgba(142, 122, 181, .2);
            --shadow: 0 1px 2px rgba(42, 33, 64, .06), 0 8px 24px rgba(42, 33, 64, .08);
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
            --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #1A1430; --card: #251D40; --sunk: #2E2550; --sunk-2: #382D60;
                --ink: #F7F0FF; --ink-2: #CBBFE6; --ink-3: #9C90BC; --line: rgba(247, 240, 255, .14);
                --btn: #FFC0D9; --btn-ink: #2A2140;
                --ok: #7FE0B4; --ok-bg: rgba(60, 190, 130, .16); --warn: #FFC79C; --warn-bg: rgba(255, 160, 90, .14); --bad: #FF9DB3; --bad-bg: rgba(255, 90, 130, .15); --info-bg: rgba(110, 200, 240, .14);
                --dot: rgba(200, 180, 255, .14);
                --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { margin: 0; min-height: 100dvh; font-family: var(--font); color: var(--ink); background: var(--paper); line-height: 1.55; font-feature-settings: "palt" 1; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(60vmax 50vmax at 0% 0%, color-mix(in srgb, var(--pink) 45%, transparent), transparent 70%), radial-gradient(60vmax 50vmax at 100% 30%, color-mix(in srgb, var(--sky) 35%, transparent), transparent 70%); opacity: .7; }
        h1, h2, h3, p { text-wrap: pretty; word-break: auto-phrase; }
        button { font: inherit; color: inherit; }
        input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
        .wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }

        /* 上の帯 */
        .top { position: sticky; top: 0; z-index: 10; padding: calc(env(safe-area-inset-top, 0px) + 10px) 0 10px; background: color-mix(in srgb, var(--paper) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
        .top .row1 { display: flex; align-items: center; gap: 10px; min-height: 44px; }
        .top h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top h1 small { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .08em; }
        .net { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--card); box-shadow: 0 0 0 1px var(--line); white-space: nowrap; }
        .net::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
        .net.on::before { background: #3BC48A; }
        .net.wait::before { background: #F0A23B; }
        .net.off::before { background: #E0566F; }
        .icon-btn { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; cursor: pointer; touch-action: manipulation; transition: transform 140ms var(--ease-out); }
        .icon-btn:active { transform: scale(.94); }
        .icon-btn svg { width: 22px; height: 22px; }
        .tabs { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; padding: 4px; border-radius: 16px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
        .tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 4); border-radius: 12px; background: var(--card); box-shadow: 0 1px 3px rgba(42, 33, 64, .14), 0 0 0 1px var(--line); transition: transform 300ms var(--ease-in-out); }
        .tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 2px; font-size: 14px; font-weight: 800; color: var(--ink-2); cursor: pointer; touch-action: manipulation; transition: color 200ms ease; }
        .tabs button.on { color: var(--ink); }
        .tabs button b { font-variant-numeric: tabular-nums; font-size: 11.5px; margin-left: 3px; color: var(--purple); }
        .tabs[hidden] { display: none; }

        /* カード */
        .card { position: relative; background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 0 0 1px var(--line), 4px 5px 0 var(--off, var(--pink)); }
        .card + .card, .card + .sec, .sec + .card, .sec + .sec { margin-top: 16px; }
        .sec h2 { margin: 22px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--ink-2); }
        .sec h2:first-child { margin-top: 6px; }
        .muted { color: var(--ink-2); font-size: 13.5px; }
        .note { border-radius: 14px; padding: 11px 14px; font-size: 14px; font-weight: 700; margin-top: 12px; }
        .note.warn { background: var(--warn-bg); color: var(--warn); }
        .note.bad { background: var(--bad-bg); color: var(--bad); }
        .note.ok { background: var(--ok-bg); color: var(--ok); }
        .note.info { background: var(--info-bg); color: var(--ink); }
        .note p { margin: 0; }
        .note p + p { margin-top: 4px; }
        .note .btn { margin-top: 10px; }

        /* ボタン */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 11px 18px; border: 0; border-radius: 14px; font-size: 15.5px; font-weight: 800; color: var(--btn-ink); background: var(--btn); cursor: pointer; touch-action: manipulation; transition: transform 160ms var(--ease-out), opacity 160ms ease; text-decoration: none; }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn.sub { color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
        .btn.warn { color: var(--bad); background: var(--bad-bg); }
        .btn.okb { color: #fff; background: #1F8A5E; }
        .btn.wide { width: 100%; }
        .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
        .btn.busy { opacity: .6; pointer-events: none; }
        .row-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .row-btns .btn { flex: 1 1 160px; }

        /* 一覧 */
        .tools { display: flex; gap: 10px; align-items: center; margin: 14px 0 10px; }
        .search { flex: 1; position: relative; }
        .search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 14px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); outline: none; }
        .search input:focus { box-shadow: inset 0 0 0 2px var(--purple); }
        .search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); }
        .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; overscroll-behavior-x: contain; }
        .filters::-webkit-scrollbar { display: none; }
        .filters button { flex-shrink: 0; border: 0; border-radius: 99px; padding: 8px 14px; font-size: 13.5px; font-weight: 800; background: var(--card); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; touch-action: manipulation; transition: background-color 180ms ease, color 180ms ease; }
        .filters button.on { background: var(--ink); color: var(--paper); box-shadow: none; }
        .filters button b { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: .8; }
        .list { display: grid; gap: 10px; }
        .r { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 12px 12px 12px; border-radius: 18px; background: var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; touch-action: manipulation; transition: transform 140ms var(--ease-out); }
        .r:active { transform: scale(.99); }
        .r .no { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--pink); color: #2A2140; }
        .r.st-done .no { background: var(--ok-bg); color: var(--ok); }
        .r.st-cancel .no { background: var(--sunk-2); color: var(--ink-3); text-decoration: line-through; }
        .r .tx { min-width: 0; }
        .r .nm { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r .nm small { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-left: 6px; font-variant-numeric: tabular-nums; }
        .r .it { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r .it b { color: var(--ink); font-variant-numeric: tabular-nums; }
        .r.st-cancel .nm, .r.st-cancel .it { opacity: .55; }
        .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
        .tag.shop { background: var(--info-bg); color: var(--ink); }
        .tag.dup { background: var(--warn-bg); color: var(--warn); }
        .tag.paid { background: var(--ok-bg); color: var(--ok); }
        .quick { min-width: 92px; min-height: 48px; border: 0; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; touch-action: manipulation; transition: transform 140ms var(--ease-out); background: var(--ink); color: var(--paper); padding: 0 12px; }
        .quick:active { transform: scale(.95); }
        .quick.done { background: var(--ok-bg); color: var(--ok); }
        .quick.cancel { background: var(--sunk-2); color: var(--ink-3); }
        .r.flash { animation: flash 1400ms var(--ease-out); }
        @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--purple); } 100% { box-shadow: 0 0 0 1px var(--line); } }
        .empty { text-align: center; padding: 36px 16px; color: var(--ink-2); }
        .empty svg { width: 64px; height: 64px; }

        /* 集計 */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .kpi { padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
        .kpi small { display: block; font-size: 12px; font-weight: 800; color: var(--ink-2); letter-spacing: .06em; }
        .kpi b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
        .kpi span { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
        table.tb { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
        .tb th, .tb td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .tb th:first-child, .tb td:first-child { text-align: left; white-space: normal; }
        .tb th { font-size: 12px; color: var(--ink-2); font-weight: 800; }
        .tb tr:last-child td { border-bottom: 0; }
        .bar-m { height: 8px; border-radius: 99px; background: var(--sunk-2); overflow: hidden; margin-top: 6px; }
        .bar-m i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--pink), var(--purple)); transform-origin: left; transition: transform 500ms var(--ease-out); }
        .tb-wrap { overflow-x: auto; }

        /* 設定 */
        .f { display: block; }
        .f + .f, .f + .grid2, .grid2 + .f, .grid2 + .grid2 { margin-top: 14px; }
        .f .lb { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; color: var(--ink); }
        .f .lb small { font-weight: 700; color: var(--ink-3); margin-left: 6px; }
        .f input[type=text], .f input[type=url], .f input[type=number], .f input[type=datetime-local], .f textarea, .f select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1.5px var(--line); outline: none; font-weight: 700; }
        .f textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
        .f input:focus, .f textarea:focus, .f select:focus { background: var(--card); box-shadow: inset 0 0 0 2px var(--purple); }
        .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
        .f { min-width: 0; }
        .f input { min-width: 0; max-width: 100%; }
        .grid2 .f + .f { margin-top: 0; }
        .sw { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; }
        .sw + .sw { margin-top: 8px; }
        .sw .t { font-weight: 800; font-size: 15px; }
        .sw .t small { display: block; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
        .toggle { position: relative; flex-shrink: 0; width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--sunk-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background-color 200ms ease; }
        .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform 240ms var(--ease-out); }
        .toggle[aria-checked="true"] { background: #34C77B; }
        .toggle[aria-checked="true"]::after { transform: translateX(20px); }
        .items-ed { display: grid; gap: 10px; }
        .it-ed { display: grid; grid-template-columns: 1fr 96px 84px 40px; gap: 8px; align-items: end; padding: 12px; border-radius: 16px; background: var(--sunk); }
        .it-ed .f + .f { margin-top: 0; }
        .it-ed .f .lb { font-size: 11.5px; }
        .it-ed .f input { background: var(--card); padding: 10px 10px; }
        .it-ed .desc { grid-column: 1 / -1; }
        .it-ed .rm { width: 40px; height: 44px; border: 0; border-radius: 12px; background: var(--card); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
        .it-ed .rm svg { width: 18px; height: 18px; }
        .it-ed.off { opacity: .6; }
        .open-big { display: flex; align-items: center; gap: 14px; }
        .open-big .t { flex: 1; }
        .open-big .t b { display: block; font-size: 18px; }
        .share { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
        .share .q { width: 132px; height: 132px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); }
        .share .q svg { width: 100%; height: 100%; display: block; }
        .share .url { font-size: 12.5px; word-break: break-all; color: var(--ink-2); background: var(--sunk); padding: 8px 10px; border-radius: 10px; user-select: all; -webkit-user-select: all; }
        .save-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 5; margin-top: 18px; display: flex; gap: 10px; padding: 10px; border-radius: 18px; background: color-mix(in srgb, var(--card) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: var(--shadow), 0 0 0 1px var(--line); transform: translateY(0); transition: transform 280ms var(--ease-drawer), opacity 200ms ease; }
        .save-bar.idle { transform: translateY(calc(100% + 30px)); opacity: 0; pointer-events: none; }
        .save-bar .btn { flex: 1; }

        /* 鍵 */
        .key { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 22px; font-weight: 800; letter-spacing: .06em; text-align: center; padding: 16px 10px; border-radius: 16px; background: var(--sunk); word-break: break-all; user-select: all; -webkit-user-select: all; }
        .key.hide { filter: blur(7px); user-select: none; -webkit-user-select: none; cursor: pointer; }

        /* 引き出し（下から出る窓） */
        .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(20, 14, 36, .42); opacity: 0; transition: opacity 240ms ease; }
        .sheet-bg.show { opacity: 1; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 620px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; border-radius: 26px 26px 0 0; background: var(--card); padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); box-shadow: 0 -10px 40px rgba(20, 14, 36, .25); transform: translateY(105%); transition: transform 360ms var(--ease-drawer); }
        .sheet.show { transform: none; }
        .sheet.closing { transition-duration: 220ms; }
        .sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
        .sheet h3 { margin: 4px 0 12px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .sheet h3 .no { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 14px; background: var(--pink); color: #2A2140; font-variant-numeric: tabular-nums; }
        .sheet .close { margin-left: auto; }
        dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
        dl.kv dt { color: var(--ink-2); font-weight: 700; }
        dl.kv dd { margin: 0; font-weight: 800; word-break: break-all; }
        .lines { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--sunk); font-size: 15px; }
        .lines div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
        .lines div + div { margin-top: 4px; }
        .lines .sum { border-top: 1.5px dashed var(--line); margin-top: 8px; padding-top: 8px; font-weight: 800; }
        .hist { margin-top: 12px; font-size: 13px; color: var(--ink-2); }
        .hist div + div { margin-top: 3px; }
        .stepper { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 99px; background: var(--sunk); }
        .stepper button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 0 0 1.5px var(--line); font-size: 20px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
        .stepper button:active { transform: scale(.92); }
        .stepper b { min-width: 2.2ch; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
        .add-it { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .add-it:last-child { border-bottom: 0; }

        /* はじめの画面 */
        .welcome { text-align: center; padding: 30px 6px 10px; }
        .welcome h2 { margin: 10px 0 6px; font-size: 26px; font-weight: 800; }
        .welcome p { margin: 0 auto; max-width: 30em; color: var(--ink-2); }
        .welcome svg.art { width: 190px; height: 120px; }
        .choice { display: grid; gap: 14px; margin-top: 22px; text-align: left; }
        .choice .card { display: flex; gap: 14px; align-items: center; cursor: pointer; touch-action: manipulation; transition: transform 160ms var(--ease-out); border: 0; width: 100%; text-align: left; }
        .choice .card:active { transform: translate(2px, 3px); }
        .choice .card .ic { width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; display: grid; place-items: center; background: var(--sunk); }
        .choice .card .ic svg { width: 26px; height: 26px; }
        .choice .card b { display: block; font-size: 17px; color: var(--ink); }
        .choice .card span { font-size: 13.5px; color: var(--ink-2); }

        /* 知らせ */
        .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; display: flex; align-items: center; gap: 12px; max-width: min(94vw, 520px); padding: 10px 10px 10px 18px; border-radius: 18px; font-size: 14.5px; font-weight: 700; color: var(--paper); background: var(--ink); box-shadow: 0 10px 30px rgba(20, 14, 36, .35); transform: translate(-50%, 150%); opacity: 0; transition: transform 300ms var(--ease-out), opacity 200ms ease; pointer-events: none; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
        .toast button { flex-shrink: 0; border: 0; border-radius: 12px; padding: 9px 14px; font-weight: 800; background: var(--pink); color: #2A2140; cursor: pointer; }
        .toast button[hidden] { display: none; }
        .banner { margin-top: 12px; }

        /* 印刷（同じページで印刷する。iPhone でも印刷できるように） */
        #print { display: none; }
        @media print {
            @page { margin: 12mm; }
            body { background: #fff !important; color: #000; }
            body::before, .wrap, .toast, .sheet, .sheet-bg { display: none !important; }
            #print { display: block; color: #000; font-family: var(--font); }
            #print table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
            #print th, #print td { border: 1px solid #999; padding: 4px 6px; text-align: left; vertical-align: top; }
            #print th { background: #eee; }
            #print td.n { text-align: right; font-variant-numeric: tabular-nums; }
            #print .cancel td { color: #888; text-decoration: line-through; }
            #print h1 { font-size: 16pt; margin: 0 0 4pt; }
            #print .poster { text-align: center; padding-top: 10mm; }
            #print .poster h1 { font-size: 34pt; margin: 6mm 0; }
            #print .poster .q svg { width: 90mm; height: 90mm; }
            #print .poster p { font-size: 14pt; margin: 3mm 0; white-space: pre-wrap; }
            #print .keycard { border: 2px dashed #000; border-radius: 6mm; padding: 10mm; max-width: 150mm; }
            #print .keycard .k { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 20pt; font-weight: 800; letter-spacing: .08em; margin: 6mm 0; }
        }
        @media (hover: hover) and (pointer: fine) {
            .r:hover { box-shadow: 0 0 0 1.5px var(--purple); }
            .btn.sub:hover { box-shadow: inset 0 0 0 1.5px var(--purple); }
            .choice .card:hover { box-shadow: 0 0 0 1.5px var(--purple), 4px 5px 0 var(--off, var(--pink)); }
        }
        @media (prefers-reduced-motion: reduce) {
            .tabs .pill, .sheet, .save-bar, .toast, .bar-m i, .toggle::after { transition-property: opacity, background-color, color !important; }
            .sheet { transform: none; opacity: 0; transition: opacity 200ms ease; }
            .sheet.show { opacity: 1; }
            .sheet:not(.show) { pointer-events: none; }
            .toast { transform: translate(-50%, 0); }
            .r.flash { animation: none; }
            .save-bar.idle { transform: none; }
        }
        .view-in { animation: viewIn 320ms var(--ease-out) both; }
        @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .view-in { animation: fadeIn 200ms ease both; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 520px) {
            .grid2 { grid-template-columns: minmax(0, 1fr); }
            .it-ed { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; }
            .it-ed .nm { grid-column: 1 / -1; }
            .share { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .r { grid-template-columns: 48px 1fr auto; gap: 10px; padding: 10px; }
            .r .no { width: 48px; height: 48px; font-size: 18px; border-radius: 14px; }
            .quick { min-width: 80px; }
        }
        [hidden] { display: none !important; }
    </style>

<script>
(function () {
    'use strict';
    const Y = window.Yoyaku;
    const $ = id => document.getElementById(id);
    const esc = Y.esc, yen = Y.yen;
    const ST = { new: '予約中', done: '受け取り済み', cancel: '取り消し' };

    // ---- 端末の中の保存（キーの頭は yoyakucho_。レジの初期化では消えない） ----
    // admin = { books: [{ bid, key, title }], cur: bid, who: 名前 }
    let adm = Y.lsGet('admin', null) || { books: [], cur: '', who: '' };
    if (!Array.isArray(adm.books)) adm.books = [];
    function saveAdm() { Y.lsSet('admin', adm); Y.idbPut('admin', adm); }
    const curEntry = () => adm.books.find(b => b.bid === adm.cur) || null;

    let c = null, bid = '', book = null, tally = { n: 0, c: {} };
    let resv = {};            // rid → 予約（置き場から。届いた物は消さずに持つ）
    let tab = 'list', filter = 'all', query = '', viewer = null;
    let offs = [], online = 'wait', pendingWrites = false, firstList = true, seen = new Set();
    let draft = null, draftDirty = false;

    // ---- 知らせ ----
    let toastT = 0, toastUndo = null;
    function toast(text, undo) {
        $('toast-t').textContent = text;
        toastUndo = undo || null;
        $('toast-b').hidden = !undo;
        $('toast').classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => { $('toast').classList.remove('show'); toastUndo = null; }, undo ? 6000 : 2800);
    }
    $('toast-b').addEventListener('click', () => { const u = toastUndo; $('toast').classList.remove('show'); toastUndo = null; if (u) u(); });

    // ---- 控え（この端末の中）：消さずに足すだけ ----
    let mirrorT = 0;
    function mirrorKey(b) { return 'mirror_' + b; }
    function loadMirror(b) {
        const m = Y.lsGet(mirrorKey(b), null);
        return m && typeof m === 'object' ? m : null;
    }
    function plain(r) {
        const o = Object.assign({}, r);
        if (o.at && o.at.toMillis) o.at = o.at.toMillis();
        return o;
    }
    function saveMirror() {
        clearTimeout(mirrorT);
        mirrorT = setTimeout(async () => {
            if (!bid) return;
            const old = loadMirror(bid) || {};
            const all = Object.assign({}, old.resv || {});
            Object.entries(resv).forEach(([rid, r]) => { all[rid] = plain(r); });
            const m = { bid, book: book ? Object.assign({}, book) : old.book, resv: all, tally, savedAt: Date.now(), ver: 1 };
            const okLs = Y.lsSet(mirrorKey(bid), m);
            const okIdb = await Y.idbPut(mirrorKey(bid), m);
            if (!okLs && !okIdb) toast('この端末に控えを保存できませんでした。「控え・鍵」から書き出してください');
        }, 500);
    }
    async function restoreMirror(b) {
        let m = loadMirror(b);
        const fromIdb = await Y.idbGet(mirrorKey(b));
        if (fromIdb && (!m || (fromIdb.savedAt || 0) > (m.savedAt || 0) || Object.keys(fromIdb.resv || {}).length > Object.keys((m && m.resv) || {}).length)) {
            m = Object.assign({}, fromIdb, { resv: Object.assign({}, (m && m.resv) || {}, fromIdb.resv || {}) });
        }
        return m;
    }

    // ---- つなぐ ----
    function setNet(s, text) {
        online = s;
        const n = $('net');
        n.className = 'net ' + s;
        n.textContent = text;
    }
    async function boot() {
        Y.askPersist();
        // 古い控え（IndexedDB）から管理の情報を戻す（localStorage だけが消えた時）
        if (!adm.books.length) {
            const a = await Y.idbGet('admin');
            if (a && Array.isArray(a.books) && a.books.length) { adm = a; Y.lsSet('admin', adm); }
        }
        if (adm.cur && !curEntry()) adm.cur = adm.books.length ? adm.books[0].bid : '';
        if (!adm.cur) { renderWelcome(); connectQuiet(); return; }
        await openBook(adm.cur);
    }
    async function connectQuiet() { try { c = c || await Y.connect({ persist: true }); } catch (e) {} }
    async function openBook(b) {
        offs.forEach(f => { try { f(); } catch (e) {} });
        offs = [];
        bid = b; adm.cur = b; saveAdm();
        viewer = null;
        resv = {}; book = null; tally = { n: 0, c: {} }; firstList = true; seen = new Set(); draft = null; draftDirty = false;
        // まず手元の控えを出す（電波が無くても一覧が見える）
        const m = await restoreMirror(b);
        if (m) { book = m.book || null; resv = Object.assign({}, m.resv || {}); tally = m.tally || tally; Object.keys(resv).forEach(r => seen.add(r)); }
        $('top').hidden = false;
        setNet('wait', 'つないでいます');
        render();
        try { c = c || await Y.connect({ persist: true }); }
        catch (e) { setNet('off', e && e.code === 'no-config' ? '準備ができていません' : 'つながっていません'); render(); setTimeout(() => { if (bid === b && online !== 'on') openBook(b); }, 15000); return; }
        await ensureOwner();
        watch();
    }
    // 管理者か確かめる。ちがう時（端末の名前が変わった等）は、覚えている鍵で管理者に戻る
    async function ensureOwner() {
        const ref = c.db.collection('books').doc(bid);
        let snap = null;
        try { snap = await Y.withTimeout(ref.get(), 15000); } catch (e) { return; }
        if (!snap.exists) return;
        const d = snap.data() || {};
        if ((d.owners || []).includes(c.uid)) return;
        const ent = curEntry();
        if (ent && ent.key) {
            try { await claimWithKey(ent.key, bid); toast('鍵を使って、管理者に戻りました'); }
            catch (e) { toast('管理者に戻れませんでした。鍵を確かめてください'); }
        }
    }
    async function claimWithKey(key, b) {
        await c.db.collection('books').doc(b).collection('claims').doc(c.uid).set({ k: key, at: c.FV.serverTimestamp() });
        await c.db.collection('books').doc(b).update({ owners: c.FV.arrayUnion(c.uid) });
    }
    function watch() {
        const ref = c.db.collection('books').doc(bid);
        const b0 = bid;
        offs.push(ref.onSnapshot({ includeMetadataChanges: true }, s => {
            if (b0 !== bid) return;
            if (s.exists) {
                book = s.data();
                const ent = curEntry();
                if (ent && ent.title !== book.title) { ent.title = book.title; saveAdm(); }
            }
            netFrom(s.metadata);
            saveMirror();
            if (!(tab === 'set' && draftDirty)) render();
        }, e => { setNet('off', Y.isPerm(e) ? '管理者ではありません' : 'つながっていません'); render(); }));
        offs.push(ref.collection('resv').onSnapshot({ includeMetadataChanges: true }, s => {
            if (b0 !== bid) return;
            const fresh = [];
            s.docChanges().forEach(ch => {
                const d = ch.doc.data({ serverTimestamps: 'estimate' });
                d.rid = ch.doc.id;
                resv[ch.doc.id] = d;   // 消された知らせ（removed）が来ても、手元からは消さない
                if (!seen.has(ch.doc.id)) { seen.add(ch.doc.id); if (!firstList) fresh.push(d); }
            });
            pendingWrites = s.metadata.hasPendingWrites;
            netFrom(s.metadata);
            firstList = false;
            saveMirror();
            sheetAuto();
            if (fresh.length) {
                const f = fresh.sort((a, b) => (b.seq || 0) - (a.seq || 0))[0];
                toast(fresh.length > 1 ? `新しい予約が ${fresh.length} 件` : `新しい予約 No.${f.seq} ${f.name}さん`);
            }
            if (tab === 'list' || tab === 'sum') render(fresh.map(x => x.rid));
            else paintCounts();
        }, e => { setNet('off', Y.isPerm(e) ? '管理者ではありません' : 'つながっていません'); if (Y.isPerm(e)) render(); }));
        offs.push(ref.collection('tally').doc('c').onSnapshot(s => { if (b0 !== bid) return; if (s.exists) tally = Object.assign({ n: 0, c: {} }, s.data()); if (tab === 'sum') render(); }, () => {}));
    }
    function netFrom(md) {
        if (!md) return;
        if (md.hasPendingWrites) setNet('wait', '送信待ちがあります');
        else if (md.fromCache) setNet(navigator.onLine === false ? 'off' : 'wait', navigator.onLine === false ? '電波なし（手元の写し）' : '手元の写し');
        else setNet('on', 'つながっています');
    }
    addEventListener('online', () => { if (bid && online !== 'on' && !offs.length) openBook(bid); });

    // ---- 画面 ----
    function list() { return Object.values(viewer ? viewer.resv : resv).filter(r => r && r.seq).sort((a, b) => (b.seq || 0) - (a.seq || 0)); }
    const curBook = () => viewer ? viewer.book : book;
    function paintCounts() {
        const a = list();
        $('t-n').textContent = a.length ? String(a.filter(r => r.st !== 'cancel').length) : '';
    }
    function setTab(t) {
        if (tab === 'set' && t !== 'set' && draftDirty && !confirm('受付の設定が、まだ保存されていません。保存しないで移りますか？')) return;
        if (t !== 'set') { draft = null; draftDirty = false; }
        tab = t;
        render();
        scrollTo({ top: 0 });
    }
    $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
    function render(flash) {
        const main = $('main');
        const k = ['list', 'sum', 'set', 'safe'].indexOf(tab);
        $('tab-pill').style.transform = `translateX(${k * 100}%)`;
        document.querySelectorAll('#tabs [data-tab]').forEach(b => { b.classList.toggle('on', b.dataset.tab === tab); b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'); });
        const b = curBook();
        $('h-name').textContent = (b && b.title) || (curEntry() && curEntry().title) || '予約帳';
        $('h-shop').textContent = viewer ? '控えのファイル（読むだけ）' : ((b && b.shop) ? b.shop + '・予約帳' : '予約帳');
        paintCounts();
        const prevTab = main.dataset.tab;
        let html = '';
        if (viewer) html = `<div class="note info banner"><p>控えのファイルを表示しています（読むだけ）。</p><button type="button" class="btn sub" data-act="closeViewer">控えのファイルを閉じる</button></div>`;
        if (tab === 'list') html += listHtml();
        else if (tab === 'sum') html += sumHtml();
        else if (tab === 'set') html += viewer ? '<p class="muted" style="margin-top:20px">控えのファイルでは、設定は変えられません。</p>' : setHtml();
        else html += safeHtml();
        // 入力中の検索欄は作り直さない（文字が消えないように）
        const focusSearch = document.activeElement && document.activeElement.id === 'q';
        main.innerHTML = html;
        if (prevTab !== tab) { main.classList.remove('view-in'); void main.offsetWidth; main.classList.add('view-in'); }
        main.dataset.tab = tab;
        if (focusSearch) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
        (flash || []).forEach(rid => { const el = main.querySelector(`[data-rid="${CSS.escape(rid)}"]`); if (el) el.classList.add('flash'); });
        if (tab === 'set' && !viewer) bindSet();
    }

    // 一覧
    function dupSids(a) {
        const n = {};
        a.forEach(r => { if (r.sid && r.st !== 'cancel') n[r.sid] = (n[r.sid] || 0) + 1; });
        return n;
    }
    function itemsText(r) { return (r.items || []).map(l => `${esc(l.name)} <b>×${l.n}</b>`).join('、'); }
    function listHtml() {
        const all = list();
        const counts = { all: all.length, new: 0, done: 0, cancel: 0 };
        all.forEach(r => { counts[r.st] = (counts[r.st] || 0) + 1; });
        const dup = dupSids(all);
        const q = Y.normSid(query).toLowerCase(), qn = query.trim().toLowerCase();
        const shown = all.filter(r => (filter === 'all' || r.st === filter) && (!qn || String(r.seq) === qn.replace(/^no\.?/, '') || String(r.name || '').toLowerCase().includes(qn) || (q && String(r.sid || '').toLowerCase().includes(q))));
        const b = curBook();
        const remind = backupReminder();
        let state = '';
        if (b && !viewer) {
            const s = Y.bookState(b);
            state = s === 'open' ? '' : `<div class="note ${s === 'after' ? 'info' : 'warn'} banner"><p>${s === 'before' ? `受付は ${Y.dt(b.from)} から始まります。` : s === 'off' ? 'いまは受付を止めています（お客様は予約できません）。' : '受付の期間は終わりました。'}</p>${s === 'off' && !all.length ? '<p>「受付」のタブで内容を確かめてから、受付を始めてください。</p>' : ''}</div>`;
        }
        return `${state}${remind}
            <div class="tools"><label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="番号・お名前・${esc((b && b.sidLabel) || '学籍番号')}で探す" value="${esc(query)}" autocomplete="off" enterkeyhint="search"></label>
                ${viewer ? '' : `<button type="button" class="icon-btn" data-act="add" aria-label="店頭・電話の予約を足す"><svg><use href="#i-plus"/></svg></button>`}</div>
            <div class="filters">${[['all', 'すべて'], ['new', '予約中'], ['done', '受け取り済み'], ['cancel', '取り消し']].map(([k, t]) => `<button type="button" data-filter="${k}" class="${filter === k ? 'on' : ''}">${t}<b>${counts[k] || 0}</b></button>`).join('')}</div>

    }
    function rowHtml(r, dup) {
        const q = r.st === 'new' ? `<button type="button" class="quick" data-quick="${esc(r.rid)}">受け取り</button>` : `<button type="button" class="quick ${r.st}" data-open="${esc(r.rid)}">${ST[r.st] || ''}</button>`;

    // 控えの保存を思い出させる（新しい予約が増えたのに、ファイルの控えが古い時）
    function backupReminder() {
        if (viewer || !bid) return '';
        const ent = curEntry();
        const last = (ent && ent.savedAt) || 0;
        const newer = list().filter(r => (Y.msOf(r.at) || r.cat || 0) > last).length;
        if (!newer || newer < 5 && Date.now() - last < 3 * 86400000) return '';
        return `<div class="note warn banner"><p>前にファイルの控えを保存してから、新しい予約が ${newer} 件あります。</p><button type="button" class="btn sub" data-act="saveJson"><svg><use href="#i-down"/></svg>控えをファイルに保存</button></div>`;
    }

    // 集計
    function sumHtml() {
        const b = curBook();
        const items = Y.bookItems(b);
        const all = list();
        const live = all.filter(r => r.st !== 'cancel');
        const per = {};
        items.forEach(it => { per[it.id] = { it, resv: 0, done: 0 }; });
        live.forEach(r => (r.items || []).forEach(l => {
            if (!per[l.id]) per[l.id] = { it: { id: l.id, name: l.name, price: l.price, cap: 0 }, resv: 0, done: 0 };
            per[l.id].resv += l.n;
            if (r.st === 'done') per[l.id].done += l.n;
        }));
        const yAll = live.reduce((s, r) => s + (r.total || 0), 0);
        const yDone = all.filter(r => r.st === 'done').reduce((s, r) => s + (r.total || 0), 0);
        const qAll = live.reduce((s, r) => s + (r.qty || 0), 0);
        const counts = (tally && tally.c) || {};
        const mismatch = !viewer && Object.values(per).some(p => (Number(counts[p.it.id]) || 0) !== p.resv);
        return `<div class="sec"><h2>合わせて</h2><div class="kpis">
                <div class="kpi"><small>予約</small><b>${live.length}<span> 件</span></b><span>取り消し ${all.length - live.length} 件</span></div>
                <div class="kpi"><small>個数</small><b>${qAll}<span> 個</span></b><span>受け取り済み ${Object.values(per).reduce((s, p) => s + p.done, 0)} 個</span></div>
                <div class="kpi"><small>予約の金額</small><b>${yen(yAll)}</b><span>受け取り済み ${yen(yDone)}</span></div>
            </div></div>
            <div class="sec"><h2>品ごと</h2><div class="card" style="--off:var(--sky)"><div class="tb-wrap"><table class="tb">
                <thead><tr><th>品</th><th>予約</th><th>受け取り済み</th><th>まだ</th><th>上限</th></tr></thead>
                <tbody>${Object.values(per).map(p => `<tr><td>${esc(p.it.name)}${p.it.cap ? `<div class="bar-m"><i style="transform:scaleX(${Math.min(1, p.resv / p.it.cap).toFixed(3)})"></i></div>` : ''}</td><td>${p.resv}</td><td>${p.done}</td><td>${p.resv - p.done}</td><td>${p.it.cap ? p.it.cap + (p.resv > p.it.cap ? ' <b style="color:var(--bad)">こえています</b>' : '') : '—'}</td></tr>`).join('')}</tbody>
            </table></div></div></div>
            ${mismatch ? `<div class="note warn"><p>予約できる残りの数（数え）が、一覧と合っていません。</p><button type="button" class="btn sub" data-act="recount"><svg><use href="#i-refresh"/></svg>数え直す</button></div>` : ''}
            <div class="sec"><h2>受け取りの準備</h2><div class="row-btns"><button type="button" class="btn sub" data-act="printList"><svg><use href="#i-print"/></svg>受け取りの一覧を印刷</button><button type="button" class="btn sub" data-act="csv"><svg><use href="#i-down"/></svg>CSV（表計算ソフト用）</button></div></div>
            ${viewer ? '' : `<p class="muted" style="margin-top:14px">数え直す：品ごとの予約の数を、一覧からもう一度数えます。<button type="button" class="btn sub" data-act="recount" style="margin-left:6px;min-height:36px;padding:6px 12px;font-size:13px">数え直す</button></p>`}`;
    }

    // 受付の設定
    function toLocal(ms) {
        if (!ms) return '';
        const d = new Date(ms), p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function fromLocal(v) { const t = Date.parse(v); return isNaN(t) ? 0 : Math.round(t); }
    function custUrl() { const u = new URL('yoyaku.html', location.href); u.search = '?b=' + encodeURIComponent(bid); u.hash = ''; return u.toString(); }
    function setHtml() {
        if (!book) return `<p class="muted" style="margin-top:20px">${online === 'off' ? 'つながると、設定を読み込みます。' : '読み込んでいます…'}</p>`;
        if (!draft) draft = JSON.parse(JSON.stringify({ title: book.title || '', shop: book.shop || '', lead: book.lead || '', pickup: book.pickup || '', note: book.note || '', on: !!book.on, from: book.from || 0, to: book.to || 0, items: Y.bookItems(book), maxQty: book.maxQty || 5, sidLabel: book.sidLabel || '学籍番号', sidReq: book.sidReq !== false, sheet: book.sheet || '' }));
        const s = Y.bookState(book);
        const used = usedItems();
        return `<div class="card open-big" style="--off:${book.on ? 'var(--sky)' : 'var(--peach)'}">
                <div class="t"><b>${book.on ? (s === 'open' ? '受付中です' : s === 'before' ? '受付の期間の前です' : '受付の期間が終わりました') : '受付を止めています'}</b><span class="muted">${book.on ? 'お客様は予約のページから予約できます（期間の間だけ）。' : 'お客様のページには「受付を止めています」と出ます。'}</span></div>
                <button type="button" class="toggle" role="switch" aria-checked="${book.on ? 'true' : 'false'}" data-act="toggleOn" aria-label="受付"></button>
            </div>
            <div class="sec"><h2>お客様のページ</h2><div class="card share" style="--off:var(--pink)">
                <div class="q">${Y.qrSvg(custUrl(), '予約のページのQRコード')}</div>
                <div><div class="url">${esc(custUrl())}</div>
                <div class="row-btns"><button type="button" class="btn sub" data-act="copyUrl"><svg><use href="#i-link"/></svg>リンクをコピー</button><a class="btn sub" href="${esc(custUrl())}" target="_blank" rel="noopener">開いてみる</a><button type="button" class="btn sub" data-act="poster"><svg><use href="#i-print"/></svg>ポスターを印刷</button></div></div>
            </div></div>
            <div class="sec"><h2>予約のページの文</h2><div class="card" style="--off:var(--sky)">
                <label class="f"><span class="lb">題<small>40字まで（例：12月 シュトーレンのご予約）</small></span><input type="text" data-k="title" maxlength="40" value="${esc(draft.title)}"></label>
                <label class="f"><span class="lb">お店・団体の名前</span><input type="text" data-k="shop" maxlength="60" value="${esc(draft.shop)}"></label>
                <label class="f"><span class="lb">ごあいさつ・品の説明<small>400字まで</small></span><textarea data-k="lead" maxlength="400">${esc(draft.lead)}</textarea></label>
                <label class="f"><span class="lb">受け取りの日時・場所<small>300字まで</small></span><textarea data-k="pickup" maxlength="300" placeholder="例：12月20日（土）12:00〜15:00&#10;学生会館 1階">${esc(draft.pickup)}</textarea></label>
                <label class="f"><span class="lb">お知らせ<small>アレルギー・お支払いなど</small></span><textarea data-k="note" maxlength="400">${esc(draft.note)}</textarea></label>
            </div></div>
            <div class="sec"><h2>受付の期間</h2><div class="card" style="--off:var(--peach)">
                <div class="grid2"><label class="f"><span class="lb">始め</span><input type="datetime-local" data-k="from" value="${toLocal(draft.from)}"></label>
                <label class="f"><span class="lb">終わり</span><input type="datetime-local" data-k="to" value="${toLocal(draft.to)}"></label></div>
                <p class="muted" style="margin:10px 2px 0">期間の外は、お客様は予約できません。管理者は、店頭・電話の予約を、期間の外でも足せます。</p>
            </div></div>
            <div class="sec"><h2>予約できる品</h2><div class="items-ed" id="items-ed">${draft.items.map((it, i) => `<div class="it-ed${it.off ? ' off' : ''}" data-i="${i}">
                    <label class="f nm"><span class="lb">品の名前</span><input type="text" data-ik="name" maxlength="40" value="${esc(it.name)}"></label>
                    <label class="f"><span class="lb">値段（円）</span><input type="number" inputmode="numeric" min="0" step="1" data-ik="price" value="${it.price}"></label>
                    <label class="f"><span class="lb">上限<small>0=なし</small></span><input type="number" inputmode="numeric" min="0" step="1" data-ik="cap" value="${it.cap}"></label>
                    <button type="button" class="rm" data-rm="${i}" aria-label="${used.has(it.id) ? '受付を止める' : '消す'}"><svg><use href="#i-x"/></svg></button>
                    <label class="f desc"><span class="lb">ひとこと<small>大きさなど</small></span><input type="text" data-ik="desc" maxlength="120" value="${esc(it.desc)}"></label>
                    ${it.off ? `<div class="desc muted">この品は受付を止めています（予約がある品は消さずに止めます）。<button type="button" class="btn sub" data-unoff="${i}" style="min-height:34px;padding:4px 12px;font-size:13px">もどす</button></div>` : ''}
                </div>`).join('')}</div>
                ${draft.items.length < 20 ? `<button type="button" class="btn sub wide" data-act="addItem" style="margin-top:10px"><svg><use href="#i-plus"/></svg>品を足す</button>` : ''}
            </div>
            <div class="sec"><h2>聞くこと</h2><div class="card" style="--off:var(--pink)">
                <div class="grid2"><label class="f"><span class="lb">番号の呼び方</span><input type="text" data-k="sidLabel" maxlength="16" value="${esc(draft.sidLabel)}"></label>
                <label class="f"><span class="lb">1回の予約の上限（個）</span><input type="number" inputmode="numeric" min="1" max="50" data-k="maxQty" value="${draft.maxQty}"></label></div>
                <div class="sw" style="margin-top:14px"><span class="t">${esc(draft.sidLabel || '番号')}を必ず聞く<small>オフにすると、なくても予約できます</small></span><button type="button" class="toggle" role="switch" data-k="sidReq" aria-checked="${draft.sidReq ? 'true' : 'false'}"></button></div>
            </div></div>
            <div class="sec"><h2>Google スプレッドシートの控え</h2><div class="card" style="--off:var(--sky)">
                <label class="f"><span class="lb">Apps Script のウェブアプリの URL<small>なくてもよい</small></span><input type="url" data-k="sheet" maxlength="300" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(draft.sheet)}"></label>
                <p class="muted" style="margin:8px 2px 0">予約が届くたびに、スプレッドシートにも1行ずつ写します（作り方：docs/予約帳.md）。</p>
            </div></div>
            <div class="save-bar${draftDirty ? '' : ' idle'}" id="save-bar"><button type="button" class="btn sub" data-act="resetDraft">やめる</button><button type="button" class="btn" data-act="saveDraft">保存する</button></div>`;
    }
    function usedItems() { const s = new Set(); Object.values(resv).forEach(r => (r.items || []).forEach(l => s.add(l.id))); return s; }
    function markDirty() { draftDirty = true; const b = $('save-bar'); if (b) b.classList.remove('idle'); }
    function bindSet() {
        const m = $('main');
        m.querySelectorAll('[data-k]').forEach(el => {
            if (el.classList.contains('toggle')) return;
            el.addEventListener('input', () => {
                const k = el.dataset.k;
                draft[k] = k === 'from' || k === 'to' ? fromLocal(el.value) : (k === 'maxQty' ? Number(el.value) : el.value);
                markDirty();
            });
        });
        m.querySelectorAll('[data-ik]').forEach(el => el.addEventListener('input', () => {
            const i = Number(el.closest('[data-i]').dataset.i), k = el.dataset.ik;
            draft.items[i][k] = k === 'price' || k === 'cap' ? Number(el.value) : el.value;
            markDirty();
        }));
    }
    function draftCheck() {
        const d = draft;
        if (!d.title.trim()) return '題を入れてください';
        if (!d.from || !d.to || d.to <= d.from) return '受付の期間（始め・終わり）を確かめてください';
        const live = d.items.filter(it => !it.off);
        if (!live.length) return '予約できる品を1つ以上入れてください';
        if (d.items.some(it => !String(it.name || '').trim())) return '品の名前を入れてください';
        if (d.items.some(it => !(Number(it.price) >= 0) || !Number.isFinite(Number(it.price)))) return '値段を確かめてください';
        if (!(d.maxQty >= 1 && d.maxQty <= 50)) return '1回の予約の上限は 1〜50 個にしてください';
        if (d.sheet.trim() && !Y.sheetOk(d.sheet)) return 'スプレッドシートの URL は、Apps Script のウェブアプリの URL（https://script.google.com/macros/s/…/exec）を入れてください';
        return '';
    }
    async function saveDraft() {
        const bad = draftCheck();
        if (bad) { toast(bad); return; }
        const d = draft;
        const upd = {
            title: d.title.trim().slice(0, 40), shop: d.shop.trim().slice(0, 60), lead: d.lead.slice(0, 400), pickup: d.pickup.slice(0, 300), note: d.note.slice(0, 400),
            from: Math.round(d.from), to: Math.round(d.to), maxQty: Math.round(d.maxQty), sidLabel: (d.sidLabel.trim() || '学籍番号').slice(0, 16), sidReq: !!d.sidReq,
            sheet: d.sheet.trim().slice(0, 300),
            items: d.items.map(it => ({ id: it.id, name: String(it.name).trim().slice(0, 40), price: Math.max(0, Math.round(Number(it.price) || 0)), cap: Math.max(0, Math.round(Number(it.cap) || 0)), desc: String(it.desc || '').slice(0, 120), off: !!it.off })),
            at: Date.now(), ver: (Number(book.ver) || 0) + 1
        };
        try {
            await Y.withTimeout(c.db.collection('books').doc(bid).update(upd), 20000);
            draft = null; draftDirty = false;
            toast('保存しました');
            render();
        } catch (e) {
            toast(Y.isNet(e) ? 'つながっていないので、保存できませんでした' : '保存できませんでした');
        }
    }
    async function toggleOn() {
        const on = !book.on;
        if (on) {
            const s = Y.bookState(Object.assign({}, book, { on: true }));
            if (s !== 'open' && !confirm(s === 'before' ? `受付の期間は ${Y.dt(book.from)} からです。受付を「入」にしますか？（期間になると予約できます）` : '受付の期間が終わっています。受付を「入」にしても、期間を延ばすまで予約はできません。続けますか？')) return;
        } else if (!confirm('受付を止めますか？\nお客様は予約できなくなります（届いた予約は消えません）。')) return;
        try { await Y.withTimeout(c.db.collection('books').doc(bid).update({ on, at: Date.now() }), 20000); toast(on ? '受付を始めました' : '受付を止めました'); }
        catch (e) { toast('変えられませんでした（つながっていますか？）'); }
    }

    // 控え・鍵
    function safeHtml() {
        const ent = curEntry();
        const m = loadMirror(bid);
        const n = list().length;
        const sheet = book && Y.sheetOk(book.sheet);
        const sent = Y.lsGet('sheet_' + bid, {});
        return `<div class="sec"><h2>予約の控え</h2><div class="card" style="--off:var(--sky)">
                <p style="margin:0">予約は、置き場（Firestore）にあり、<b>だれにも消せません</b>。さらに、この端末の中にも写しを持っています（レジを初期化しても消えません）。</p>
                <div class="note ${m ? 'ok' : 'warn'}"><p>この端末の写し：${m ? `${Object.keys(m.resv || {}).length} 件・${esc(Y.dt(m.savedAt))}` : 'まだありません'}</p><p>ファイルの控え：${ent && ent.savedAt ? esc(Y.dt(ent.savedAt)) : 'まだ保存していません'}</p></div>
                <div class="row-btns">
                    <button type="button" class="btn" data-act="saveJson"><svg><use href="#i-down"/></svg>控えをファイルに保存</button>
                    <button type="button" class="btn sub" data-act="csv"><svg><use href="#i-sheet"/></svg>CSV</button>
                    <button type="button" class="btn sub" data-act="printList"><svg><use href="#i-print"/></svg>印刷</button>
                    <button type="button" class="btn sub" data-act="openFile"><svg><use href="#i-open"/></svg>控えのファイルを開く</button>
                </div>
                <p class="muted" style="margin:10px 2px 0">ファイルの控えは、パソコン・USBメモリ・クラウドなど、<b>この端末とは別の所</b>にも置いてください。「控えのファイルを開く」で、電波がなくても中身を見られます。</p>
            </div></div>
            ${viewer ? '' : `<div class="sec"><h2>Google スプレッドシート</h2><div class="card" style="--off:var(--pink)">
                ${sheet ? `<p style="margin:0">予約が届くたびに写しています。最後に送った時：${sent._at ? esc(Y.dt(sent._at)) : 'まだ'}</p>
                <div class="row-btns"><button type="button" class="btn sub" data-act="sheetAll"><svg><use href="#i-sheet"/></svg>全部をもう一度送る（${n}件）</button></div>
                <p class="muted" style="margin:10px 2px 0">送れたかどうかは、この画面では分かりません。スプレッドシートを開いて確かめてください。</p>` : `<p style="margin:0" class="muted">まだつないでいません。「受付」のタブの下で、Apps Script の URL を入れると使えます。作り方：docs/予約帳.md</p>`}
            </div></div>
            <div class="sec"><h2>予約帳の鍵</h2><div class="card" style="--off:var(--peach)">
                <p style="margin:0">この端末をなくした時・初期化した時は、<b>鍵</b>を使うと、ほかの端末から管理者に戻れます。<b>印刷して、大切に保管</b>してください。鍵を知っている人は、予約（お名前・番号）を見られます。</p>
                ${ent && ent.key ? `<div class="key hide" id="key" data-act="showKey" style="margin-top:12px">${esc(Y.keyShow(ent.key))}</div>
                <div class="row-btns"><button type="button" class="btn sub" data-act="printKey"><svg><use href="#i-print"/></svg>鍵を印刷</button><button type="button" class="btn sub" data-act="copyKey"><svg><use href="#i-key"/></svg>鍵をコピー</button></div>` : `<div class="note warn"><p>この端末は、鍵を覚えていません。</p></div><div class="row-btns"><button type="button" class="btn sub" data-act="newKey"><svg><use href="#i-key"/></svg>新しい鍵を作る</button></div>`}
            </div></div>
            <div class="sec"><h2>この端末</h2><div class="card" style="--off:var(--sky)">
                <label class="f"><span class="lb">係の名前<small>受け取り・取り消しの記録に残す（なくてもよい）</small></span><input type="text" id="who" maxlength="40" value="${esc(adm.who || '')}" placeholder="例：佐藤"></label>
                <p class="muted" style="margin:10px 2px 0">管理する端末：${book && Array.isArray(book.owners) ? book.owners.length : '—'} 台</p>
            </div></div>`}`;
    }

    // ---- 押した時 ----
    document.addEventListener('click', e => {
        const t = e.target;
        const quick = t.closest('[data-quick]');
        if (quick) { e.stopPropagation(); quickDone(quick.dataset.quick); return; }
        const f = t.closest('[data-filter]');
        if (f) { filter = f.dataset.filter; render(); return; }
        const rm = t.closest('[data-rm]');
        if (rm) { removeItem(Number(rm.dataset.rm)); return; }
        const un = t.closest('[data-unoff]');
        if (un) { draft.items[Number(un.dataset.unoff)].off = false; markDirty(); render(); return; }
        const tg = t.closest('.toggle[data-k]');
        if (tg) { const k = tg.dataset.k; draft[k] = !draft[k]; tg.setAttribute('aria-checked', draft[k] ? 'true' : 'false'); markDirty(); return; }
        const a = t.closest('[data-act]');
        if (a) { act(a.dataset.act, a); return; }
        const o = t.closest('[data-open]');
        if (o) { openDetail(o.dataset.open); return; }
    });
    document.addEventListener('input', e => {
        if (e.target.id === 'q') { query = e.target.value; render(); }
        if (e.target.id === 'who') { adm.who = e.target.value.trim().slice(0, 40); saveAdm(); }
    });
    $('menu-btn').addEventListener('click', openMenu);
    $('file-in').addEventListener('change', openFile);
    function act(a, el) {
        if (a === 'add') return openAdd();
        if (a === 'csv') return saveCsv();
        if (a === 'saveJson') return saveJson();
        if (a === 'printList') return printList();
        if (a === 'openFile') return $('file-in').click();
        if (a === 'closeViewer') { viewer = null; render(); return; }
        if (a === 'recount') return recount();
        if (a === 'toggleOn') return toggleOn();
        if (a === 'copyUrl') return copyText(custUrl(), 'リンクをコピーしました');
        if (a === 'poster') return printPoster();
        if (a === 'addItem') { draft.items.push({ id: newItemId(), name: '', price: 0, cap: 0, desc: '', off: false }); markDirty(); render(); const ins = document.querySelectorAll('[data-ik="name"]'); if (ins.length) ins[ins.length - 1].focus(); return; }
        if (a === 'saveDraft') return saveDraft();
        if (a === 'resetDraft') { draft = null; draftDirty = false; render(); return; }
        if (a === 'sheetAll') return sheetAll();
        if (a === 'showKey') { el.classList.toggle('hide'); return; }
        if (a === 'printKey') return printKey();
        if (a === 'copyKey') { const ent = curEntry(); if (ent) copyText(Y.keyShow(ent.key), '鍵をコピーしました'); return; }
        if (a === 'newKey') return makeKey(true);
    }
    function newItemId() { const used = new Set((draft.items || []).map(i => i.id)); let id = ''; do { id = 'i' + Math.random().toString(36).slice(2, 7); } while (used.has(id)); return id; }
    function removeItem(i) {
        const it = draft.items[i];
        if (!it) return;
        if (usedItems().has(it.id)) {
            if (!confirm(`「${it.name}」には予約があるので、消さずに受付を止めます。よろしいですか？`)) return;
            it.off = true;
        } else draft.items.splice(i, 1);
        markDirty();
        render();
    }
    async function copyText(t, msg) {
        try { await navigator.clipboard.writeText(t); toast(msg); } catch (e) { prompt('コピーしてください', t); }
    }

    // ---- 受け取り・取り消し（予約は消さない。状態を変えて、記録を足す） ----
    function stBy() { return (adm.who || '').slice(0, 40); }
    async function setStatus(rid, to, opt) {
        opt = opt || {};
        const r = resv[rid];
        if (!r || !c) return false;
        const from = r.st;
        if (from === to) return true;
        const ref = c.db.collection('books').doc(bid);
        const rRef = ref.collection('resv').doc(rid);
        const logRef = ref.collection('log').doc();
        const touchesTally = (from === 'cancel') !== (to === 'cancel');
        try {
            if (!touchesTally) {
                // 受け取り：数えは変わらない。電波が悪くても、あとで送られる（置き場の写しに先に書く）
                const b = c.db.batch();
                b.update(rRef, { st: to, stAt: Date.now(), stBy: stBy() });
                b.set(logRef, { at: c.FV.serverTimestamp(), by: c.uid, rid, act: 'st', from, to, who: stBy(), note: opt.note || '' });
                b.commit().catch(e => toast('送れませんでした：' + (Y.isPerm(e) ? '管理者ではありません' : 'もう一度ためしてください')));
                return true;
            }
            await Y.withTimeout(c.db.runTransaction(async tx => {
                const s = await tx.get(rRef), t = await tx.get(ref.collection('tally').doc('c'));
                if (!s.exists) throw new Error('none');
                const d = s.data();
                if (d.st === to) return;
                const tl = t.exists ? t.data() : { n: 0, c: {} };
                const cnt = Object.assign({}, tl.c || {});
                const sign = to === 'cancel' ? -1 : 1;
                (d.items || []).forEach(l => { cnt[l.id] = Math.max(0, (Number(cnt[l.id]) || 0) + sign * l.n); });
                tx.update(rRef, { st: to, stAt: Date.now(), stBy: stBy() });
                tx.set(ref.collection('tally').doc('c'), { n: Number(tl.n) || 0, c: cnt });
                tx.set(logRef, { at: c.FV.serverTimestamp(), by: c.uid, rid, act: 'st', from: d.st, to, who: stBy(), note: opt.note || '' });
            }), 20000);
            return true;
        } catch (e) {
            toast(Y.isNet(e) ? '取り消しは、つながっている時だけできます' : '変えられませんでした');
            return false;
        }
    }
    async function quickDone(rid) {
        const r = resv[rid];
        if (!r || r.st !== 'new') return;
        const ok = await setStatus(rid, 'done');
        if (ok) toast(`No.${r.seq} ${r.name}さん：受け取り済み`, () => setStatus(rid, 'new', { note: '元に戻す' }));
    }

    // ---- 引き出し ----
    let sheetEl = null, sheetBg = null;
    function openSheet(html) {
        closeSheet(true);
        sheetBg = document.createElement('div');
        sheetBg.className = 'sheet-bg';
        sheetEl = document.createElement('div');
        sheetEl.className = 'sheet';
        sheetEl.setAttribute('role', 'dialog');
        sheetEl.setAttribute('aria-modal', 'true');
        sheetEl.innerHTML = `<div class="grab"></div>${html}`;
        document.body.append(sheetBg, sheetEl);
        sheetBg.addEventListener('click', () => closeSheet());
        requestAnimationFrame(() => requestAnimationFrame(() => { sheetBg.classList.add('show'); sheetEl.classList.add('show'); }));
        return sheetEl;
    }
    function closeSheet(now) {
        const s = sheetEl, b = sheetBg;
        sheetEl = sheetBg = null;
        if (!s) return;
        if (now) { s.remove(); b.remove(); return; }
        s.classList.add('closing');
        s.classList.remove('show'); b.classList.remove('show');
        setTimeout(() => { s.remove(); b.remove(); }, 240);
    }
    addEventListener('keydown', e => { if (e.key === 'Escape' && sheetEl) closeSheet(); });

    async function openDetail(rid) {
        const r = (viewer ? viewer.resv : resv)[rid];
        if (!r) return;
        const b = curBook();
        const s = openSheet(`<h3><span class="no">${esc(r.seq)}</span>${esc(r.name)}さん<button type="button" class="icon-btn close" data-x aria-label="閉じる"><svg><use href="#i-x"/></svg></button></h3>
            <dl class="kv"><dt>状態</dt><dd>${ST[r.st] || esc(r.st)}${r.stAt ? `<span class="muted">（${esc(Y.dt(r.stAt))}${r.stBy ? '・' + esc(r.stBy) : ''}）</span>` : ''}</dd>
                ${r.sid ? `<dt>${esc((b && b.sidLabel) || '学籍番号')}</dt><dd>${esc(r.sid)}</dd>` : ''}<dt>受付</dt><dd>${esc(Y.dt(Y.msOf(r.at) || r.cat))}${r.via === 'shop' ? '（店頭・電話）' : ''}</dd></dl>
            <div class="lines">${(r.items || []).map(l => `<div><span>${esc(l.name)} × ${l.n}</span><span>${yen(l.price * l.n)}</span></div>`).join('')}<div class="sum"><span>合計</span><span>${yen(r.total)}</span></div></div>
            ${viewer ? '' : `<label class="f" style="margin-top:14px"><span class="lb">お店のメモ<small>お客様には見えません</small></span><input type="text" id="snote" maxlength="200" value="${esc(r.snote || '')}"></label>
            <div class="sw" style="margin-top:12px"><span class="t">お支払い済み<small>前払いの時など</small></span><button type="button" class="toggle" id="paid" role="switch" aria-checked="${r.paid ? 'true' : 'false'}"></button></div>
            <div class="row-btns">${r.st === 'new' ? `<button type="button" class="btn okb" data-st="done">受け取り済みにする</button><button type="button" class="btn warn" data-st="cancel">取り消す</button>` : `<button type="button" class="btn sub" data-st="new">「予約中」に戻す</button>${r.st === 'done' ? `<button type="button" class="btn warn" data-st="cancel">取り消す</button>` : ''}`}</div>
            <p class="muted" style="margin:12px 2px 0">予約は消せません。取り消すと、品の数は予約できる残りに戻ります。</p>
            <div class="hist" id="hist"></div>`}`);
        s.addEventListener('click', async e => {
            if (e.target.closest('[data-x]')) { closeSheet(); return; }
            const p = e.target.closest('#paid');
            if (p) {
                const v = p.getAttribute('aria-checked') !== 'true';
                p.setAttribute('aria-checked', v ? 'true' : 'false');
                c.db.collection('books').doc(bid).collection('resv').doc(rid).update({ paid: v }).catch(() => toast('変えられませんでした'));
                return;
            }
            const st = e.target.closest('[data-st]');
            if (st) {
                const to = st.dataset.st;
                if (to === 'cancel' && !confirm(`No.${r.seq} ${r.name}さんの予約を取り消しますか？\n（予約は消えずに「取り消し」として残ります）`)) return;
                st.classList.add('busy');
                const from = r.st;
                const ok = await setStatus(rid, to);
                st.classList.remove('busy');
                if (ok) { closeSheet(); toast(`No.${r.seq}：${ST[to]}`, () => setStatus(rid, from, { note: '元に戻す' })); }
            }
        });
        const sn = s.querySelector('#snote');
        if (sn) sn.addEventListener('change', () => {
            const v = sn.value.slice(0, 200);
            c.db.collection('books').doc(bid).collection('resv').doc(rid).update({ snote: v }).then(() => toast('メモを保存しました')).catch(() => toast('メモを保存できませんでした'));
        });
        // 変えた記録
        if (!viewer && c) {
            try {
                const q = await c.db.collection('books').doc(bid).collection('log').where('rid', '==', rid).get();
                const rows = q.docs.map(d => d.data()).sort((a, b2) => Y.msOf(a.at) - Y.msOf(b2.at));
                const h = s.querySelector('#hist');
                if (h && rows.length) h.innerHTML = '<b>変えた記録</b>' + rows.map(x => `<div>${esc(Y.dt(Y.msOf(x.at)))}　${ST[x.from] || esc(x.from)} → ${ST[x.to] || esc(x.to)}${x.who ? '（' + esc(x.who) + '）' : ''}${x.note ? '・' + esc(x.note) : ''}</div>`).join('');
            } catch (e) {}
        }
    }

    // 店頭・電話の予約を足す
    function openAdd() {
        if (!book) return;
        const items = Y.bookItems(book).filter(i => !i.off);
        const cart = {};
        const s = openSheet(`<h3>店頭・電話の予約を足す<button type="button" class="icon-btn close" data-x aria-label="閉じる"><svg><use href="#i-x"/></svg></button></h3>
            <label class="f"><span class="lb">お名前</span><input type="text" id="a-name" maxlength="30" autocomplete="off"></label>
            <label class="f"><span class="lb">${esc(book.sidLabel || '学籍番号')}<small>なくてもよい</small></span><input type="text" id="a-sid" maxlength="20" autocomplete="off" autocapitalize="characters"></label>
            <div style="margin-top:12px">${items.map(it => `<div class="add-it" data-id="${esc(it.id)}"><div><b>${esc(it.name)}</b><div class="muted">${yen(it.price)}${it.cap ? `・のこり ${Math.max(0, Y.remainOf(it, tally))}` : ''}</div></div>
                <div class="stepper"><button type="button" data-d="-1" aria-label="減らす">−</button><b>0</b><button type="button" data-d="1" aria-label="増やす">＋</button></div></div>`).join('')}</div>
            <div class="row-btns"><button type="button" class="btn wide" id="a-go">予約を足す</button></div>
            <p class="muted" style="margin:10px 2px 0">受付の期間の外でも足せます。番号は、続きの番号になります。</p>`);
        let rid = Y.newRid();
        s.addEventListener('click', async e => {
            if (e.target.closest('[data-x]')) { closeSheet(); return; }
            const d = e.target.closest('[data-d]');
            if (d) {
                const row = d.closest('[data-id]'), id = row.dataset.id;
                cart[id] = Math.max(0, Math.min(50, (cart[id] || 0) + Number(d.dataset.d)));
                row.querySelector('.stepper b').textContent = cart[id];
                return;
            }
            if (e.target.closest('#a-go')) {
                const name = Y.normName($('a-name').value), sid = Y.normSid($('a-sid').value);
                const lines = Object.entries(cart).filter(([, n]) => n > 0).map(([id, n]) => ({ id, n }));
                if (!name) { toast('お名前を入れてください'); return; }
                if (!lines.length) { toast('品の数を入れてください'); return; }
                const btn = $('a-go');
                btn.classList.add('busy');
                try {
                    const res = await Y.withTimeout(Y.reserve(c, bid, rid, { name, sid, lines, via: 'shop' }, book), 25000);
                    closeSheet();
                    toast(`No.${res.seq} ${name}さんの予約を足しました`);
                    if (Y.sheetOk(book.sheet)) Y.sheetPost(book.sheet, { kind: 'resv', row: Y.rowOf(bid, rid, { seq: res.seq, name, sid, items: res.lines, qty: res.qty, total: res.total, st: 'new', via: 'shop', cat: Date.now() }) });
                    rid = Y.newRid();
                } catch (err) {
                    btn.classList.remove('busy');
                    toast(err && err.code === 'cap' ? `「${err.item}」は、のこり ${err.left} 個です` : (Y.isNet(err) ? 'つながっていないので、足せませんでした（もう一度押すと、同じ予約として送ります）' : '足せませんでした'));
                }
            }
        });
    }

    // 数え直す：番号は戻さない。品ごとの数を、一覧から数え直す
    async function recount() {
        if (!c || !book) return;
        try {
            const ref = c.db.collection('books').doc(bid);
            const [rs, sq] = await Promise.all([ref.collection('resv').get(), ref.collection('seq').get()]);
            let maxN = 0;
            sq.docs.forEach(d => { const n = Number(d.id.slice(1)) || 0; if (n > maxN) maxN = n; });
            const cnt = {};
            rs.docs.forEach(d => { const r = d.data(); if ((r.seq || 0) > maxN) maxN = r.seq; if (r.st === 'cancel') return; (r.items || []).forEach(l => { cnt[l.id] = (cnt[l.id] || 0) + l.n; }); });
            await c.db.runTransaction(async tx => {
                const t = await tx.get(ref.collection('tally').doc('c'));
                const n = Math.max(maxN, t.exists ? Number(t.data().n) || 0 : 0);
                tx.set(ref.collection('tally').doc('c'), { n, c: cnt });
            });
            toast('数え直しました');
        } catch (e) { toast('数え直せませんでした（つながっていますか？）'); }
    }

    // ---- 控え：ファイル・CSV・印刷 ----
    const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };
    const fileBase = () => ('予約帳_' + (((curBook() || {}).title) || '').replace(/[\\/:*?"<>|\s]+/g, '')).slice(0, 40);
    function saveJson() {
        const all = {};
        Object.values(viewer ? viewer.resv : resv).forEach(r => { all[r.rid] = plain(r); });
        const data = { kind: 'yoyakucho-backup', ver: 1, bid: viewer ? viewer.bid : bid, savedAt: Date.now(), book: curBook(), tally, resv: all };
        Y.download(`${fileBase()}_${stamp()}.json`, JSON.stringify(data, null, 1), 'application/json');
        if (!viewer) { const ent = curEntry(); if (ent) { ent.savedAt = Date.now(); saveAdm(); } }
        toast('控えのファイルを保存しました');
        if (tab === 'list' || tab === 'safe') render();
    }
    function saveCsv() {
        const a = list().map(r => Object.assign({}, r, { at: Y.msOf(r.at) || r.cat }));
        Y.download(`${fileBase()}_${stamp()}.csv`, Y.toCsv(curBook(), a), 'text/csv;charset=utf-8');
        toast('CSV を保存しました');
    }
    async function openFile(e) {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        try {
            const d = JSON.parse(await f.text());
            if (!d || d.kind !== 'yoyakucho-backup' || typeof d.resv !== 'object') throw new Error('kind');
            viewer = { bid: d.bid, book: d.book || {}, resv: d.resv };
            Object.entries(viewer.resv).forEach(([rid, r]) => { r.rid = rid; });
            tab = 'list';
            $('top').hidden = false;
            render();
            toast(`控えのファイルを開きました（${Object.keys(d.resv).length} 件）`);
        } catch (err) { toast('予約帳の控えのファイルではありません'); }
    }
    function doPrint(html) {
        $('print').innerHTML = html;
        setTimeout(() => { try { window.print(); } catch (e) {} }, 60);
    }
    function printList() {
        const b = curBook() || {};

        doPrint(`<h1>${esc(b.title || '予約帳')}　受け取りの一覧</h1><p>${esc(Y.dt(Date.now()))} 現在・${a.filter(r => r.st !== 'cancel').length} 件</p>
            <table><thead><tr><th>番号</th><th>お名前</th><th>${esc(b.sidLabel || '学籍番号')}</th>${items.map(i => `<th>${esc(i.name)}</th>`).join('')}<th>金額</th><th>状態</th><th>受け取り</th></tr></thead>

    }
    function printPoster() {

    function printKey() {
        const ent = curEntry();
        if (!ent || !ent.key) return;
        doPrint(`<div class="keycard"><h1>予約帳の鍵</h1><p>${esc((book && book.title) || '')}</p><div class="k">${esc(Y.keyShow(ent.key))}</div>
            <p>管理の端末をなくした時・初期化した時は、予約帳の管理のページ（yoyaku-kanri.html）で「鍵で開く」を選び、この鍵を入れてください。</p>
            <p>この紙は、予約のお名前・番号を見られる大切な物です。人に見せず、大切に保管してください。</p><p>作った日：${esc(Y.dt(Date.now()))}</p></div>`);
    }

    // ---- Google スプレッドシートへの写し ----
    // 変わった予約だけを送る（送った中身の印を覚える）。届いたかは分からないので、ときどき全部を送り直す
    let sheetT = 0;
    function rowSig(r) { return JSON.stringify([r.seq, r.name, r.sid, r.st, r.paid ? 1 : 0, r.snote || '', r.total]); }
    function sheetAuto() {
        if (viewer || !book || !Y.sheetOk(book.sheet)) return;
        clearTimeout(sheetT);
        sheetT = setTimeout(() => {
            const sent = Y.lsGet('sheet_' + bid, {});
            const full = !sent._at || Date.now() - sent._at > 30 * 60000;
            const rows = Object.values(resv).filter(r => r.seq && (full || sent[r.rid] !== rowSig(r)));
            if (!rows.length) return;
            sendRows(rows, sent);
        }, 2500);
    }
    async function sendRows(rows, sent) {
        for (let i = 0; i < rows.length; i += 200) {
            const part = rows.slice(i, i + 200);
            await Y.sheetPost(book.sheet, { kind: 'bulk', rows: part.map(r => Y.rowOf(bid, r.rid, r)) });
            part.forEach(r => { sent[r.rid] = rowSig(r); });
        }
        sent._at = Date.now();
        Y.lsSet('sheet_' + bid, sent);
    }
    async function sheetAll() {
        if (!book || !Y.sheetOk(book.sheet)) return;
        const rows = Object.values(resv).filter(r => r.seq);
        await sendRows(rows, {});
        toast(`${rows.length} 件を送りました。スプレッドシートで確かめてください`);
        if (tab === 'safe') render();
    }

    // ---- 予約帳を作る・鍵で開く ----
    function renderWelcome() {
        $('top').hidden = true;
        $('main').innerHTML = `<div class="welcome view-in"><svg class="art" viewBox="0 0 190 120"><use href="#loaf"/></svg><h2>予約帳</h2>
            <p>お客様のスマホから予約を受け付けます。予約は、レジとは別の所に置くので、レジを初期化しても・販売会を閉じても<b>消えません</b>。</p>
            <div class="choice">
                <button type="button" class="card" id="w-new" style="--off:var(--pink)"><span class="ic"><svg><use href="#i-book"/></svg></span><span><b>新しい予約帳を作る</b><span>12月のシュトーレンのひな形から始めます</span></span></button>
