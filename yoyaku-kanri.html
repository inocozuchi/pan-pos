                <button type="button" class="card" id="w-file" style="--off:var(--peach)"><span class="ic"><svg><use href="#i-open"/></svg></span><span><b>控えのファイルを開く</b><span>保存した控え（.json）を、電波がなくても見られます</span></span></button>
            </div>
            ${adm.books.length ? `<div class="sec" style="text-align:left"><h2>この端末の予約帳</h2>${adm.books.map(b => `<button type="button" class="btn sub wide" data-book="${esc(b.bid)}" style="margin-top:8px">${esc(b.title || b.bid)}</button>`).join('')}</div>` : ''}
        </div>`;
        $('w-new').onclick = createBook;
        $('w-key').onclick = openByKey;
        $('w-file').onclick = () => $('file-in').click();
        $('main').querySelectorAll('[data-book]').forEach(b => { b.onclick = () => openBook(b.dataset.book); });
    }
    function templateBook(uid) {
        const now = new Date();
        const y = now.getMonth() >= 11 && now.getDate() > 20 ? now.getFullYear() + 1 : now.getFullYear();
        const to = new Date(y, 11, 10, 23, 59).getTime();
        return {
            owners: [uid], title: '12月 シュトーレンのご予約', shop: '', lead: 'ドライフルーツとナッツを練りこんだ、冬だけの焼き菓子です。少しずつ切って、クリスマスまでの日々をお楽しみください。',
            pickup: '', note: 'お支払いは、受け取りの時にお願いします。', on: false, from: Date.now(), to: Math.max(to, Date.now() + 7 * 86400000),
            items: [{ id: 'st', name: 'シュトーレン', price: 1500, cap: 0, desc: '', off: false }],
            maxQty: 5, sidLabel: '学籍番号', sidReq: true, sheet: '', theme: 'stollen', at: Date.now(), ver: 1
        };
    }
    async function createBook() {
        const btn = $('w-new');
        if (btn) btn.classList.add('busy');
        try {
            c = c || await Y.connect({ persist: true });
            const nb = Y.newBid(), key = Y.newKey();
            // 先にこの端末に覚える（途中で止まっても、鍵と印が残るように）
            adm.books.push({ bid: nb, key, title: '12月 シュトーレンのご予約', at: Date.now() });
            adm.cur = nb;
            saveAdm();
            const ref = c.db.collection('books').doc(nb);
            await Y.withTimeout(ref.set(templateBook(c.uid)), 20000);
            await makeKeyFor(nb, key);
            tab = 'set';
            await openBook(nb);
            showKeyCard(key, true);
        } catch (e) {
            if (btn) btn.classList.remove('busy');
            toast(Y.isNet(e) ? 'つながっていないので、作れませんでした' : '作れませんでした');
        }
    }
    async function makeKeyFor(b, key) {
        const ref = c.db.collection('books').doc(b);
        const batch = c.db.batch();
        batch.set(ref.collection('keys').doc(key), { at: Date.now(), by: c.uid });
        batch.set(c.db.collection('bookkeys').doc(key), { book: b, at: Date.now() });
        await Y.withTimeout(batch.commit(), 20000);
    }
    async function makeKey(show) {
        try {
            const key = Y.newKey();
            const ent = curEntry();
            await makeKeyFor(bid, key);
            if (ent) { ent.key = key; saveAdm(); }
            render();
            if (show) showKeyCard(key, false);
        } catch (e) { toast('鍵を作れませんでした'); }
    }
    function showKeyCard(key, first) {
        const s = openSheet(`<h3>予約帳の鍵<button type="button" class="icon-btn close" data-x aria-label="閉じる"><svg><use href="#i-x"/></svg></button></h3>
            <p style="margin:0">${first ? '予約帳ができました。' : ''}この端末をなくした時・初期化した時に、ほかの端末から管理者に戻るための鍵です。<b>今すぐ印刷するか、写真・紙に控えて</b>、大切に保管してください。</p>
            <div class="key" style="margin-top:14px">${esc(Y.keyShow(key))}</div>
            <div class="row-btns"><button type="button" class="btn" data-k="print"><svg><use href="#i-print"/></svg>印刷する</button><button type="button" class="btn sub" data-k="copy"><svg><use href="#i-key"/></svg>コピー</button></div>
            <p class="muted" style="margin:12px 2px 0">鍵は「控え・鍵」のタブでも見られます。</p>`);
        s.addEventListener('click', e => {
            if (e.target.closest('[data-x]')) { closeSheet(); return; }
            const k = e.target.closest('[data-k]');
            if (k && k.dataset.k === 'print') printKey();
            if (k && k.dataset.k === 'copy') copyText(Y.keyShow(key), '鍵をコピーしました');
        });
    }
    async function openByKey() {
        const raw = prompt('予約帳の鍵を入れてください（ハイフンはなくてもよい）');
        const key = Y.keyNorm(raw);
        if (!key) return;
        if (key.length < 20) { toast('鍵の長さが足りません'); return; }
        try {
            c = c || await Y.connect({ persist: true });
            const s = await Y.withTimeout(c.db.collection('bookkeys').doc(key).get(), 15000);
            if (!s.exists) { toast('この鍵の予約帳は見つかりませんでした'); return; }
            const b = s.data().book;
            await claimWithKey(key, b);
            const bs = await c.db.collection('books').doc(b).get();
            const ent = adm.books.find(x => x.bid === b);
            if (ent) ent.key = key; else adm.books.push({ bid: b, key, title: (bs.data() || {}).title || '', at: Date.now() });
            adm.cur = b;
            saveAdm();
            tab = 'list';
            await openBook(b);
            toast('予約帳を開きました。この端末も管理者になりました');
        } catch (e) { toast(Y.isNet(e) ? 'つながっていないので、開けませんでした' : '開けませんでした。鍵を確かめてください'); }
    }
    function openMenu() {
        const s = openSheet(`<h3>予約帳<button type="button" class="icon-btn close" data-x aria-label="閉じる"><svg><use href="#i-x"/></svg></button></h3>
            ${adm.books.map(b => `<button type="button" class="btn ${b.bid === bid ? '' : 'sub'} wide" data-book="${esc(b.bid)}" style="margin-top:8px">${esc(b.title || b.bid)}${b.bid === bid ? '（いま開いている）' : ''}</button>`).join('')}
            <div class="row-btns"><button type="button" class="btn sub" data-m="new"><svg><use href="#i-plus"/></svg>新しい予約帳</button><button type="button" class="btn sub" data-m="key"><svg><use href="#i-key"/></svg>鍵で開く</button><button type="button" class="btn sub" data-m="file"><svg><use href="#i-open"/></svg>控えのファイルを開く</button></div>`);
        s.addEventListener('click', e => {
            if (e.target.closest('[data-x]')) { closeSheet(); return; }
            const b = e.target.closest('[data-book]');
            if (b) { closeSheet(); tab = 'list'; openBook(b.dataset.book); return; }
            const m = e.target.closest('[data-m]');
            if (!m) return;
            closeSheet();
            if (m.dataset.m === 'new') { if (confirm('新しい予約帳を作りますか？（今の予約帳は、そのまま残ります）')) createBook(); }
            if (m.dataset.m === 'key') openByKey();
            if (m.dataset.m === 'file') $('file-in').click();
        });
    }
    // 何も変わらなくても、ときどき（30分ごと）全部を送り直す
    setInterval(() => { if (bid && !viewer) sheetAuto(); }, 10 * 60000);
    addEventListener('beforeunload', e => { if (draftDirty) { e.preventDefault(); e.returnValue = ''; } });

    boot();
})();
</script>
</body>
</html>
